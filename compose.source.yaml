# Source mounts for the backend services, layered over compose.yaml when their
# image is built from this checkout (bin/tools/compose-files.sh decides). An
# edit then applies on `just restart`. A published image runs without them:
# mounted over one, the checkout would run on that release's dependencies and
# migrations.
services:
  api:
    volumes:
      - ./robosystems:/app/robosystems

  graph-api:
    volumes:
      - ./robosystems:/app/robosystems

  dagster-webserver:
    volumes:
      - ./robosystems:/app/robosystems

  dagster-daemon:
    volumes:
      - ./robosystems:/app/robosystems

  worker:
    volumes:
      - ./robosystems:/app/robosystems
