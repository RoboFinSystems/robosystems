name: Build

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      ecr_repository:
        required: true
        type: string
      publish_to_dockerhub:
        required: false
        type: boolean
        default: false
        description: "Whether to publish images to Docker Hub"
    outputs:
      image:
        description: "Full image reference with tag"
        value: ${{ jobs.docker.outputs.image }}
      image_tag:
        description: "Image tag (git-sha based, use this for deployments)"
        value: ${{ jobs.docker.outputs.image_tag }}
      version_tag:
        description: "Version tag (v1.2.3) if release, empty otherwise (metadata only)"
        value: ${{ jobs.docker.outputs.version_tag }}
      ecr_repository_url:
        description: "ECR repository URL"
        value: ${{ jobs.docker.outputs.ecr_repository_url }}
      lambda_image:
        description: "Lambda container image reference"
        value: ${{ jobs.lambda.outputs.lambda_image }}
      is_release:
        description: "Whether this is a release build"
        value: ${{ jobs.docker.outputs.is_release }}

    secrets:
      DOCKERHUB_USERNAME:
        description: "Docker Hub username for publishing"
        required: false
      DOCKERHUB_TOKEN:
        description: "Docker Hub token for publishing"
        required: false

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      version_tag: ${{ steps.resolve.outputs.version_tag }}
      ecr_repository_url: ${{ steps.resolve.outputs.ecr_repository_url }}
      is_release: ${{ steps.resolve.outputs.is_release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Login to Docker Hub
        if: ${{ inputs.publish_to_dockerhub == true }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve image tag and check existence
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
        run: |
          # Git SHA is the source of truth for image identity
          GIT_SHA="${GITHUB_SHA:0:12}"
          IMAGE_TAG="git-${GIT_SHA}"

          # Determine version tag for releases (metadata for ECR, pinned for Docker Hub)
          VERSION_TAG=""
          IS_RELEASE="false"

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
            IS_RELEASE="true"
            echo "📦 Release detected: $VERSION_TAG"
          elif [[ "$GITHUB_REF" == refs/heads/release/* ]]; then
            BRANCH_VERSION="${GITHUB_REF#refs/heads/release/}"
            VERSION_TAG="v${BRANCH_VERSION}-hotfix.${GIT_SHA}"
            IS_RELEASE="true"
            echo "🔥 Hotfix detected: $VERSION_TAG"
          else
            echo "🔧 Development build: $IMAGE_TAG"
          fi

          # Check if image already exists in ECR
          # Always build for Docker Hub releases (need multi-arch + attestations)
          ECR_URL="${ECR_REGISTRY}/${ECR_REPOSITORY}"
          if [[ "${{ inputs.publish_to_dockerhub }}" == "true" ]] && [[ "$IS_RELEASE" == "true" ]]; then
            echo "🚀 Docker Hub release - will build regardless of ECR state"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          elif aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" &>/dev/null; then
            echo "✅ Image exists: ${IMAGE_TAG} - will skip build"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "🔨 Image not found: ${IMAGE_TAG} - will build"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

          # Set outputs
          echo "image=${ECR_URL}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "ecr_repository_url=${ECR_URL}" >> $GITHUB_OUTPUT
          echo "is_release=${IS_RELEASE}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        if: steps.resolve.outputs.needs_build == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
          IS_RELEASE: ${{ steps.resolve.outputs.is_release }}
        run: |
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          ECR_URL="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          # Determine platforms - add amd64 for Docker Hub multi-arch
          PLATFORMS="linux/arm64"
          if [[ "${{ inputs.publish_to_dockerhub }}" == "true" ]]; then
            PLATFORMS="linux/amd64,linux/arm64"
          fi

          # Build tags - git-sha is always the primary tag
          TAGS="-t ${ECR_URL}:${IMAGE_TAG}"

          # Add environment tag for graph container refresh (EC2 instances pull :prod/:staging via SSM)
          TAGS="$TAGS -t ${ECR_URL}:${{ inputs.environment }}"

          # Add version tag as metadata for ECR
          if [[ -n "$VERSION_TAG" ]]; then
            TAGS="$TAGS -t ${ECR_URL}:${VERSION_TAG}"
          fi

          # Add latest tag for prod environment
          if [[ "${{ inputs.environment }}" == "prod" ]] && [[ "$IS_RELEASE" == "true" ]]; then
            TAGS="$TAGS -t ${ECR_URL}:latest"
          fi

          # Docker Hub tags - version pinned for releases
          if [[ "${{ inputs.publish_to_dockerhub }}" == "true" ]] && [[ "$IS_RELEASE" == "true" ]]; then
            echo "🚀 Publishing release to Docker Hub"
            TAGS="$TAGS -t robofinsystems/robosystems:${VERSION_TAG}"
            if [[ "${{ inputs.environment }}" == "prod" ]]; then
              TAGS="$TAGS -t robofinsystems/robosystems:latest"
            fi
          fi

          # SBOM and provenance attestations for Docker Hub releases
          ATTESTATION_FLAGS=""
          if [[ "${{ inputs.publish_to_dockerhub }}" == "true" ]] && [[ "$IS_RELEASE" == "true" ]]; then
            ATTESTATION_FLAGS="--sbom=true --provenance=mode=max"
          fi

          echo "🏗️ Building with tags:"
          echo "$TAGS" | tr ' ' '\n' | grep -E '^-t' | sed 's/-t /  /'

          docker buildx build \
            --platform "$PLATFORMS" \
            --push \
            $ATTESTATION_FLAGS \
            --cache-from "type=registry,ref=${ECR_URL}:buildcache" \
            --cache-from "type=registry,ref=${ECR_URL}:deps-cache" \
            --cache-to "type=registry,ref=${ECR_URL}:buildcache,mode=max" \
            --cache-to "type=registry,ref=${ECR_URL}:deps-cache,mode=max" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg UV_CACHE_DIR=/tmp/uv-cache \
            $TAGS \
            -f Dockerfile .

      - name: Add tags to existing image
        if: steps.resolve.outputs.needs_build == 'false'
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
          VERSION_TAG: ${{ steps.resolve.outputs.version_tag }}
        run: |
          echo "🏷️ Adding tags to existing image ${IMAGE_TAG}"

          # Get the manifest of the existing image
          MANIFEST=$(aws ecr batch-get-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids imageTag="$IMAGE_TAG" \
            --query 'images[0].imageManifest' \
            --output text)

          # Add environment tag for graph container refresh (EC2 instances pull :prod/:staging via SSM)
          aws ecr put-image \
            --repository-name "$ECR_REPOSITORY" \
            --image-tag "${{ inputs.environment }}" \
            --image-manifest "$MANIFEST" 2>/dev/null || echo "Tag ${{ inputs.environment }} may already exist"

          # Add version tag if this is a release
          if [[ -n "$VERSION_TAG" ]]; then
            aws ecr put-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag "$VERSION_TAG" \
              --image-manifest "$MANIFEST" 2>/dev/null || echo "Tag ${VERSION_TAG} may already exist"
          fi

          # Add latest tag for prod
          if [[ "${{ inputs.environment }}" == "prod" ]]; then
            aws ecr put-image \
              --repository-name "$ECR_REPOSITORY" \
              --image-tag "latest" \
              --image-manifest "$MANIFEST" 2>/dev/null || echo "Tag latest may already exist"
          fi

      - name: Verify image exists
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" || exit 1
          echo "✅ Image verified: ${IMAGE_TAG}"

  # Scan Docker image for vulnerabilities
  scan:
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ needs.docker.outputs.image }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'container-scan-api'

  # Build Lambda container image
  lambda:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      lambda_image: ${{ steps.resolve.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Resolve lambda image tag
        id: resolve
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
        run: |
          GIT_SHA="${GITHUB_SHA:0:12}"
          IMAGE_TAG="lambda-git-${GIT_SHA}"
          ECR_URL="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" &>/dev/null; then
            echo "✅ Lambda image exists: ${IMAGE_TAG}"
            echo "needs_build=false" >> $GITHUB_OUTPUT
          else
            echo "🔨 Lambda image not found: ${IMAGE_TAG}"
            echo "needs_build=true" >> $GITHUB_OUTPUT
          fi

          echo "image=${ECR_URL}:${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "image_tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Build and push Lambda container image
        if: steps.resolve.outputs.needs_build == 'true'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          ECR_URL="${ECR_REGISTRY}/${ECR_REPOSITORY}"

          echo "🐑 Building Lambda container image: ${IMAGE_TAG}"

          # --provenance=false prevents OCI image index creation which Lambda doesn't support
          docker buildx build \
            --platform linux/arm64 \
            --push \
            --provenance=false \
            --cache-from "type=registry,ref=${ECR_URL}:lambda-cache" \
            --cache-to "type=registry,ref=${ECR_URL}:lambda-cache,mode=max" \
            -t "${ECR_URL}:${IMAGE_TAG}" \
            -f Dockerfile.lambda .

      - name: Verify lambda image exists
        env:
          ECR_REPOSITORY: ${{ inputs.ecr_repository }}
          IMAGE_TAG: ${{ steps.resolve.outputs.image_tag }}
        run: |
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$IMAGE_TAG" || exit 1
          echo "✅ Lambda image verified: ${IMAGE_TAG}"

  # Scan Lambda image for vulnerabilities
  scan-lambda:
    needs: lambda
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
      security-events: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: "true"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@0.35.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          image-ref: ${{ needs.lambda.outputs.lambda_image }}
          format: 'sarif'
          output: 'trivy-lambda-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-lambda-results.sarif'
          category: 'container-scan-lambda'
