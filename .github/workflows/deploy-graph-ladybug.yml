name: Deploy Graph LadybugDB

on:
  workflow_call:
    inputs:
      # Stack & Repository Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod, staging, or dev)"
        required: true
        type: string

      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string
      vpc_id:
        description: "VPC ID for deployment"
        required: true
        type: string
      subnet_ids:
        description: "Comma-separated list of private subnet IDs for instances (minimum 2 required)"
        required: true
        type: string
      valkey_sg_id:
        description: "Security Group ID for Valkey/Redis client access"
        required: true
        type: string
      valkey_url:
        description: "Valkey ElastiCache endpoint URL (e.g., redis://endpoint:6379)"
        required: true
        type: string
      # Database Configuration
      database_endpoint:
        description: "PostgreSQL database endpoint hostname"
        required: true
        type: string
      database_port:
        description: "PostgreSQL database port"
        required: false
        type: string
        default: "5432"

      # Instance Configuration
      ami_id:
        description: "Amazon Linux 2023 ARM64 AMI ID (passed from parent workflow)"
        required: false
        default: "ami-05ec8931dc5ae74ec"
        type: string

      # Auto Scaling Configuration
      min_instances:
        description: "Minimum number of instances"
        required: true
        type: string
      max_instances:
        description: "Maximum number of instances"
        required: true
        type: string

      # LadybugDB Configuration
      writer_tier:
        description: "Writer tier (ladybug-standard, ladybug-large, ladybug-xlarge, ladybug-shared)"
        required: false
        type: string
        default: "ladybug-standard"
      shared_repositories:
        description: "Comma-separated list of shared repositories (required when writer_tier is 'ladybug-shared')"
        required: false
        type: string
        default: ""
      writer_az:
        description: "Availability zone for this tier's ASG and EBS volumes (e.g. us-east-1d). Empty = <aws_region>c. A recovery/capacity lever, not tuning — see the AZ selection step."
        required: false
        type: string
        default: ""
      writer_az_change_allowed:
        description: "Permit this run to move an EXISTING stack to a different AZ. 'true' only from a per-run dispatch input, never from a variable."
        required: false
        type: string
        default: "false"
      cycle_writers:
        description: "Permit this run to replace EXISTING writer instances (a launch-template or placement change). 'true' only from a per-run dispatch input, never from a variable."
        required: false
        type: string
        default: "false"
      drain_max_minutes:
        description: "Before an opted-in writer roll: minutes to wait for in-flight writes to finish"
        required: false
        type: string
        default: "30"
      drain_force:
        description: "Skip the in-flight write wait before an opted-in roll (emergency override)"
        required: false
        type: string
        default: "false"

      # Tier Specifications (from graph.yml)
      instance_type:
        description: "EC2 instance type for this tier"
        required: true
        type: string
      databases_per_instance:
        description: "Maximum databases per instance (from graph.yml)"
        required: false
        type: string
        default: "1"

      # Other Configuration
      ecr_image_tag:
        description: "Docker image tag for LadybugDB writers"
        required: false
        type: string
        default: "latest"
      volume_detachment_topic_arn:
        description: "ARN of the Volume Detachment SNS topic from volumes stack"
        required: true
        type: string
      volume_manager_function_arn:
        description: "ARN of the Volume Manager Lambda function from volumes stack"
        required: true
        type: string

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

    outputs:
      # Graph Writer Outputs (LadybugDB Backend)
      security_group_id:
        description: "Security Group ID for graph writers"
        value: ${{ jobs.deploy.outputs.security_group_id }}
      instance_role_arn:
        description: "IAM Role ARN for graph writer instances"
        value: ${{ jobs.deploy.outputs.instance_role_arn }}
      shared_writer_instance_id:
        description: "Instance ID of the shared writer (when NodeType=shared_writer)"
        value: ${{ jobs.deploy.outputs.shared_writer_instance_id }}
      shared_writer_endpoint:
        description: "HTTP endpoint URL for shared writer (when NodeType=shared_writer)"
        value: ${{ jobs.deploy.outputs.shared_writer_endpoint }}
      writer_asg_name:
        description: "Auto Scaling Group Name for writers (when NodeType=writer)"
        value: ${{ jobs.deploy.outputs.writer_asg_name }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    # A rolling update replaces one instance at a time, so the ceiling is
    # min_instances x the stack's PauseTime — 3 x PT15M = 45 min for the
    # standard tier. Must stay above the monitor step's own timeout below, or
    # the job is killed before the monitor can report why the stack is stuck.
    # 55 min of stack monitoring + up to 30 min draining writes before a roll.
    timeout-minutes: 110
    permissions:
      id-token: write
      contents: read

    outputs:
      security_group_id: ${{ steps.get-outputs.outputs.security_group_id }}
      instance_role_arn: ${{ steps.get-outputs.outputs.instance_role_arn }}
      shared_writer_instance_id: ${{ steps.get-outputs.outputs.shared_writer_instance_id }}
      shared_writer_endpoint: ${{ steps.get-outputs.outputs.shared_writer_endpoint }}
      writer_asg_name: ${{ steps.get-outputs.outputs.writer_asg_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Configure ASG parameters
        id: asg_config
        run: |
          echo "Configuring ASG for tier: ${{ inputs.writer_tier }} in environment: ${{ inputs.environment }}"
          MIN_INSTANCES="${{ inputs.min_instances }}"
          MAX_INSTANCES="${{ inputs.max_instances }}"
          echo "min_instances=$MIN_INSTANCES" >> $GITHUB_OUTPUT
          echo "max_instances=$MAX_INSTANCES" >> $GITHUB_OUTPUT

      - name: Select Availability Zone for Persistent Volumes
        id: az_selection
        run: |
          echo "🌐 Selecting availability zone for deployment..."
          echo "⚠️  IMPORTANT: LadybugDB writers use persistent EBS volumes that are AZ-specific"

          # Every writer tier lives in ONE AZ: an EBS volume cannot cross AZs. The
          # dispatch input (writer_az + writer_az_change_allowed=true) MOVES a tier;
          # GRAPH_WRITER_AZ_<ENV> only SUSTAINS the AZ it already occupies. A writer
          # relaunched in another AZ boots on an EMPTY volume, so a mismatch with
          # the stack's current AZ is refused unless the run allows it.

          WRITER_AZ_INPUT="${{ inputs.writer_az }}"
          if [ -n "$WRITER_AZ_INPUT" ]; then
            PREFERRED_AZ="$WRITER_AZ_INPUT"
            EXPLICIT_AZ=true
          else
            PREFERRED_AZ="${{ inputs.aws_region }}c"
            EXPLICIT_AZ=false
          fi

          case "$PREFERRED_AZ" in
            "${{ inputs.aws_region }}"[a-z]) ;;
            *)
              echo "::error::writer_az '$PREFERRED_AZ' is not an availability zone in ${{ inputs.aws_region }}"
              exit 1
              ;;
          esac

          echo "📍 Preferred AZ for ${{ inputs.writer_tier }} tier: $PREFERRED_AZ (explicit: $EXPLICIT_AZ)"

          # Get all subnet IDs and their AZs
          IFS=',' read -ra SUBNET_ARRAY <<< "${{ inputs.subnet_ids }}"

          # Find the subnet in the preferred AZ
          SELECTED_SUBNET=""
          for subnet in "${SUBNET_ARRAY[@]}"; do
            SUBNET_AZ=$(aws ec2 describe-subnets --subnet-ids "$subnet" --query 'Subnets[0].AvailabilityZone' --output text)
            echo "  Checking subnet in AZ"

            if [ "$SUBNET_AZ" = "$PREFERRED_AZ" ]; then
              SELECTED_SUBNET="$subnet"
              echo "✅ Found subnet $subnet in preferred AZ $PREFERRED_AZ"
              break
            fi
          done

          if [ -z "$SELECTED_SUBNET" ]; then
            if [ "$EXPLICIT_AZ" = "true" ]; then
              # An operator asked for this zone; landing somewhere else silently is
              # exactly the failure this parameter exists to prevent.
              echo "::error::No private subnet in requested AZ $PREFERRED_AZ (subnets: ${{ inputs.subnet_ids }})"
              exit 1
            fi
            # Default zone absent (a VPC deployed with fewer AZs): use the first subnet
            SELECTED_SUBNET="${SUBNET_ARRAY[0]}"
            SELECTED_AZ=$(aws ec2 describe-subnets --subnet-ids "$SELECTED_SUBNET" --query 'Subnets[0].AvailabilityZone' --output text)
            echo "⚠️  No subnet found in $PREFERRED_AZ, using $SELECTED_SUBNET in $SELECTED_AZ"
          else
            SELECTED_AZ="$PREFERRED_AZ"
          fi

          # Guard: never move an existing stack unless this run explicitly allows it
          STACK_ACTION="create"
          CURRENT_SUBNET=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --query "Stacks[0].Parameters[?ParameterKey=='SubnetIds'].ParameterValue" \
            --output text 2>/dev/null || true)
          if [ -n "$CURRENT_SUBNET" ] && [ "$CURRENT_SUBNET" != "None" ]; then
            STACK_ACTION="update"
            if [ "$CURRENT_SUBNET" != "$SELECTED_SUBNET" ]; then
              CURRENT_AZ=$(aws ec2 describe-subnets --subnet-ids "$CURRENT_SUBNET" --query 'Subnets[0].AvailabilityZone' --output text 2>/dev/null || echo "unknown")
              if [ "${{ inputs.writer_az_change_allowed }}" != "true" ]; then
                echo "::error::${{ inputs.stack_name }} is in $CURRENT_AZ ($CURRENT_SUBNET) but this run resolved $SELECTED_AZ ($SELECTED_SUBNET). Moving a writer tier replaces every instance in its ASG, and each relaunches in the new AZ on an EMPTY volume. To move deliberately, dispatch with the graph_writer_az input; GRAPH_WRITER_AZ_<ENV> may only name the AZ the tier already occupies."
                exit 1
              fi
              echo "::warning::${{ inputs.stack_name }}: MOVING writer tier ${{ inputs.writer_tier }} from $CURRENT_AZ to $SELECTED_AZ. Every instance will be replaced and relaunch on an empty volume. Afterwards: set GRAPH_WRITER_AZ_<ENV>=$SELECTED_AZ so later releases stay here, repoint each graph-registry row at a live writer, then restore each graph from its S3 backup."
            fi
          fi

          echo "selected_az=$SELECTED_AZ" >> $GITHUB_OUTPUT
          echo "selected_subnet=$SELECTED_SUBNET" >> $GITHUB_OUTPUT

          echo "📊 Writer Tier AZ Configuration for ${{ inputs.writer_tier }}:"
          echo "  Availability Zone: $SELECTED_AZ"
          echo "  ⚠️  All instances and volumes will be created in this single AZ"
          echo ""
          echo "⚠️  TRADE-OFF: Single AZ reduces availability but ensures data persistence"
          echo "  - Pro: Volumes can always be reattached after instance replacement"
          echo "  - Con: No multi-AZ redundancy (AZ failure affects this tier)"

          {
            echo "| Writer tier | AZ | Subnet | Stack |"
            echo "|---|---|---|---|"
            echo "| ${{ inputs.writer_tier }} | $SELECTED_AZ | $SELECTED_SUBNET | $STACK_ACTION |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Get S3 Bucket Configuration
        id: s3_config
        run: |
          # Determine S3 stack name based on environment
          if [ "${{ inputs.environment }}" = "prod" ]; then
            S3_STACK_NAME="RoboSystemsS3Prod"
          else
            S3_STACK_NAME="RoboSystemsS3Staging"
          fi

          # Query S3 stack outputs for bucket names/ARNs (single source of truth)
          S3_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$S3_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)

          DEPLOYMENT_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="DeploymentBucketArn") | .OutputValue')
          SHARED_PROCESSED_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="SharedProcessedBucketArn") | .OutputValue')
          USER_DATA_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserDataBucketArn") | .OutputValue')

          echo "deployment_bucket_arn=$DEPLOYMENT_BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "shared_processed_bucket_arn=$SHARED_PROCESSED_BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "user_data_bucket_arn=$USER_DATA_BUCKET_ARN" >> $GITHUB_OUTPUT

          echo "📦 S3 Bucket Configuration:"
          echo "  Deployment: $DEPLOYMENT_BUCKET_ARN"

      - name: Deploy Graph LadybugDB CloudFormation stack
        id: deploy-stack
        run: |
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'Stack with id ${{ inputs.stack_name }} does not exist'; then
            STACK_ACTION="create-stack"
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          # Build parameters
          # Use selected subnet for shared tier, all subnets for others
          SUBNET_PARAM="${{ steps.az_selection.outputs.selected_subnet }}"

          LBUG_STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
                ParameterKey=DeploymentBucketArn,ParameterValue=${{ steps.s3_config.outputs.deployment_bucket_arn }} \
                ParameterKey=SharedProcessedBucketArn,ParameterValue=${{ steps.s3_config.outputs.shared_processed_bucket_arn }} \
                ParameterKey=UserDataBucketArn,ParameterValue=${{ steps.s3_config.outputs.user_data_bucket_arn }} \
                ParameterKey=SNSAlertEmail,ParameterValue=${{ inputs.aws_sns_alert_email }} \
                ParameterKey=VpcId,ParameterValue=${{ inputs.vpc_id }} \
                ParameterKey=VpcCidr,ParameterValue=\"10.0.0.0/16\" \
                ParameterKey=SubnetIds,ParameterValue=\"$SUBNET_PARAM\" \
                ParameterKey=ValkeyClientSecurityGroupId,ParameterValue=${{ inputs.valkey_sg_id }} \
                ParameterKey=ValkeyUrl,ParameterValue=${{ inputs.valkey_url }} \
                ParameterKey=DatabaseEndpoint,ParameterValue=${{ inputs.database_endpoint }} \
                ParameterKey=DatabasePort,ParameterValue=${{ inputs.database_port }} \
                ParameterKey=AmiId,ParameterValue=${{ inputs.ami_id }} \
                ParameterKey=WriterTier,ParameterValue=${{ inputs.writer_tier }} \
                ParameterKey=MinInstances,ParameterValue=${{ inputs.min_instances }} \
                ParameterKey=MaxInstances,ParameterValue=${{ inputs.max_instances }} \
                ParameterKey=InstanceType,ParameterValue=${{ inputs.instance_type }} \
                ParameterKey=DatabasesPerInstance,ParameterValue=${{ inputs.databases_per_instance }} \
                ParameterKey=ECRImageTag,ParameterValue=${{ inputs.ecr_image_tag }} \
                ParameterKey=VolumeDetachmentTopicArn,ParameterValue=\"${{ inputs.volume_detachment_topic_arn }}\" \
                ParameterKey=VolumeManagerFunctionArn,ParameterValue=\"${{ inputs.volume_manager_function_arn }}\" \
                ParameterKey=SharedRepositories,ParameterValue=\"${{ inputs.shared_repositories }}\" \
                ParameterKey=ServiceTag,ParameterValue=\"RoboSystems\" \
                ParameterKey=ComponentTag,ParameterValue=\"LadybugWriter\""

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            # Create new stack
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/graph-ladybug.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $LBUG_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=LadybugWriter \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            # Preview the update as a change set. Replacing a writer moves its
            # data volume, so a change that would cycle the writers runs only
            # when this run opts in (cycle_writers, or a deliberate AZ move).
            CHANGE_SET="gha-${{ github.run_id }}-${{ github.run_attempt }}"
            aws cloudformation create-change-set \
              --stack-name ${{ inputs.stack_name }} \
              --change-set-name "$CHANGE_SET" \
              --change-set-type UPDATE \
              --template-body file://cloudformation/graph-ladybug.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $LBUG_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=LadybugWriter \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions > /dev/null

            if ! aws cloudformation wait change-set-create-complete \
                --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET"; then
              REASON=$(aws cloudformation describe-change-set \
                --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET" \
                --query StatusReason --output text)
              aws cloudformation delete-change-set \
                --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET"
              if echo "$REASON" | grep -qiE "didn't contain changes|no updates are to be performed"; then
                echo "Stack is already up to date - no changes needed"
                exit 0
              fi
              echo "::error::Change set for ${{ inputs.stack_name }} failed: $REASON"
              exit 1
            fi

            aws cloudformation describe-change-set \
              --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET" \
              --output json > change-set.json
            GUARD=$(python3 bin/tools/writer_cycle_guard.py < change-set.json)
            CYCLES=$(echo "$GUARD" | jq -r '.cycles_writers')

            if [ "$CYCLES" = "true" ] \
                && [ "${{ inputs.cycle_writers }}" != "true" ] \
                && [ "${{ inputs.writer_az_change_allowed }}" != "true" ]; then
              aws cloudformation delete-change-set \
                --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET"
              echo "writer_cycle_pending=true" >> $GITHUB_OUTPUT
              echo "::warning::${{ inputs.stack_name }}: update skipped because it would replace the ${{ inputs.writer_tier }} writers. Re-run this environment's deploy at the same ref with cycle_writers=true to roll them."
              {
                echo "### ⏸️ Writer roll pending: ${{ inputs.writer_tier }}"
                echo ""
                echo "This deploy would replace the writer instances of \`${{ inputs.stack_name }}\`, so its update was skipped. The rest of the release deployed."
                echo ""
                echo "$GUARD" | jq -r '.reasons[] | "- " + .'
                echo ""
                echo "To roll them at a time you choose: re-run \`${{ inputs.environment }}.yml\` at this ref with \`cycle_writers\` on."
              } >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            if [ "$CYCLES" = "true" ]; then
              echo "::notice::${{ inputs.stack_name }}: replacing the ${{ inputs.writer_tier }} writers (opted in): $(echo "$GUARD" | jq -r '.reasons | join("; ")')"
              # deploy-graph.yml has already paused new graph writes for the
              # whole writer deploy; drain the ones still in flight on this tier.
              DRAIN_MINUTES=${{ inputs.drain_max_minutes }}
              if [ "$DRAIN_MINUTES" -gt 40 ]; then
                echo "::warning::Drain capped at 40 minutes (asked for $DRAIN_MINUTES) to fit the job timeout."
                DRAIN_MINUTES=40
              fi
              ASG_NAME=$(aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} \
                --query "Stacks[0].Outputs[?OutputKey=='WriterAutoScalingGroupName'].OutputValue" \
                --output text)
              if ! bin/tools/wait-graph-writers-idle.sh "${{ inputs.environment }}" "${{ inputs.aws_region }}" \
                  "$ASG_NAME" "$DRAIN_MINUTES" "${{ inputs.drain_force }}"; then
                aws cloudformation delete-change-set \
                  --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET"
                echo "::error::${{ inputs.stack_name }}: writes did not drain; the roll was not started."
                exit 1
              fi
            fi
            aws cloudformation execute-change-set \
              --stack-name ${{ inputs.stack_name }} --change-set-name "$CHANGE_SET"
            # Execution is asynchronous: until the stack leaves its previous
            # *_COMPLETE state, the monitor would read the old status as done.
            for _ in $(seq 1 60); do
              STATUS=$(aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} \
                --query 'Stacks[0].StackStatus' --output text)
              case "$STATUS" in *_IN_PROGRESS) break ;; esac
              sleep 2
            done
            echo "Stack update initiated successfully ($STATUS)"
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          # 55 min: clears the 45-min worst case (3 standard writers x PT15M)
          # with headroom, and stays under the job's timeout-minutes so a stuck
          # rollout surfaces here as a reported failure rather than a killed job.
          timeout: "3300"
          interval: "10"

      - name: Get Stack Outputs
        id: get-outputs
        run: |
          # Get stack outputs after deployment
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --query 'Stacks[0].Outputs' \
            --output json)

          # Extract outputs from CloudFormation stack
          WRITER_ASG_NAME=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="WriterAutoScalingGroupName") | .OutputValue // empty')
          SECURITY_GROUP_ID=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="WriterSecurityGroupId") | .OutputValue // empty')

          # Set outputs
          echo "writer_asg_name=${WRITER_ASG_NAME}" >> $GITHUB_OUTPUT
          echo "security_group_id=${SECURITY_GROUP_ID}" >> $GITHUB_OUTPUT

          if [ -n "$WRITER_ASG_NAME" ]; then
            echo "🏢 Writer ASG: ${WRITER_ASG_NAME}"
          fi

      - name: Update Deployment Status
        if: always()
        run: |
          # Output deployment status for the main workflow
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "LadybugDB Writers stack creation completed"
          else
            echo "LadybugDB Writers stack update completed"
          fi
