name: Deploy Graph LadybugDB

on:
  workflow_call:
    inputs:
      # Stack & Repository Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod, staging, or dev)"
        required: true
        type: string

      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string
      vpc_id:
        description: "VPC ID for deployment"
        required: true
        type: string
      subnet_ids:
        description: "Comma-separated list of private subnet IDs for instances (minimum 2 required)"
        required: true
        type: string
      valkey_sg_id:
        description: "Security Group ID for Valkey/Redis client access"
        required: true
        type: string
      valkey_url:
        description: "Valkey ElastiCache endpoint URL (e.g., redis://endpoint:6379)"
        required: true
        type: string
      # Database Configuration
      database_endpoint:
        description: "PostgreSQL database endpoint hostname"
        required: true
        type: string
      database_port:
        description: "PostgreSQL database port"
        required: false
        type: string
        default: "5432"

      # Instance Configuration
      ami_id:
        description: "Amazon Linux 2023 ARM64 AMI ID (passed from parent workflow)"
        required: false
        default: "ami-05ec8931dc5ae74ec"
        type: string

      # Auto Scaling Configuration
      min_instances:
        description: "Minimum number of instances"
        required: true
        type: string
      max_instances:
        description: "Maximum number of instances"
        required: true
        type: string

      # LadybugDB Configuration
      writer_tier:
        description: "Writer tier (ladybug-standard, ladybug-large, ladybug-xlarge, ladybug-shared)"
        required: false
        type: string
        default: "ladybug-standard"
      shared_repositories:
        description: "Comma-separated list of shared repositories (required when writer_tier is 'ladybug-shared')"
        required: false
        type: string
        default: ""

      # Tier Specifications (from graph.yml)
      instance_type:
        description: "EC2 instance type for this tier"
        required: true
        type: string
      databases_per_instance:
        description: "Maximum databases per instance (from graph.yml)"
        required: false
        type: string
        default: "1"

      # Other Configuration
      ecr_image_tag:
        description: "Docker image tag for LadybugDB writers"
        required: false
        type: string
        default: "latest"
      volume_detachment_topic_arn:
        description: "ARN of the Volume Detachment SNS topic from volumes stack"
        required: true
        type: string
      volume_manager_function_arn:
        description: "ARN of the Volume Manager Lambda function from volumes stack"
        required: true
        type: string

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

    outputs:
      # Graph Writer Outputs (LadybugDB Backend)
      security_group_id:
        description: "Security Group ID for graph writers"
        value: ${{ jobs.deploy.outputs.security_group_id }}
      instance_role_arn:
        description: "IAM Role ARN for graph writer instances"
        value: ${{ jobs.deploy.outputs.instance_role_arn }}
      shared_writer_instance_id:
        description: "Instance ID of the shared writer (when NodeType=shared_writer)"
        value: ${{ jobs.deploy.outputs.shared_writer_instance_id }}
      shared_writer_endpoint:
        description: "HTTP endpoint URL for shared writer (when NodeType=shared_writer)"
        value: ${{ jobs.deploy.outputs.shared_writer_endpoint }}
      writer_asg_name:
        description: "Auto Scaling Group Name for writers (when NodeType=writer)"
        value: ${{ jobs.deploy.outputs.writer_asg_name }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    outputs:
      security_group_id: ${{ steps.get-outputs.outputs.security_group_id }}
      instance_role_arn: ${{ steps.get-outputs.outputs.instance_role_arn }}
      shared_writer_instance_id: ${{ steps.get-outputs.outputs.shared_writer_instance_id }}
      shared_writer_endpoint: ${{ steps.get-outputs.outputs.shared_writer_endpoint }}
      writer_asg_name: ${{ steps.get-outputs.outputs.writer_asg_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Configure ASG parameters
        id: asg_config
        run: |
          echo "Configuring ASG for tier: ${{ inputs.writer_tier }} in environment: ${{ inputs.environment }}"
          MIN_INSTANCES="${{ inputs.min_instances }}"
          MAX_INSTANCES="${{ inputs.max_instances }}"
          echo "min_instances=$MIN_INSTANCES" >> $GITHUB_OUTPUT
          echo "max_instances=$MAX_INSTANCES" >> $GITHUB_OUTPUT

      - name: Select Availability Zone for Persistent Volumes
        id: az_selection
        run: |
          echo "🌐 Selecting availability zone for deployment..."
          echo "⚠️  IMPORTANT: LadybugDB writers use persistent EBS volumes that are AZ-specific"

          # ALL tiers need consistent AZ to ensure volume persistence
          # EBS volumes cannot be moved between AZs, so instance replacement in a different AZ
          # means data loss unless we restrict to a single AZ

          echo "📍 Selecting single AZ for ALL writer tiers to ensure volume persistence"

          # Use zone C for ALL tiers to consolidate resources
          PREFERRED_AZ="${{ inputs.aws_region }}c"

          echo "📍 Preferred AZ for ${{ inputs.writer_tier }} tier: $PREFERRED_AZ"

          # Get all subnet IDs and their AZs
          IFS=',' read -ra SUBNET_ARRAY <<< "${{ inputs.subnet_ids }}"

          # Find the subnet in the preferred AZ
          SELECTED_SUBNET=""
          for subnet in "${SUBNET_ARRAY[@]}"; do
            SUBNET_AZ=$(aws ec2 describe-subnets --subnet-ids "$subnet" --query 'Subnets[0].AvailabilityZone' --output text)
            echo "  Checking subnet in AZ"

            if [ "$SUBNET_AZ" = "$PREFERRED_AZ" ]; then
              SELECTED_SUBNET="$subnet"
              echo "✅ Found subnet $subnet in preferred AZ $PREFERRED_AZ"
              break
            fi
          done

          # If no subnet found in preferred AZ, use the first available one
          if [ -z "$SELECTED_SUBNET" ]; then
            SELECTED_SUBNET="${SUBNET_ARRAY[0]}"
            SELECTED_AZ=$(aws ec2 describe-subnets --subnet-ids "$SELECTED_SUBNET" --query 'Subnets[0].AvailabilityZone' --output text)
            echo "⚠️  No subnet found in $PREFERRED_AZ, using $SELECTED_SUBNET in $SELECTED_AZ"
            echo "selected_az=$SELECTED_AZ" >> $GITHUB_OUTPUT
          else
            echo "selected_az=$PREFERRED_AZ" >> $GITHUB_OUTPUT
          fi

          echo "selected_subnet=$SELECTED_SUBNET" >> $GITHUB_OUTPUT
          echo "use_single_subnet=true" >> $GITHUB_OUTPUT

          echo "📊 Writer Tier AZ Configuration for ${{ inputs.writer_tier }}:"
          echo "  Subnet selected successfully"
          echo "  Availability Zone: ${SELECTED_AZ:-$PREFERRED_AZ}"
          echo "  ⚠️  All instances and volumes will be created in this single AZ"
          echo ""
          echo "⚠️  TRADE-OFF: Single AZ reduces availability but ensures data persistence"
          echo "  - Pro: Volumes can always be reattached after instance replacement"
          echo "  - Con: No multi-AZ redundancy (AZ failure affects this tier)"

      - name: Get S3 Bucket Configuration
        id: s3_config
        run: |
          # Determine S3 stack name based on environment
          if [ "${{ inputs.environment }}" = "prod" ]; then
            S3_STACK_NAME="RoboSystemsS3Prod"
          else
            S3_STACK_NAME="RoboSystemsS3Staging"
          fi

          # Query S3 stack outputs for bucket names/ARNs (single source of truth)
          S3_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$S3_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)

          DEPLOYMENT_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="DeploymentBucketArn") | .OutputValue')
          SHARED_PROCESSED_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="SharedProcessedBucketArn") | .OutputValue')
          USER_DATA_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="UserDataBucketArn") | .OutputValue')

          echo "deployment_bucket_arn=$DEPLOYMENT_BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "shared_processed_bucket_arn=$SHARED_PROCESSED_BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "user_data_bucket_arn=$USER_DATA_BUCKET_ARN" >> $GITHUB_OUTPUT

          echo "📦 S3 Bucket Configuration:"
          echo "  Deployment: $DEPLOYMENT_BUCKET_ARN"

      - name: Deploy Graph LadybugDB CloudFormation stack
        id: deploy-stack
        run: |
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'Stack with id ${{ inputs.stack_name }} does not exist'; then
            STACK_ACTION="create-stack"
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          # Build parameters
          # Use selected subnet for shared tier, all subnets for others
          SUBNET_PARAM="${{ steps.az_selection.outputs.selected_subnet }}"

          LBUG_STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
                ParameterKey=DeploymentBucketArn,ParameterValue=${{ steps.s3_config.outputs.deployment_bucket_arn }} \
                ParameterKey=SharedProcessedBucketArn,ParameterValue=${{ steps.s3_config.outputs.shared_processed_bucket_arn }} \
                ParameterKey=UserDataBucketArn,ParameterValue=${{ steps.s3_config.outputs.user_data_bucket_arn }} \
                ParameterKey=SNSAlertEmail,ParameterValue=${{ inputs.aws_sns_alert_email }} \
                ParameterKey=VpcId,ParameterValue=${{ inputs.vpc_id }} \
                ParameterKey=VpcCidr,ParameterValue=\"10.0.0.0/16\" \
                ParameterKey=SubnetIds,ParameterValue=\"$SUBNET_PARAM\" \
                ParameterKey=ValkeyClientSecurityGroupId,ParameterValue=${{ inputs.valkey_sg_id }} \
                ParameterKey=ValkeyUrl,ParameterValue=${{ inputs.valkey_url }} \
                ParameterKey=DatabaseEndpoint,ParameterValue=${{ inputs.database_endpoint }} \
                ParameterKey=DatabasePort,ParameterValue=${{ inputs.database_port }} \
                ParameterKey=AmiId,ParameterValue=${{ inputs.ami_id }} \
                ParameterKey=WriterTier,ParameterValue=${{ inputs.writer_tier }} \
                ParameterKey=MinInstances,ParameterValue=${{ inputs.min_instances }} \
                ParameterKey=MaxInstances,ParameterValue=${{ inputs.max_instances }} \
                ParameterKey=InstanceType,ParameterValue=${{ inputs.instance_type }} \
                ParameterKey=DatabasesPerInstance,ParameterValue=${{ inputs.databases_per_instance }} \
                ParameterKey=ECRImageTag,ParameterValue=${{ inputs.ecr_image_tag }} \
                ParameterKey=VolumeDetachmentTopicArn,ParameterValue=\"${{ inputs.volume_detachment_topic_arn }}\" \
                ParameterKey=VolumeManagerFunctionArn,ParameterValue=\"${{ inputs.volume_manager_function_arn }}\" \
                ParameterKey=SharedRepositories,ParameterValue=\"${{ inputs.shared_repositories }}\" \
                ParameterKey=ServiceTag,ParameterValue=\"RoboSystems\" \
                ParameterKey=ComponentTag,ParameterValue=\"LadybugWriter\""

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            # Create new stack
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/graph-ladybug.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $LBUG_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=LadybugWriter \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            # Update existing stack, handling "No updates" error
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/graph-ladybug.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $LBUG_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=LadybugWriter \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions 2>&1) || true

            # Check if the error was "No updates are to be performed"
            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "Stack is already up to date - no changes needed"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "Stack update initiated successfully"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: "1800"
          interval: "10"

      - name: Get Stack Outputs
        id: get-outputs
        run: |
          # Get stack outputs after deployment
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --query 'Stacks[0].Outputs' \
            --output json)

          # Extract outputs from CloudFormation stack
          WRITER_ASG_NAME=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="WriterAutoScalingGroupName") | .OutputValue // empty')
          SECURITY_GROUP_ID=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="WriterSecurityGroupId") | .OutputValue // empty')

          # Set outputs
          echo "writer_asg_name=${WRITER_ASG_NAME}" >> $GITHUB_OUTPUT
          echo "security_group_id=${SECURITY_GROUP_ID}" >> $GITHUB_OUTPUT

          if [ -n "$WRITER_ASG_NAME" ]; then
            echo "🏢 Writer ASG: ${WRITER_ASG_NAME}"
          fi

      - name: Update Deployment Status
        if: always()
        run: |
          # Output deployment status for the main workflow
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "LadybugDB Writers stack creation completed"
          else
            echo "LadybugDB Writers stack update completed"
          fi
