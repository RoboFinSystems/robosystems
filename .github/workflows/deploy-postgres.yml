name: Deploy Postgres

on:
  workflow_call:
    inputs:
      # Stack & Repository Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod, staging, or dev)"
        required: true
        type: string

      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string
      vpc_id:
        description: "VPC ID for RDS instance"
        required: true
        type: string
      vpc_cidr:
        description: "VPC CIDR block admitted to the database port (from the VPC stack)"
        required: true
        type: string
      subnet_ids:
        description: "Comma-separated subnet IDs for RDS (minimum 2 for multi-AZ)"
        required: true
        type: string

      # Database Version Configuration
      postgres_version:
        description: "PostgreSQL major version floor (e.g., 16). Minors auto-upgrade; bump only for a deliberate major upgrade."
        required: false
        type: string
        default: "16"

      # Instance Configuration
      instance_size:
        description: "Database instance type for PostgreSQL"
        required: true
        type: string
      allocated_storage:
        description: "Initial storage size in GB"
        required: false
        type: string
        default: "20"
      allocated_max_storage:
        description: "Maximum storage size in GB"
        required: false
        type: string
        default: "100"

      # High Availability Configuration
      multi_az_enabled:
        description: "Enable Multi-AZ deployment for high availability (increases cost ~2x)"
        required: false
        type: string
        default: "false"

      # Accidental-deletion protection (recommended on for prod/staging; no added cost)
      deletion_protection_enabled:
        description: "Block accidental deletion of the RDS instance (set false only for an intentional teardown)"
        required: false
        type: string
        default: "true"

      # RDS Proxy Configuration (off by default)
      rds_proxy_enabled:
        description: "Enable RDS Proxy for connection pooling (costs ~$0.015/vCPU/hour when enabled)"
        required: false
        type: string
        default: "false"
      rds_proxy_max_connections_percent:
        description: "Maximum percentage of DB max_connections the proxy can use (1-100)"
        required: false
        type: string
        default: "100"
      rds_proxy_connection_borrow_timeout:
        description: "Seconds a client waits for a pooled connection before the proxy errors (1-3600)"
        required: false
        type: string
        default: "120"

      # Performance Insights (CloudWatch Database Insights - Standard mode; free at 7-day retention)
      performance_insights_enabled:
        description: "Enable RDS Performance Insights / Database Insights Standard mode"
        required: false
        type: string
        default: "false"
      performance_insights_retention_days:
        description: "Performance Insights retention in days (7 = free tier; 31/62/93/186/372/731 = paid)"
        required: false
        type: string
        default: "7"

      # Lambda Configuration
      lambda_image_uri:
        description: "ECR image URI for Lambda functions (container-based deployment)"
        required: true
        type: string

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

    outputs:
      postgres_secret_arn:
        description: "ARN of the PostgreSQL secret in Secrets Manager"
        value: ${{ jobs.deploy.outputs.postgres_secret_arn }}
      database_sg_id:
        description: "RDS Security Group ID for database access"
        value: ${{ jobs.deploy.outputs.database_sg_id }}
      database_endpoint:
        description: "PostgreSQL database endpoint hostname"
        value: ${{ jobs.deploy.outputs.database_endpoint }}
      database_port:
        description: "PostgreSQL database port"
        value: ${{ jobs.deploy.outputs.database_port }}
      database_proxy_endpoint:
        description: "RDS Proxy endpoint hostname (empty when rds_proxy_enabled=false)"
        value: ${{ jobs.deploy.outputs.database_proxy_endpoint }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30  # RDS major version upgrades can take 20-30 min
    permissions:
      id-token: write
      contents: read
    outputs:
      postgres_secret_arn: ${{ steps.stack-outputs.outputs.postgres_secret_arn }}
      database_sg_id: ${{ steps.stack-outputs.outputs.database_sg_id }}
      database_endpoint: ${{ steps.stack-outputs.outputs.database_endpoint }}
      database_port: ${{ steps.stack-outputs.outputs.database_port }}
      database_proxy_endpoint: ${{ steps.stack-outputs.outputs.database_proxy_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy Postgres CloudFormation Stack
        id: deploy-stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'Stack with id ${{ inputs.stack_name }} does not exist'; then
            STACK_ACTION="create-stack"
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          POSTGRES_STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
                ParameterKey=DBInstanceClass,ParameterValue=${{ inputs.instance_size }} \
                ParameterKey=DBAllocatedStorage,ParameterValue=${{ inputs.allocated_storage }} \
                ParameterKey=DBMaxAllocatedStorage,ParameterValue=${{ inputs.allocated_max_storage }} \
                ParameterKey=EnableMultiAZ,ParameterValue=${{ inputs.multi_az_enabled }} \
                ParameterKey=EnableDeletionProtection,ParameterValue=${{ inputs.deletion_protection_enabled }} \
                ParameterKey=EnableRDSProxy,ParameterValue=${{ inputs.rds_proxy_enabled }} \
                ParameterKey=RDSProxyMaxConnectionsPercent,ParameterValue=${{ inputs.rds_proxy_max_connections_percent }} \
                ParameterKey=RDSProxyConnectionBorrowTimeout,ParameterValue=${{ inputs.rds_proxy_connection_borrow_timeout }} \
                ParameterKey=EnablePerformanceInsights,ParameterValue=${{ inputs.performance_insights_enabled }} \
                ParameterKey=PerformanceInsightsRetentionPeriod,ParameterValue=${{ inputs.performance_insights_retention_days }} \
                ParameterKey=VpcId,ParameterValue=${{ inputs.vpc_id }} \
                ParameterKey=VpcCidr,ParameterValue=${{ inputs.vpc_cidr }} \
                ParameterKey=SubnetId1,ParameterValue=$(echo ${{ inputs.subnet_ids }} | cut -d ',' -f1) \
                ParameterKey=SubnetId2,ParameterValue=$(echo ${{ inputs.subnet_ids }} | cut -d ',' -f2) \
                ParameterKey=SNSAlertEmail,ParameterValue=${{ inputs.aws_sns_alert_email }} \
                ParameterKey=LambdaImageUri,ParameterValue=${{ inputs.lambda_image_uri }} \
                ParameterKey=PostgresEngineVersion,ParameterValue=${{ inputs.postgres_version }}"

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            # Create new stack
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/postgres.yaml \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameters $POSTGRES_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=Postgres \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            # Update existing stack, handling "No updates" error
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/postgres.yaml \
              --capabilities CAPABILITY_NAMED_IAM \
              --parameters $POSTGRES_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=Postgres \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions 2>&1) || true

            # Check if the error was "No updates are to be performed"
            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "Stack is already up to date - no changes needed"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "Stack update initiated successfully"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: "1800"
          interval: "10"

      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          echo "Retrieving stack outputs..."

          # Get the actual PostgreSQL Secret ARN using AWS CLI
          SECRET_NAME="robosystems/${{ inputs.environment }}/postgres"
          POSTGRES_SECRET_ARN=$(aws secretsmanager describe-secret \
            --secret-id "$SECRET_NAME" \
            --query "ARN" \
            --output text 2>/dev/null || echo "")

          if [ -n "$POSTGRES_SECRET_ARN" ]; then
            echo "postgres_secret_arn=$POSTGRES_SECRET_ARN" >> $GITHUB_OUTPUT
            echo "ARN configured successfully"
          else
            echo "Warning: Could not retrieve PostgreSQL Secret ARN for $SECRET_NAME"
            # Fallback to CloudFormation output (pattern)
            POSTGRES_SECRET_ARN=$(aws cloudformation describe-stacks \
              --stack-name ${{ inputs.stack_name }} \
              --query "Stacks[0].Outputs[?OutputKey=='PostgresSecretArn'].OutputValue" \
              --output text)
            echo "CloudFormation output retrieved"
            echo "postgres_secret_arn=$POSTGRES_SECRET_ARN" >> $GITHUB_OUTPUT
          fi

          # Get the RDS Security Group ID from CloudFormation outputs
          DATABASE_SG_ID=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='RDSSecurityGroupId'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DATABASE_SG_ID" ] && [ "$DATABASE_SG_ID" != "None" ]; then
            echo "database_sg_id=$DATABASE_SG_ID" >> $GITHUB_OUTPUT
            echo "RDS Security Group ID: $DATABASE_SG_ID"
          else
            echo "Warning: Could not retrieve RDS Security Group ID"
          fi

          # Get the Database Endpoint from CloudFormation outputs
          DATABASE_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseEndpoint'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DATABASE_ENDPOINT" ] && [ "$DATABASE_ENDPOINT" != "None" ]; then
            echo "database_endpoint=$DATABASE_ENDPOINT" >> $GITHUB_OUTPUT
            echo "Database Endpoint: $DATABASE_ENDPOINT"
          else
            echo "Warning: Could not retrieve Database Endpoint"
          fi

          # Get the Database Port from CloudFormation outputs
          DATABASE_PORT=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabasePort'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DATABASE_PORT" ] && [ "$DATABASE_PORT" != "None" ]; then
            echo "database_port=$DATABASE_PORT" >> $GITHUB_OUTPUT
            echo "Database Port: $DATABASE_PORT"
          else
            echo "database_port=5432" >> $GITHUB_OUTPUT
            echo "Database Port defaulting to 5432"
          fi

          # Get the RDS Proxy Endpoint (only present when rds_proxy_enabled=true)
          DATABASE_PROXY_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='DatabaseProxyEndpoint'].OutputValue" \
            --output text 2>/dev/null || echo "")

          if [ -n "$DATABASE_PROXY_ENDPOINT" ] && [ "$DATABASE_PROXY_ENDPOINT" != "None" ]; then
            echo "database_proxy_endpoint=$DATABASE_PROXY_ENDPOINT" >> $GITHUB_OUTPUT
            echo "RDS Proxy Endpoint: $DATABASE_PROXY_ENDPOINT"
          else
            echo "database_proxy_endpoint=" >> $GITHUB_OUTPUT
            echo "RDS Proxy not enabled - proxy endpoint is empty"
          fi

      - name: Update Deployment Status
        if: always()
        run: |
          # Output deployment status for the main workflow
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "PostgreSQL stack creation completed"
          else
            echo "PostgreSQL stack update completed"
          fi
