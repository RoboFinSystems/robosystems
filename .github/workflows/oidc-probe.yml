name: OIDC probe

# Temporary: removed before this branch merges.

on:
  push:
    branches: [chore/deploy-role-trust]
    paths: [.github/workflows/oidc-probe*.yml]

permissions:
  id-token: write

jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Print the token's workflow claims
        run: |
          curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=probe" \
            | python3 -c 'import sys,json,base64; p=json.load(sys.stdin)["value"].split(".")[1]; c=json.loads(base64.urlsafe_b64decode(p+"="*(-len(p)%4))); [print(k, "=", c.get(k)) for k in ("sub","ref","workflow_ref","job_workflow_ref")]'

  reused:
    uses: ./.github/workflows/oidc-probe-called.yml
