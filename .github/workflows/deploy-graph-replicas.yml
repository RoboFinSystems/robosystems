name: Deploy Graph Shared Replicas

# Deploys read-only replica fleet for shared repositories (SEC)
# Replicas download .lbug and .duckdb files from S3 to local disk on boot
# Databases are published to S3 by Dagster's sec_lbug_s3_publish and sec_duckdb_s3_publish jobs

on:
  workflow_call:
    inputs:
      # Stack & Environment Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod or staging)"
        required: true
        type: string

      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string
      vpc_id:
        description: "VPC ID for deployment"
        required: true
        type: string
      vpc_cidr:
        description: "VPC CIDR block"
        required: false
        type: string
        default: "10.0.0.0/16"
      subnet_ids:
        description: "Comma-separated list of private subnet IDs (multiple AZs for HA)"
        required: true
        type: string

      # Instance Configuration
      ami_id:
        description: "Amazon Linux 2023 ARM64 AMI ID"
        required: true
        type: string
      instance_type:
        description: "EC2 instance type for replicas"
        required: false
        type: string
        default: "r7g.medium"

      # Auto-scaling Configuration
      min_instances:
        description: "Minimum number of replica instances"
        required: false
        type: string
        default: "2"
      max_instances:
        description: "Maximum number of replica instances"
        required: false
        type: string
        default: "10"
      desired_capacity:
        description: "Desired number of replica instances"
        required: false
        type: string
        default: "2"

      # Auto-scaling Targets
      cpu_target_value:
        description: "Target CPU utilization percentage for auto scaling"
        required: false
        type: string
        default: "70"
      memory_target_value:
        description: "Target memory utilization percentage for auto scaling"
        required: false
        type: string
        default: "80"
      enable_response_time_scaling:
        description: "Enable response time-based auto scaling (disable during zero-traffic to prevent INSUFFICIENT_DATA blocking scale-in)"
        required: false
        type: string
        default: "false"
      response_time_target_value:
        description: "Target ALB response time in seconds for auto scaling"
        required: false
        type: string
        default: "5"
      instance_warmup:
        description: "Seconds to ignore new instance metrics during initialization (S3 download time)"
        required: false
        type: string
        default: "900"
      health_check_grace_period:
        description: "Seconds before ASG checks ALB health on new instances (must cover download + startup)"
        required: false
        type: string
        default: "900"

      # Spot Instance Configuration
      spot_enabled:
        description: "Enable Spot instances for cost savings (master switch)"
        required: false
        type: string
        default: "false"
      od_base:
        description: "Minimum number of on-demand instances (never Spot, guaranteed capacity)"
        required: false
        type: string
        default: "0"
      spot_weight:
        description: "Percentage of instances above base that are Spot (0 = all on-demand, 90 = 90% Spot)"
        required: false
        type: string
        default: "0"

      # Docker Configuration
      ecr_image_tag:
        description: "Docker image tag for Graph API"
        required: false
        type: string
        default: "latest"

      # Shared Repository Configuration
      shared_repositories:
        description: "Comma-separated shared repository names to ATTACH (e.g., sec,sec_historical)"
        required: false
        type: string
        default: "sec"
      root_volume_size:
        description: "Root volume size in GB (must fit OS + downloaded shared databases)"
        required: false
        type: string
        default: "150"

      # Cache Configuration
      valkey_sg_id:
        description: "Security Group ID for Valkey/Redis client access"
        required: true
        type: string
      valkey_url:
        description: "Valkey ElastiCache endpoint URL (e.g., redis://endpoint:6379)"
        required: true
        type: string

      # Database Configuration
      database_endpoint:
        description: "PostgreSQL database endpoint hostname"
        required: true
        type: string
      database_port:
        description: "PostgreSQL database port"
        required: false
        type: string
        default: "5432"

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

    outputs:
      alb_dns_name:
        description: "DNS name of the shared replicas ALB"
        value: ${{ jobs.deploy.outputs.alb_dns_name }}
      alb_endpoint:
        description: "Full endpoint URL for Graph API via ALB"
        value: ${{ jobs.deploy.outputs.alb_endpoint }}
      asg_name:
        description: "Name of the Auto Scaling Group"
        value: ${{ jobs.deploy.outputs.asg_name }}
      launch_template_name:
        description: "Name of the Launch Template"
        value: ${{ jobs.deploy.outputs.launch_template_name }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read

    outputs:
      alb_dns_name: ${{ steps.get-outputs.outputs.alb_dns_name }}
      alb_endpoint: ${{ steps.get-outputs.outputs.alb_endpoint }}
      asg_name: ${{ steps.get-outputs.outputs.asg_name }}
      launch_template_name: ${{ steps.get-outputs.outputs.launch_template_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Get S3 Bucket Configuration
        id: s3_config
        run: |
          # Determine S3 stack name based on environment
          if [ "${{ inputs.environment }}" = "prod" ]; then
            S3_STACK_NAME="RoboSystemsS3Prod"
          else
            S3_STACK_NAME="RoboSystemsS3Staging"
          fi

          # Query S3 stack outputs for bucket ARN
          S3_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "$S3_STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json)

          DEPLOYMENT_BUCKET_ARN=$(echo "$S3_OUTPUTS" | jq -r '.[] | select(.OutputKey=="DeploymentBucketArn") | .OutputValue')

          echo "deployment_bucket_arn=$DEPLOYMENT_BUCKET_ARN" >> $GITHUB_OUTPUT
          echo "📦 Deployment Bucket: $DEPLOYMENT_BUCKET_ARN"

      - name: Get ECR Configuration
        id: ecr_config
        run: |
          # Get ECR repository URL from existing graph infrastructure
          ECR_STACK_NAME="RoboSystemsECR${{ inputs.environment == 'prod' && 'Prod' || 'Staging' }}"

          ECR_URL=$(aws cloudformation describe-stacks \
            --stack-name "$ECR_STACK_NAME" \
            --query 'Stacks[0].Outputs[?OutputKey==`GraphApiRepositoryUrl`].OutputValue' \
            --output text 2>/dev/null || echo "")

          # Fallback: construct from account ID (monolith repo, not separate graph-api repo)
          if [ -z "$ECR_URL" ] || [ "$ECR_URL" = "None" ]; then
            ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            ECR_URL="${ACCOUNT_ID}.dkr.ecr.${{ inputs.aws_region }}.amazonaws.com/robosystems"
          fi

          echo "ecr_url=$ECR_URL" >> $GITHUB_OUTPUT
          echo "🐳 ECR Repository: $ECR_URL"

      - name: Validate S3 Databases Exist
        id: s3_database
        run: |
          # Build S3 prefix and validate each repository's .lbug file
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          S3_PREFIX="s3://robosystems-${ACCOUNT_ID}-user-${{ inputs.environment }}/shared-repositories/databases"
          REPOS="${{ inputs.shared_repositories }}"

          echo "🔍 Validating shared databases under prefix: $S3_PREFIX"
          echo "   Repositories: $REPOS"

          # Validate each repository's .lbug file exists
          ALL_FOUND=true
          IFS=',' read -ra REPO_ARRAY <<< "$REPOS"
          for REPO_NAME in "${REPO_ARRAY[@]}"; do
            REPO_NAME=$(echo "$REPO_NAME" | xargs)  # trim whitespace
            S3_URI="${S3_PREFIX}/${REPO_NAME}.lbug"

            if aws s3 ls "$S3_URI" >/dev/null 2>&1; then
              FILE_SIZE=$(aws s3 ls "$S3_URI" | awk '{print $3}')
              FILE_SIZE_GB=$(awk "BEGIN {printf \"%.2f\", $FILE_SIZE / 1024 / 1024 / 1024}")
              LAST_MODIFIED=$(aws s3 ls "$S3_URI" | awk '{print $1, $2}')
              echo "✅ Found ${REPO_NAME}: ${FILE_SIZE_GB}GB (modified: $LAST_MODIFIED)"
            else
              echo "❌ Not found: $S3_URI"
              ALL_FOUND=false
            fi
          done

          if [ "$ALL_FOUND" != "true" ]; then
            echo ""
            echo "   Materialize the sec_lbug_s3_published asset in Dagster to upload missing databases."
            exit 1
          fi

          echo "s3_prefix=$S3_PREFIX" >> $GITHUB_OUTPUT
          echo "shared_repositories=$REPOS" >> $GITHUB_OUTPUT

      - name: Upload Userdata Scripts to S3
        run: |
          set -e  # Fail on any error

          # Extract bucket name from ARN
          DEPLOYMENT_BUCKET_ARN="${{ steps.s3_config.outputs.deployment_bucket_arn }}"
          DEPLOYMENT_BUCKET=$(echo "$DEPLOYMENT_BUCKET_ARN" | sed 's|arn:aws:s3:::||')

          echo "📤 Uploading userdata scripts to s3://$DEPLOYMENT_BUCKET/userdata/"

          # Upload replica-specific userdata script
          aws s3 cp bin/userdata/ladybug-replica.sh \
            "s3://$DEPLOYMENT_BUCKET/userdata/ladybug-replica.sh" \
            --region ${{ inputs.aws_region }}
          echo "  ✅ ladybug-replica.sh"

          # Upload shared common scripts (used by both writers and replicas)
          for script in bin/userdata/common/*.sh; do
            SCRIPT_NAME=$(basename "$script")
            aws s3 cp "$script" \
              "s3://$DEPLOYMENT_BUCKET/userdata/common/$SCRIPT_NAME" \
              --region ${{ inputs.aws_region }}
            echo "  ✅ common/$SCRIPT_NAME"
          done

          echo "📦 All userdata scripts uploaded successfully"

      - name: Deploy Shared Replicas CloudFormation Stack
        id: deploy-stack
        run: |
          # Check if stack exists
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'does not exist'; then
            STACK_ACTION="create-stack"
            echo "📦 Creating new stack: ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "🔄 Updating existing stack: ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          # Convert Spot percentage to on-demand percentage (ASG API uses on-demand %)
          SPOT_ON_DEMAND_PCT=$((100 - ${{ inputs.spot_weight }}))

          # Build parameters
          STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
            ParameterKey=VpcId,ParameterValue=${{ inputs.vpc_id }} \
            ParameterKey=VpcCidr,ParameterValue=${{ inputs.vpc_cidr }} \
            ParameterKey=SubnetIds,ParameterValue=\"${{ inputs.subnet_ids }}\" \
            ParameterKey=AmiId,ParameterValue=${{ inputs.ami_id }} \
            ParameterKey=InstanceType,ParameterValue=${{ inputs.instance_type }} \
            ParameterKey=SharedDatabaseS3Prefix,ParameterValue=${{ steps.s3_database.outputs.s3_prefix }} \
            ParameterKey=SharedRepositories,ParameterValue=\"${{ steps.s3_database.outputs.shared_repositories }}\" \
            ParameterKey=RootVolumeSize,ParameterValue=${{ inputs.root_volume_size }} \
            ParameterKey=MinInstances,ParameterValue=${{ inputs.min_instances }} \
            ParameterKey=MaxInstances,ParameterValue=${{ inputs.max_instances }} \
            ParameterKey=DesiredCapacity,ParameterValue=${{ inputs.desired_capacity }} \
            ParameterKey=CPUTargetValue,ParameterValue=${{ inputs.cpu_target_value }} \
            ParameterKey=MemoryTargetValue,ParameterValue=${{ inputs.memory_target_value }} \
            ParameterKey=EnableResponseTimeScaling,ParameterValue=${{ inputs.enable_response_time_scaling }} \
            ParameterKey=ResponseTimeTargetValue,ParameterValue=${{ inputs.response_time_target_value }} \
            ParameterKey=InstanceWarmup,ParameterValue=${{ inputs.instance_warmup }} \
            ParameterKey=HealthCheckGracePeriod,ParameterValue=${{ inputs.health_check_grace_period }} \
            ParameterKey=DeploymentBucketArn,ParameterValue=${{ steps.s3_config.outputs.deployment_bucket_arn }} \
            ParameterKey=ECRRepositoryUrl,ParameterValue=${{ steps.ecr_config.outputs.ecr_url }} \
            ParameterKey=ECRImageTag,ParameterValue=${{ inputs.ecr_image_tag }} \
            ParameterKey=ValkeyClientSecurityGroupId,ParameterValue=${{ inputs.valkey_sg_id }} \
            ParameterKey=ValkeyUrl,ParameterValue=${{ inputs.valkey_url }} \
            ParameterKey=DatabaseEndpoint,ParameterValue=${{ inputs.database_endpoint }} \
            ParameterKey=DatabasePort,ParameterValue=${{ inputs.database_port }} \
            ParameterKey=SpotEnabled,ParameterValue=${{ inputs.spot_enabled }} \
            ParameterKey=SpotOnDemandBaseCapacity,ParameterValue=${{ inputs.od_base }} \
            ParameterKey=SpotOnDemandPercentageAboveBase,ParameterValue=${SPOT_ON_DEMAND_PCT} \
            ParameterKey=SNSAlertEmail,ParameterValue=${{ inputs.aws_sns_alert_email }} \
            ParameterKey=ServiceTag,ParameterValue=RoboSystems \
            ParameterKey=ComponentTag,ParameterValue=SharedReplica"

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/graph-ladybug-replicas.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=SharedReplica \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            # Update existing stack, handling "No updates" gracefully
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/graph-ladybug-replicas.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=SharedReplica \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions 2>&1) || true

            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "✅ Stack is already up to date - no changes needed"
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "❌ Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "✅ Stack update initiated successfully"
            fi
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: "1800"
          interval: "10"

      - name: Get Stack Outputs
        id: get-outputs
        run: |
          STACK_OUTPUTS=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --query 'Stacks[0].Outputs' \
            --output json)

          ALB_DNS_NAME=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="ALBDNSName") | .OutputValue // empty')
          ALB_ENDPOINT=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="ALBEndpoint") | .OutputValue // empty')
          ASG_NAME=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="AutoScalingGroupName") | .OutputValue // empty')
          LT_NAME=$(echo "$STACK_OUTPUTS" | jq -r '.[] | select(.OutputKey=="LaunchTemplateName") | .OutputValue // empty')

          echo "alb_dns_name=$ALB_DNS_NAME" >> $GITHUB_OUTPUT
          echo "alb_endpoint=$ALB_ENDPOINT" >> $GITHUB_OUTPUT
          echo "asg_name=$ASG_NAME" >> $GITHUB_OUTPUT
          echo "launch_template_name=$LT_NAME" >> $GITHUB_OUTPUT

          echo ""
          echo "📊 Shared Replicas Deployment Complete:"
          echo "  ALB DNS: $ALB_DNS_NAME"
          echo "  ALB Endpoint: $ALB_ENDPOINT"
          echo "  ASG Name: $ASG_NAME"
          echo "  Launch Template: $LT_NAME"

      - name: Verify Replica Health
        if: inputs.desired_capacity != '0' && inputs.desired_capacity != 0
        run: |
          echo "🏥 Checking replica health..."

          ASG_NAME="${{ steps.get-outputs.outputs.asg_name }}"

          # Wait for instances to be InService
          for i in {1..30}; do
            HEALTHY=$(aws autoscaling describe-auto-scaling-groups \
              --auto-scaling-group-names "$ASG_NAME" \
              --query 'AutoScalingGroups[0].Instances[?LifecycleState==`InService`] | length(@)' \
              --output text)

            DESIRED=${{ inputs.desired_capacity }}

            if [ "$HEALTHY" -ge "$DESIRED" ]; then
              echo "✅ $HEALTHY/$DESIRED replicas InService"
              break
            fi

            echo "⏳ Waiting for replicas... ($HEALTHY/$DESIRED InService)"
            sleep 10
          done

          # Check ALB target health
          TARGET_GROUP_ARN=$(aws cloudformation describe-stacks \
            --stack-name "${{ inputs.stack_name }}" \
            --query 'Stacks[0].Outputs[?OutputKey==`TargetGroupArn`].OutputValue' \
            --output text)

          if [ -n "$TARGET_GROUP_ARN" ]; then
            HEALTHY_TARGETS=$(aws elbv2 describe-target-health \
              --target-group-arn "$TARGET_GROUP_ARN" \
              --query 'TargetHealthDescriptions[?TargetHealth.State==`healthy`] | length(@)' \
              --output text)

            echo "🎯 ALB Target Health: $HEALTHY_TARGETS targets healthy"
          fi

      - name: Update Deployment Status
        if: always()
        run: |
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "✅ Shared Replicas stack creation completed"
          else
            echo "✅ Shared Replicas stack update completed"
          fi
