name: Test CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read
  security-events: write  # Required for Trivy SARIF upload to GitHub Security tab

jobs:
  runner:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      runners_available: ${{ steps.select.outputs.runners_available }}
      runner_type: ${{ steps.select.outputs.runner_type }}
      runner_config: ${{ steps.select.outputs.runner_config }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      # Fork PRs carry untrusted code, so they always get ephemeral GitHub-hosted
      # runners, whatever RUNNER_LABELS says: self-hosted runners persist between jobs.
      - name: Select runner
        id: select
        uses: ./.github/actions/select-runner
        with:
          runner_labels: ${{ github.event.pull_request.head.repo.fork && 'github-hosted' || vars.RUNNER_LABELS || 'github-hosted' }}
          runner_scope: ${{ vars.RUNNER_SCOPE || 'both' }}
          github_token: ${{ github.token }}

  test:
    needs: [runner]
    uses: ./.github/workflows/test.yml
    with:
      runner_config: ${{ needs.runner.outputs.runner_config }}
    secrets: inherit

  # Records the change class on every PR; code changes also require the
  # automated review (the change-management compensating control that stands in
  # for a second human approver). Standard changes ride the test gate alone.
  change-classification:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Classify the change and request the review
        uses: ./.github/actions/classify-change
        with:
          pr_number: ${{ github.event.pull_request.number }}
          github_token: ${{ github.token }}
          review_token: ${{ secrets.ACTIONS_TOKEN }}
