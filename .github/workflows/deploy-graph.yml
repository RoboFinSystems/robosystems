name: Deploy Graph Clusters

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
        description: Environment to deploy to (staging/prod)
      runner_config:
        required: true
        type: string
        description: Runner configuration JSON
      aws_region:
        required: true
        type: string
        description: AWS region
      vpc_id:
        required: true
        type: string
        description: VPC ID from deploy-vpc
      subnet_ids:
        required: true
        type: string
        description: Private subnet IDs
      public_subnet_ids:
        required: true
        type: string
        description: Public subnet IDs
      valkey_sg_id:
        required: true
        type: string
        description: Security Group ID for Valkey/Redis client access
      valkey_url:
        required: true
        type: string
        description: Valkey ElastiCache endpoint URL (e.g., redis://endpoint:6379)
      # Database Configuration
      database_endpoint:
        required: true
        type: string
        description: PostgreSQL database endpoint hostname
      database_port:
        required: false
        type: string
        description: PostgreSQL database port
        default: "5432"
      # Container Configuration
      ecr_image_tag:
        required: true
        type: string
        description: ECR image tag
      # Infrastructure inputs (from graph infrastructure deployment)
      secret_arn:
        required: true
        type: string
        description: Graph API secret ARN from infrastructure deployment
      volume_registry_table:
        required: true
        type: string
        description: DynamoDB volume registry table name from infrastructure deployment
      volume_manager_function_arn:
        required: true
        type: string
        description: Volume manager Lambda function ARN from infrastructure deployment
      volume_detachment_topic_arn:
        required: true
        type: string
        description: Volume detachment SNS topic ARN from infrastructure deployment
      # Graph Tier Configuration
      lbug_large_enabled:
        required: false
        type: string
        description: Enable large tier writers
        default: ""
      lbug_xlarge_enabled:
        required: false
        type: string
        description: Enable xlarge tier writers
        default: ""
      lbug_shared_enabled:
        required: false
        type: string
        description: Enable shared tier writers (public repositories)
        default: ""
      # Graph Scaling Configuration (passed from parent workflow)
      lbug_standard_min_instances:
        required: false
        type: string
        description: Standard tier minimum instances
        default: ""
      lbug_standard_max_instances:
        required: false
        type: string
        description: Standard tier maximum instances
        default: ""
      lbug_large_min_instances:
        required: false
        type: string
        description: Large tier minimum instances
        default: ""
      lbug_large_max_instances:
        required: false
        type: string
        description: Large tier maximum instances
        default: ""
      lbug_xlarge_min_instances:
        required: false
        type: string
        description: XLarge tier minimum instances
        default: ""
      lbug_xlarge_max_instances:
        required: false
        type: string
        description: XLarge tier maximum instances
        default: ""
      lbug_shared_min_instances:
        required: false
        type: string
        description: Shared tier minimum instances
        default: ""
      lbug_shared_max_instances:
        required: false
        type: string
        description: Shared tier maximum instances
        default: ""

      # Shared Replicas Configuration
      shared_replicas_enabled:
        required: false
        type: string
        description: Enable shared repository replicas (read-only fleet)
        default: ""
      shared_replicas_min_instances:
        required: false
        type: string
        description: Shared replicas minimum instances
        default: "2"
      shared_replicas_max_instances:
        required: false
        type: string
        description: Shared replicas maximum instances
        default: "10"
      shared_replicas_desired_capacity:
        required: false
        type: string
        description: Shared replicas desired capacity
        default: "2"
      shared_replicas_root_volume_size:
        required: false
        type: string
        description: Shared replicas root volume size in GB (must fit OS + httpfs cache)
        default: "100"
      shared_repositories:
        required: false
        type: string
        description: Comma-separated shared repository names to ATTACH (e.g., sec,sec_historical)
        default: "sec"
      shared_replicas_cpu_target:
        required: false
        type: string
        description: Target CPU utilization percentage for replica auto scaling
        default: "70"
      shared_replicas_memory_target:
        required: false
        type: string
        description: Target memory utilization percentage for replica auto scaling
        default: "80"
      shared_replicas_response_time_target:
        required: false
        type: string
        description: Target ALB response time in seconds for replica auto scaling
        default: "5"
      shared_replicas_instance_warmup:
        required: false
        type: string
        description: Seconds to ignore new replica metrics during initialization
        default: "900"
      shared_replicas_health_check_grace_period:
        required: false
        type: string
        description: Seconds before ASG checks ALB health on new replica instances
        default: "900"

      # AMI Configuration
      ami_id:
        description: "Amazon Linux 2023 ARM64 AMI ID for graph instances (looked up if not provided)"
        required: false
        type: string
        default: ""

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

jobs:
  # Step 0: Resolve AMI (lookup latest if not provided)
  resolve-ami:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      ami_id: ${{ steps.resolve.outputs.ami_id }}
    steps:
      - name: Check if AMI lookup needed
        id: check
        run: |
          if [ -n "${{ inputs.ami_id }}" ]; then
            echo "skip_lookup=true" >> $GITHUB_OUTPUT
            echo "✅ Using provided AMI: ${{ inputs.ami_id }}"
          else
            echo "skip_lookup=false" >> $GITHUB_OUTPUT
            echo "🔍 No AMI provided, will lookup latest"
          fi

      - name: Checkout (for action)
        if: steps.check.outputs.skip_lookup == 'false'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions/get-latest-ami

      - name: Configure AWS credentials
        if: steps.check.outputs.skip_lookup == 'false'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Get Latest AMI
        if: steps.check.outputs.skip_lookup == 'false'
        id: lookup
        uses: ./.github/actions/get-latest-ami
        with:
          architecture: arm64

      - name: Resolve AMI ID
        id: resolve
        run: |
          if [ -n "${{ inputs.ami_id }}" ]; then
            echo "ami_id=${{ inputs.ami_id }}" >> $GITHUB_OUTPUT
          else
            echo "ami_id=${{ steps.lookup.outputs.ami_id }}" >> $GITHUB_OUTPUT
          fi

  # Step 1: Prepare Writer Matrix
  prepare-writer-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      lbug_matrix: ${{ steps.set-matrix.outputs.lbug_matrix }}
      replica_instance_type: ${{ steps.set-matrix.outputs.replica_instance_type }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/configs/graph.yml
          sparse-checkout-cone-mode: false

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Prepare Writer Matrix
        id: set-matrix
        run: |
          # Determine environment key and set environment variables
          if [ "${{ inputs.environment }}" = "prod" ]; then
            ENV_KEY="production"
            ENV_SUFFIX="PROD"
            # Set environment variables for production
            export STANDARD_ENABLED_PROD="true"  # Always enabled
            export LBUG_LARGE_ENABLED_PROD="${{ inputs.lbug_large_enabled }}"
            export LBUG_XLARGE_ENABLED_PROD="${{ inputs.lbug_xlarge_enabled }}"
            export LBUG_SHARED_ENABLED_PROD="${{ inputs.lbug_shared_enabled }}"
            # Export scaling variables for production (passed from parent workflow)
            export LBUG_STANDARD_MIN_INSTANCES_PROD="${{ inputs.lbug_standard_min_instances }}"
            export LBUG_STANDARD_MAX_INSTANCES_PROD="${{ inputs.lbug_standard_max_instances }}"
            export LBUG_LARGE_MIN_INSTANCES_PROD="${{ inputs.lbug_large_min_instances }}"
            export LBUG_LARGE_MAX_INSTANCES_PROD="${{ inputs.lbug_large_max_instances }}"
            export LBUG_XLARGE_MIN_INSTANCES_PROD="${{ inputs.lbug_xlarge_min_instances }}"
            export LBUG_XLARGE_MAX_INSTANCES_PROD="${{ inputs.lbug_xlarge_max_instances }}"
            export LBUG_SHARED_MIN_INSTANCES_PROD="${{ inputs.lbug_shared_min_instances }}"
            export LBUG_SHARED_MAX_INSTANCES_PROD="${{ inputs.lbug_shared_max_instances }}"
          else
            ENV_KEY="staging"
            ENV_SUFFIX="STAGING"
            # Set environment variables for staging
            export STANDARD_ENABLED_STAGING="true"  # Always enabled
            export LBUG_LARGE_ENABLED_STAGING="${{ inputs.lbug_large_enabled }}"
            export LBUG_XLARGE_ENABLED_STAGING="${{ inputs.lbug_xlarge_enabled }}"
            export LBUG_SHARED_ENABLED_STAGING="${{ inputs.lbug_shared_enabled }}"
            # Export scaling variables for staging (passed from parent workflow)
            export LBUG_STANDARD_MIN_INSTANCES_STAGING="${{ inputs.lbug_standard_min_instances }}"
            export LBUG_STANDARD_MAX_INSTANCES_STAGING="${{ inputs.lbug_standard_max_instances }}"
            export LBUG_LARGE_MIN_INSTANCES_STAGING="${{ inputs.lbug_large_min_instances }}"
            export LBUG_LARGE_MAX_INSTANCES_STAGING="${{ inputs.lbug_large_max_instances }}"
            export LBUG_XLARGE_MIN_INSTANCES_STAGING="${{ inputs.lbug_xlarge_min_instances }}"
            export LBUG_XLARGE_MAX_INSTANCES_STAGING="${{ inputs.lbug_xlarge_max_instances }}"
            export LBUG_SHARED_MIN_INSTANCES_STAGING="${{ inputs.lbug_shared_min_instances }}"
            export LBUG_SHARED_MAX_INSTANCES_STAGING="${{ inputs.lbug_shared_max_instances }}"
          fi

          echo "Loading Graph database writer configuration for: $ENV_KEY"

          # Parse YAML and build matrix
          MATRIX_JSON=$(yq eval -o=json ".${ENV_KEY}.writers" .github/configs/graph.yml)

          # Filter based on enable variables
          LBUG_FILTERED="[]"

          # Get number of writers
          WRITER_COUNT=$(echo "$MATRIX_JSON" | jq 'length')

          # Process each writer
          for i in $(seq 0 $((WRITER_COUNT - 1))); do
            writer=$(echo "$MATRIX_JSON" | jq --argjson idx "$i" '.[$idx]')
            ENABLE_VAR=$(echo "$writer" | jq -r '.deployment.enable_var')
            ENABLED_DEFAULT=$(echo "$writer" | jq -r '.deployment.enabled_default')
            ALWAYS_ENABLED=$(echo "$writer" | jq -r '.deployment.always_enabled // false')
            WRITER_NAME=$(echo "$writer" | jq -r '.name')

            # Check if should deploy
            SHOULD_DEPLOY="false"

            if [ "$ALWAYS_ENABLED" = "true" ]; then
              echo "  ✅ $WRITER_NAME is ALWAYS ENABLED"
              SHOULD_DEPLOY="true"
            else
              VAR_NAME="${ENABLE_VAR}"
              VAR_VALUE="${!VAR_NAME:-}"

              if [ "$VAR_VALUE" = "false" ]; then
                echo "  ❌ $VAR_NAME is explicitly disabled"
                SHOULD_DEPLOY="false"
              elif [ -n "$VAR_VALUE" ] && [ "$VAR_VALUE" != "false" ]; then
                echo "  ✅ $VAR_NAME is explicitly enabled"
                SHOULD_DEPLOY="true"
              elif [ "$ENABLED_DEFAULT" = "true" ]; then
                echo "  ✅ $VAR_NAME using default (enabled)"
                SHOULD_DEPLOY="true"
              else
                echo "  ❌ $VAR_NAME using default (disabled)"
                SHOULD_DEPLOY="false"
              fi
            fi

            if [ "$SHOULD_DEPLOY" = "true" ]; then
              # Get tier name for variable lookup (e.g., "ladybug-standard" → "LBUG_STANDARD")
              TIER_NAME=$(echo "$writer" | jq -r '.tier | ascii_upcase | gsub("LADYBUG"; "LBUG") | gsub("-"; "_")')

              # Build GitHub variable names based on environment
              MIN_VAR_NAME="${TIER_NAME}_MIN_INSTANCES_${ENV_SUFFIX}"
              MAX_VAR_NAME="${TIER_NAME}_MAX_INSTANCES_${ENV_SUFFIX}"

              # Get GitHub variable values with sensible defaults for slim deployment
              MIN_INSTANCES="${!MIN_VAR_NAME:-1}"
              MAX_INSTANCES="${!MAX_VAR_NAME:-1}"

              echo "  Scaling for ${WRITER_NAME}: min=$MIN_INSTANCES, max=$MAX_INSTANCES"

              # Build the matrix entry from writer config with nested instance specs
              MATRIX_ENTRY=$(echo "$writer" | jq --arg min "$MIN_INSTANCES" --arg max "$MAX_INSTANCES" '{
                name: .name,
                backend: .backend,
                stack_suffix: .stack_suffix,
                tier: .tier,
                min_instances: ($min | tonumber),
                max_instances: ($max | tonumber),
                instance_type: .instance.type,
                databases_per_instance: .instance.databases_per_instance,
                max_memory_mb: .instance.max_memory_mb,
                memory_per_db_mb: .instance.memory_per_db_mb,
                chunk_size: .instance.chunk_size,
                query_timeout: .instance.query_timeout,
                max_query_length: .instance.max_query_length,
                ingestion_batch_size: .instance.ingestion_batch_size,
                connection_pool_size: .instance.connection_pool_size,
                neo4j_version: .instance.neo4j_version,
                neo4j_edition: .instance.neo4j_edition
              }')

              LBUG_FILTERED=$(echo "$LBUG_FILTERED" | jq --argjson entry "$MATRIX_ENTRY" '. + [$entry]')
            fi
          done

          # Output the matrix
          LBUG_MATRIX=$(jq -nc --argjson filtered "$LBUG_FILTERED" '{"include": $filtered}')

          echo "lbug_matrix=$LBUG_MATRIX" >> $GITHUB_OUTPUT

          # Debug output
          echo ""
          echo "Graph writer matrix:"
          echo "$LBUG_FILTERED" | jq '.'

          # Summary
          LBUG_COUNT=$(echo "$LBUG_FILTERED" | jq 'length')
          echo ""
          echo "📊 Deployment Summary:"
          echo "  - $LBUG_COUNT Graph writers (LadybugDB)"

          # Extract shared replica config from graph.yml
          REPLICA_INSTANCE_TYPE=$(yq eval ".${ENV_KEY}.replicas[0].instance.type // \"m7g.large\"" .github/configs/graph.yml)
          echo "replica_instance_type=${REPLICA_INSTANCE_TYPE}" >> $GITHUB_OUTPUT

          echo "  - Shared replica instance type: ${REPLICA_INSTANCE_TYPE}"

  # Step 2: Deploy Graph Writers (LadybugDB Backend)
  deploy-graph-ladybug:
    needs: [prepare-writer-matrix, resolve-ami]
    if: fromJson(needs.prepare-writer-matrix.outputs.lbug_matrix).include[0] != null
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-writer-matrix.outputs.lbug_matrix) }}
      max-parallel: 4 # Deploy up to 4 writers in parallel
    uses: ./.github/workflows/deploy-graph-ladybug.yml
    with:
      # Stack & Repository Configuration
      stack_name: RoboSystemsGraph${{ matrix.stack_suffix }}${{ inputs.environment == 'prod' && 'Prod' || 'Staging' }}
      environment: ${{ inputs.environment }}
      # GHA Runner Configuration
      runner_config: ${{ inputs.runner_config }}
      # AWS Configuration
      aws_region: ${{ inputs.aws_region }}
      vpc_id: ${{ inputs.vpc_id }}
      subnet_ids: ${{ inputs.subnet_ids }}
      # Auto Scaling Configuration
      min_instances: "${{ matrix.min_instances }}"
      max_instances: "${{ matrix.max_instances }}"
      # Graph Writer Configuration
      writer_tier: ${{ matrix.tier }}
      shared_repositories: ${{ matrix.tier == 'ladybug-shared' && inputs.shared_repositories || '' }}
      # Instance Configuration
      instance_type: ${{ matrix.instance_type }}
      databases_per_instance: "${{ matrix.databases_per_instance }}"
      ami_id: ${{ needs.resolve-ami.outputs.ami_id }}
      # Valkey Configuration
      valkey_sg_id: ${{ inputs.valkey_sg_id }}
      valkey_url: ${{ inputs.valkey_url }}
      # Database Configuration
      database_endpoint: ${{ inputs.database_endpoint }}
      database_port: ${{ inputs.database_port }}
      # Other Configuration
      ecr_image_tag: ${{ inputs.ecr_image_tag }}
      volume_detachment_topic_arn: ${{ inputs.volume_detachment_topic_arn }}
      volume_manager_function_arn: ${{ inputs.volume_manager_function_arn }}
      aws_sns_alert_email: ${{ inputs.aws_sns_alert_email }}
    secrets: inherit

  # Step 3: Deploy Shared Replicas (Read-Only Fleet)
  # Replicas read from S3 via httpfs - independent of writer deployment
  # S3 database must exist (published by Dagster job), but that's not a deploy-time dependency
  deploy-shared-replicas:
    needs: [resolve-ami, prepare-writer-matrix]
    if: inputs.shared_replicas_enabled == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-graph-replicas.yml
    with:
      stack_name: RoboSystemsGraphSharedReplicas${{ inputs.environment == 'prod' && 'Prod' || 'Staging' }}
      environment: ${{ inputs.environment }}
      runner_config: ${{ inputs.runner_config }}
      aws_region: ${{ inputs.aws_region }}
      vpc_id: ${{ inputs.vpc_id }}
      subnet_ids: ${{ inputs.subnet_ids }}
      ami_id: ${{ needs.resolve-ami.outputs.ami_id }}
      instance_type: ${{ needs.prepare-writer-matrix.outputs.replica_instance_type }}
      root_volume_size: ${{ inputs.shared_replicas_root_volume_size }}
      min_instances: ${{ inputs.shared_replicas_min_instances }}
      max_instances: ${{ inputs.shared_replicas_max_instances }}
      desired_capacity: ${{ inputs.shared_replicas_desired_capacity }}
      shared_repositories: ${{ inputs.shared_repositories }}
      cpu_target_value: ${{ inputs.shared_replicas_cpu_target }}
      memory_target_value: ${{ inputs.shared_replicas_memory_target }}
      response_time_target_value: ${{ inputs.shared_replicas_response_time_target }}
      instance_warmup: ${{ inputs.shared_replicas_instance_warmup }}
      health_check_grace_period: ${{ inputs.shared_replicas_health_check_grace_period }}
      ecr_image_tag: ${{ inputs.ecr_image_tag }}
      # Cache Configuration
      valkey_sg_id: ${{ inputs.valkey_sg_id }}
      valkey_url: ${{ inputs.valkey_url }}
      # Database Configuration
      database_endpoint: ${{ inputs.database_endpoint }}
      database_port: ${{ inputs.database_port }}
      aws_sns_alert_email: ${{ inputs.aws_sns_alert_email }}
    secrets: inherit
