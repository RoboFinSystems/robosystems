name: Service Refresh

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to refresh (staging, prod)"
        required: true
        type: choice
        options:
          - staging
          - prod
      graph_refresh_enabled:
        description: "Refresh graph containers"
        required: false
        type: boolean
        default: true
      api_refresh_enabled:
        description: "Refresh API ECS service"
        required: false
        type: boolean
        default: true
      dagster_refresh_enabled:
        description: "Refresh Dagster ECS services"
        required: false
        type: boolean
        default: true
      worker_refresh_enabled:
        description: "Refresh Worker ECS service"
        required: false
        type: boolean
        default: true
      graph_node_types:
        description: "Graph node types to refresh"
        required: false
        type: choice
        options:
          - writer
          - all
          - shared
          - shared-replicas
        default: "writer"
      max_wait_minutes:
        description: "Minutes the refresh keeps coming back to instances busy with destructive ops"
        required: false
        type: string
        default: "30"
      force_ignore_busy:
        description: "Skip busy-lease check (emergency override)"
        required: false
        type: boolean
        default: false
      force_restart:
        description: "Restart containers even when the image is unchanged (for secret rotation)"
        required: false
        type: boolean
        default: false
      instance_ids:
        description: "Only these graph instances (comma-separated), within the node types; empty = all"
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      environment:
        description: "Environment to refresh (staging, prod)"
        required: true
        type: string
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'
      aws_region:
        description: "AWS region"
        required: false
        type: string
        default: "us-east-1"
      # Graph refresh configuration
      graph_refresh_enabled:
        description: "Refresh graph containers"
        required: false
        type: string
        default: "true"
      graph_node_types:
        description: "Graph node types to refresh (writer, all, shared, shared-replicas)"
        required: false
        type: string
        default: "writer"
      max_wait_minutes:
        description: "Minutes the refresh keeps coming back to instances busy with destructive ops"
        required: false
        type: string
        default: "30"
      force_ignore_busy:
        description: "Skip busy-lease check (emergency override)"
        required: false
        type: string
        default: "false"
      force_restart:
        description: >-
          Restart containers even when the image digest is unchanged. Set by
          secrets rotation, whose whole purpose is replacing the process so it
          re-reads rotated credentials — without this the digest-skip correctly
          finds nothing to pull and the refresh is a no-op.
        required: false
        type: string
        default: "false"
      instance_ids:
        description: "Only these graph instances (comma-separated), within the node types; empty = all"
        required: false
        type: string
        default: ""
      defer_to_followup:
        description: >-
          When instances are still busy at the deadline, pass instead of failing
          and dispatch a follow-up Service Refresh run for just those instances.
          That run is the one that fails if they stay busy. Deploys set it; a
          real refresh failure still fails the caller.
        required: false
        type: string
        default: "false"
      followup_max_wait_minutes:
        description: "The follow-up run's busy wait, in minutes"
        required: false
        type: string
        default: "180"
      # API refresh configuration
      api_refresh_enabled:
        description: "Refresh API ECS service"
        required: false
        type: string
        default: "true"
      api_stack_name:
        description: "API CloudFormation stack name"
        required: false
        type: string
        default: ""
      # Dagster refresh configuration
      dagster_refresh_enabled:
        description: "Refresh Dagster ECS services"
        required: false
        type: string
        default: "true"
      worker_refresh_enabled:
        description: "Refresh Worker ECS service"
        required: false
        type: string
        default: "true"
# Minimal top-level permissions - jobs define their own
permissions: {}

jobs:
  # Computes the refresh job's timeout (Actions expressions have no arithmetic).
  # It must exceed the walk's budget (max_wait_minutes + 50), or the runner is
  # killed before the loop's graceful give-up branch can fire.
  graph-refresh-budget:
    if: ${{ inputs.graph_refresh_enabled == true || inputs.graph_refresh_enabled == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      job_timeout_minutes: ${{ steps.budget.outputs.job_timeout_minutes }}
    steps:
      - name: Compute refresh job timeout
        id: budget
        run: |
          MAX_WAIT="${{ inputs.max_wait_minutes || '30' }}"
          if ! [[ "$MAX_WAIT" =~ ^[0-9]+$ ]]; then
            echo "::error::max_wait_minutes must be a positive integer, got '$MAX_WAIT'"
            exit 1
          fi
          # +60 covers the loop's +50 (the sequential refreshes themselves)
          # plus runner startup.
          echo "job_timeout_minutes=$((MAX_WAIT + 60))" >> $GITHUB_OUTPUT
          echo "Refresh job timeout: $((MAX_WAIT + 60))m (busy budget ${MAX_WAIT}m)"

  # ============================================
  # Graph Container Refresh (fleet-wide, via SSM)
  # ============================================
  # One instance at a time, stepped through the refresh Lambda: busy instances
  # are passed over and come back around, the first failure stops the walk.
  # Not a job matrix: it caps at 256 jobs and would run instances in parallel.
  refresh-graph:
    needs: [graph-refresh-budget]
    if: ${{ inputs.graph_refresh_enabled == true || inputs.graph_refresh_enabled == 'true' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    # Must exceed the poll budget computed inside the step below, or the runner
    # kills the job before the poll can report anything. Derived, never fixed —
    # see graph-refresh-budget.
    timeout-minutes: ${{ fromJSON(needs.graph-refresh-budget.outputs.job_timeout_minutes) }}
    permissions:
      id-token: write
      contents: read
    outputs:
      phase: ${{ steps.refresh.outputs.phase }}
      deferred_ids: ${{ steps.refresh.outputs.deferred_ids }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}

      # Stack name from stack-config.sh, function name from the stack's outputs;
      # never string-built here.
      - name: Resolve the refresh function
        id: fn
        env:
          REGION: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}
          ENV_NAME: ${{ inputs.environment }}
        run: |
          set -uo pipefail
          STACK=$(bash bin/tools/stack-config.sh "$ENV_NAME" graph.infra)
          echo "graph-infra stack: $STACK"

          FUNCTION=$(aws cloudformation describe-stacks --stack-name "$STACK" \
            --query "Stacks[0].Outputs[?OutputKey=='GraphContainerRefreshFunctionName'].OutputValue" \
            --output text --region "$REGION" 2>/dev/null) || FUNCTION=""

          if [ -z "$FUNCTION" ] || [ "$FUNCTION" = "None" ]; then
            echo "::error::${STACK} has no GraphContainerRefreshFunctionName output. Deploy graph-infra before refreshing graph containers."
            exit 1
          fi
          echo "function=$FUNCTION" >> $GITHUB_OUTPUT

      - name: Refresh graph containers
        id: refresh
        env:
          REGION: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}
          ENV_NAME: ${{ inputs.environment }}
          NODE_TYPES: ${{ inputs.graph_node_types || 'writer' }}
          MAX_WAIT: ${{ inputs.max_wait_minutes || '30' }}
          FORCE_IGNORE_BUSY: ${{ inputs.force_ignore_busy || 'false' }}
          FORCE_RESTART: ${{ inputs.force_restart || 'false' }}
          INSTANCE_IDS: ${{ inputs.instance_ids || '' }}
          DEFER_TO_FOLLOWUP: ${{ inputs.defer_to_followup || 'false' }}
          FUNCTION: ${{ steps.fn.outputs.function }}
        run: |
          set -uo pipefail
          echo "Invoking ${FUNCTION}"

          # The Lambda walks the fleet one instance at a time, passing over busy
          # instances and coming back to them, and stops at the first failure.
          # Each call is one step; this loop carries the state between them.
          invoke() {
            aws lambda invoke --function-name "$FUNCTION" \
              --cli-binary-format raw-in-base64-out \
              --payload "file://$1" --region "$REGION" "$2" >/dev/null
          }

          jq -n \
            --arg env "$ENV_NAME" --arg nt "$NODE_TYPES" \
            --argjson wait "$MAX_WAIT" \
            --argjson ignore_busy "$([ "$FORCE_IGNORE_BUSY" = "true" ] && echo true || echo false)" \
            --argjson force_restart "$([ "$FORCE_RESTART" = "true" ] && echo true || echo false)" \
            --arg ids "$INSTANCE_IDS" \
            '{action:"start", environment:$env, node_types:$nt, max_wait_minutes:$wait,
              force_ignore_busy:$ignore_busy, force_restart:$force_restart,
              instance_ids:$ids}' > /tmp/request.json

          invoke /tmp/request.json /tmp/state.json || {
            echo "::error::Failed to invoke ${FUNCTION}"; exit 1; }
          # A propagated exception has no statusCode at all — its message is in
          # errorMessage (the Lambda raises operational failures so the stack's
          # errors alarm pages on them; see graph_container_refresh.handler).
          if [ "$(jq -r '.statusCode' /tmp/state.json)" != "200" ]; then
            echo "::error::Refresh start failed: $(jq -r '.error // .errorMessage // "unknown"' /tmp/state.json)"
            exit 1
          fi
          jq -r '.log[]' /tmp/state.json

          # The walk's own deadline bounds waiting on busy instances; this one
          # also covers the refreshes themselves, and the job's timeout is
          # derived to exceed it (see graph-refresh-budget).
          DEADLINE=$(( $(date +%s) + (MAX_WAIT + 50) * 60 ))
          POLL_ERRORS=0
          while ! jq -e '.phase | IN("complete", "failed", "deferred")' /tmp/state.json >/dev/null; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::Refresh did not finish within the budget and has stopped dispatching. In flight: $(jq -r '.current.instance_id // "none"' /tmp/state.json); not attempted: $(jq -r '.queue | join(", ")' /tmp/state.json)"
              exit 1
            fi
            sleep 15
            jq '{action: "step", state: .}' /tmp/state.json > /tmp/request.json
            if invoke /tmp/request.json /tmp/next.json \
               && [ "$(jq -r '.statusCode // empty' /tmp/next.json)" = "200" ]; then
              mv /tmp/next.json /tmp/state.json
              POLL_ERRORS=0
              jq -r '.log[]' /tmp/state.json
            else
              # Ride out transient failures, but a walk that cannot be stepped
              # must not read as "still in progress" until the deadline.
              POLL_ERRORS=$((POLL_ERRORS + 1))
              echo "::warning::refresh step failed (${POLL_ERRORS} consecutive): $(jq -r '.error // .errorMessage // "no response"' /tmp/next.json 2>/dev/null)"
              if [ "$POLL_ERRORS" -ge 5 ]; then
                echo "::error::Cannot step the refresh through ${FUNCTION} after ${POLL_ERRORS} attempts. In flight: $(jq -r '.current.instance_id // "none"' /tmp/state.json) — check its SSM command history."
                exit 1
              fi
            fi
          done

          PHASE=$(jq -r '.phase' /tmp/state.json)
          echo "phase=${PHASE}" >> "$GITHUB_OUTPUT"
          {
            echo "### Graph container refresh (${ENV_NAME}, ${NODE_TYPES}): ${PHASE}"
            echo
            echo "| Instance | Outcome |"
            echo "| --- | --- |"
            jq -r '.outcomes[] | "| \(.instance_id) | \(.result) |"' /tmp/state.json
            jq -r '.failure // empty | "| \(.instance_id) | **failed** (\(.status) \(.status_details), exit \(.response_code)) |"' /tmp/state.json
            jq -r '.phase as $p | .queue[] | "| \(.) | \(if $p == "deferred" then "deferred: still busy" else "not attempted" end) |"' /tmp/state.json
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$(jq '.outcomes | length' /tmp/state.json)" = "0" ] && [ "$PHASE" = "complete" ]; then
            echo "No graph instances matched — nothing to refresh."
            exit 0
          fi

          # Skips (script not installed yet, or stale /etc/environment) leave the
          # container deliberately untouched; a warning, not a failed deploy.
          SKIPPED=$(jq '[.outcomes[] | select(.result | startswith("skipped-"))] | length' /tmp/state.json)
          if [ "$SKIPPED" -gt 0 ]; then
            echo "::warning::${SKIPPED} instance(s) skipped — not yet cycled onto the new refresh scripts. Cycle them (graph-asg-refresh.yml) to pick them up."
          fi

          case "$PHASE" in
            failed)
              echo "::error::Refresh failed on $(jq -r '.failure.instance_id' /tmp/state.json) and stopped; $(jq '.queue | length' /tmp/state.json) instance(s) not attempted."
              jq -r '.failure | "  status: \(.status) \(.status_details), exit \(.response_code), command \(.command_id)\n  output tail:\n\(.output_tail)"' /tmp/state.json
              exit 1
              ;;
            deferred)
              echo "deferred_ids=$(jq -r '.queue | join(",")' /tmp/state.json)" >> "$GITHUB_OUTPUT"
              if [ "$DEFER_TO_FOLLOWUP" = "true" ]; then
                echo "::warning::Still busy after ${MAX_WAIT} minute(s), handed to a follow-up Service Refresh run:"
                jq -r '.busy as $b | .queue[] | "  \(.): \($b[.].kind // "busy") (since \($b[.].last_at // "unknown"))"' /tmp/state.json
                echo "_Still-busy instances are handed to a follow-up Service Refresh run._" >> "$GITHUB_STEP_SUMMARY"
                exit 0
              fi
              echo "::error::Still busy after ${MAX_WAIT} minute(s), left on the old image:"
              jq -r '.busy as $b | .queue[] | "  \(.): \($b[.].kind // "busy") (since \($b[.].last_at // "unknown"))"' /tmp/state.json
              echo "Re-run Service Refresh for these instances (instance_ids) once they are idle."
              exit 1
              ;;
          esac
          echo "Refresh complete."

  # Busy instances must not hold a deploy hostage, and must not be dropped
  # either: they get a run of their own, which fails loudly if they stay busy.
  # Its own job so only this step holds actions: write.
  handoff-deferred-graph-refresh:
    needs: [refresh-graph]
    if: ${{ needs.refresh-graph.result == 'success' && needs.refresh-graph.outputs.phase == 'deferred' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Dispatch a follow-up refresh for the deferred instances
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.ref_name }}
          ENV_NAME: ${{ inputs.environment }}
          NODE_TYPES: ${{ inputs.graph_node_types || 'writer' }}
          INSTANCE_IDS: ${{ needs.refresh-graph.outputs.deferred_ids }}
          MAX_WAIT: ${{ inputs.followup_max_wait_minutes || '180' }}
          FORCE_RESTART: ${{ inputs.force_restart || 'false' }}
        run: |
          set -euo pipefail
          gh workflow run service-refresh.yml --repo "$GITHUB_REPOSITORY" --ref "$REF" \
            -f environment="$ENV_NAME" \
            -f graph_refresh_enabled=true \
            -f api_refresh_enabled=false \
            -f dagster_refresh_enabled=false \
            -f worker_refresh_enabled=false \
            -f graph_node_types="$NODE_TYPES" \
            -f instance_ids="$INSTANCE_IDS" \
            -f max_wait_minutes="$MAX_WAIT" \
            -f force_restart="$FORCE_RESTART"
          {
            echo "### Follow-up graph refresh dispatched"
            echo
            echo "\`${INSTANCE_IDS}\` (${ENV_NAME}, ${NODE_TYPES}), waiting up to ${MAX_WAIT} minute(s) at \`${REF}\`."
            echo "Track it under [Service Refresh](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/service-refresh.yml)."
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # API ECS Service Refresh
  # ============================================
  refresh-api:
    if: ${{ inputs.api_refresh_enabled == true || inputs.api_refresh_enabled == 'true' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}

      - name: Determine API Stack Name
        id: stack-name
        run: |
          # Use provided stack name or construct default
          if [ -n "${{ inputs.api_stack_name }}" ]; then
            STACK_NAME="${{ inputs.api_stack_name }}"
          else
            # Default naming convention
            ENV="${{ inputs.environment }}"
            if [ "$ENV" == "prod" ]; then
              STACK_NAME="RoboSystemsAPIProd"
            else
              STACK_NAME="RoboSystemsAPIStaging"
            fi
          fi
          echo "stack_name=$STACK_NAME" >> $GITHUB_OUTPUT
          echo "📦 Using API stack: $STACK_NAME"

      - name: Refresh API ECS Service
        uses: ./.github/actions/refresh-ecs
        with:
          stack-name: ${{ steps.stack-name.outputs.stack_name }}
          service-type: "api"
          max-wait-time: "180"
          service-stability-delay: "15"

  # ============================================
  # Dagster Daemon ECS Service Refresh
  # ============================================
  refresh-dagster-daemon:
    if: ${{ inputs.dagster_refresh_enabled == true || inputs.dagster_refresh_enabled == 'true' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}

      - name: Refresh Dagster Daemon Service
        uses: ./.github/actions/refresh-ecs
        with:
          cluster-name: robosystems-dagster-${{ inputs.environment }}-cluster
          service-name: robosystems-dagster-daemon-${{ inputs.environment }}
          service-type: daemon
          max-wait-time: "600"
          service-stability-delay: "30"

  # ============================================
  # Dagster Webserver ECS Service Refresh
  # ============================================
  refresh-dagster-webserver:
    if: ${{ inputs.dagster_refresh_enabled == true || inputs.dagster_refresh_enabled == 'true' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}

      - name: Refresh Dagster Webserver Service
        uses: ./.github/actions/refresh-ecs
        with:
          cluster-name: robosystems-dagster-${{ inputs.environment }}-cluster
          service-name: robosystems-dagster-webserver-${{ inputs.environment }}
          service-type: api
          max-wait-time: "180"
          service-stability-delay: "15"

  # ============================================
  # Worker ECS Service Refresh
  # ============================================
  refresh-worker:
    if: ${{ inputs.worker_refresh_enabled == true || inputs.worker_refresh_enabled == 'true' }}
    runs-on: ${{ github.event_name == 'workflow_dispatch' && 'ubuntu-latest' || fromJSON(inputs.runner_config) }}
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ github.event_name == 'workflow_dispatch' && (vars.AWS_REGION || 'us-east-1') || inputs.aws_region }}

      - name: Check if Worker service exists
        id: check-worker
        run: |
          CLUSTER="robosystems-dagster-${{ inputs.environment }}-cluster"
          SERVICE="robosystems-worker-${{ inputs.environment }}"

          # Check if the service exists before attempting refresh
          SERVICE_STATUS=$(aws ecs describe-services \
            --cluster "$CLUSTER" \
            --services "$SERVICE" \
            --query "services[0].status" \
            --output text 2>/dev/null || echo "NOT_FOUND")

          if [ "$SERVICE_STATUS" == "ACTIVE" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "✅ Worker service found: $SERVICE"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Worker service not found in ${{ inputs.environment }} — skipping refresh"
          fi

      - name: Refresh Worker Service
        if: steps.check-worker.outputs.exists == 'true'
        uses: ./.github/actions/refresh-ecs
        with:
          cluster-name: robosystems-dagster-${{ inputs.environment }}-cluster
          service-name: robosystems-worker-${{ inputs.environment }}
          service-type: daemon
