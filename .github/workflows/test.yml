name: Test

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.14"
      runner_config:
        required: true
        type: string
        description: "Runner configuration JSON (from runner availability check)"
jobs:
  # The required check. The suite and the static gates run as parallel jobs;
  # this one fails unless both passed, so the ruleset keeps a single context.
  test:
    needs: [pytest, quality]
    if: always()
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require the suite and the static gates
        env:
          PYTEST_RESULT: ${{ needs.pytest.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
        run: |
          echo "pytest: $PYTEST_RESULT, quality: $QUALITY_RESULT"
          [[ "$PYTEST_RESULT" == "success" && "$QUALITY_RESULT" == "success" ]]

  # Lint, type checking, dbt and the dependency scan need no services.
  quality:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # Required for Trivy SARIF upload
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          # The commit this run was dispatched and approved on, not the ref's current tip.
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup Python (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python-version || '3.14' }}

      - name: Install uv (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in step with the ghcr.io/astral-sh/uv tag in Dockerfile and Dockerfile.lambda
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync --frozen --all-extras

      - name: Validate lockfile
        run: |
          uv lock --locked

      - name: Check lockfile against the base branch
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --quiet --depth=1 origin "$BASE_REF"
          uv run --frozen --no-sync python bin/tools/check_lock.py --base FETCH_HEAD --annotate

      - name: Run dbt tests
        timeout-minutes: 1
        run: |
          echo "🔍 Running QuickBooks dbt models and tests..."
          DBT_DIR="robosystems/adapters/quickbooks/dbt"
          TMPDIR=$(mktemp -d)
          DBT_DUCKDB_PATH="$TMPDIR/quickbooks.duckdb" uv run dbt build \
            --profiles-dir "$DBT_DIR" \
            --project-dir "$DBT_DIR" \
            --target-path "$TMPDIR/target" \
            --vars '{"use_seeds": true}'
          echo "✅ dbt: all models and tests passed"

      - name: Run linting
        timeout-minutes: 1
        run: uv run ruff check . --output-format=github

      - name: Run type checking
        timeout-minutes: 3
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: uv run basedpyright

      - name: Lint CloudFormation templates
        timeout-minutes: 1
        run: |
          echo "🔍 Linting CloudFormation templates..."
          uv run cfn-lint

      - name: Lint GitHub Actions workflows
        timeout-minutes: 1
        run: |
          echo "🔍 Linting GitHub Actions workflows..."
          # GitHub validates a workflow only when it runs, so catch malformed
          # expressions here. Accepted findings are baselined in .github/actionlint.yaml.
          uv run actionlint -shellcheck=

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'dependency-scan'

      - name: Clean cache (CI optimization)
        if: always() && !contains(runner.name, 'robosystems')
        run: |
          uv cache prune --ci

  pytest:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      # Environment setup
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      # Use fixed ports for robosystems
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robosystems_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robosystems_test
      # The second of the two databases — per-graph OLTP for the extensions.
      # Created in its own step below; the service container only makes one.
      EXTENSIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/extensions
      POSTGRES_PASSWORD: postgres
      # Graph API Configuration
      GRAPH_API_URL: http://localhost:8001
      LBUG_DATABASE_PATH: ./data/lbug-dbs
      # JWT and security secrets for authentication (test environment)
      JWT_SECRET_KEY: test-jwt-secret-key-12345678901234567890abcdef
      CONNECTION_CREDENTIALS_KEY: test-connection-credentials-key-12345678901234567890abcdef
      # Valkey/Redis Configuration (with authentication)
      VALKEY_URL: redis://localhost:6379
      VALKEY_AUTH_TOKEN: valkey # Must match pytest.ini
      # External Service Configuration (test values)
      INTUIT_CLIENT_ID: test-intuit-client-id
      INTUIT_CLIENT_SECRET: test-intuit-secret
      INTUIT_ENVIRONMENT: sandbox
      INTUIT_REDIRECT_URI: http://localhost:8000/auth/callback
      SEC_GOV_USER_AGENT: test-user-agent test@example.com
      OPENFIGI_API_KEY: test-openfigi-key
      # S3 for the tests that touch a live bucket: SeaweedFS, started below
      AWS_ENDPOINT_URL_S3: http://localhost:8333
      AWS_S3_ACCESS_KEY_ID: test
      AWS_S3_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      USER_DATA_BUCKET: robosystems-local
      SHARED_RAW_BUCKET: robosystems-local
      SHARED_PROCESSED_BUCKET: robosystems-local
      # Queue Management Configuration (from pytest.ini)
      ADMISSION_MEMORY_THRESHOLD: "99.0"
      ADMISSION_CPU_THRESHOLD: "99.0"
      ADMISSION_QUEUE_THRESHOLD: "0.95"
      QUERY_QUEUE_MAX_SIZE: "10000"
      QUERY_QUEUE_MAX_CONCURRENT: "100"
      QUERY_QUEUE_MAX_PER_USER: "100"
      QUERY_QUEUE_TIMEOUT: "600"
      LBUG_HTTP_TIMEOUT: "60"
      LBUG_QUERY_TIMEOUT: "60"
      LBUG_MAX_QUERY_LENGTH: "100000"
      # Feature Flags (test configuration)
      USER_REGISTRATION_ENABLED: "true"
      RATE_LIMIT_ENABLED: "false"
      OTEL_ENABLED: "false"
      LOAD_SHEDDING_ENABLED: "true"
      MCP_AUTO_LIMIT_ENABLED: "true"
      MCP_WORKSPACE_ENABLED: "true"
      FACT_GRID_ENABLED: "true"
      BILLING_ENABLED: "true"
      SECURITY_AUDIT_ENABLED: "true"
      LBUG_CIRCUIT_BREAKERS_ENABLED: "true"
      LBUG_REDIS_CACHE_ENABLED: "true"
      LBUG_RETRY_LOGIC_ENABLED: "true"
      LBUG_HEALTH_CHECKS_ENABLED: "true"
      SUBGRAPH_CREATION_ENABLED: "true"
      BACKUP_CREATION_ENABLED: "true"
      EMAIL_VERIFICATION_ENABLED: "true"
      CAPTCHA_ENABLED: "false"
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robosystems_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Graph database (LadybugDB backend) runs as file-based database, no service container needed
      # Graph databases are created in ./data/lbug-dbs/ directory during tests
      valkey:
        # Note: GitHub Actions doesn't support custom commands for service containers
        # We'll configure authentication in a setup step instead
        image: valkey/valkey:8.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          # The commit this run was dispatched and approved on, not the ref's current tip.
          ref: ${{ github.sha }}
          token: ${{ github.token }}

      - name: Setup Python (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ inputs.python-version || '3.14' }}

      - name: Install uv (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7" # keep in step with the ghcr.io/astral-sh/uv tag in Dockerfile and Dockerfile.lambda
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          prune-cache: true

      - name: Verify Python and uv installation
        run: |
          # Check runner type and verify installations
          if [[ "${{ runner.name }}" == *"robosystems"* ]]; then
            echo "🏃 Running on self-hosted runner: ${{ runner.name }}"
            echo "Using pre-installed Python and uv from GHA runner"
          else
            echo "🏃 Running on GitHub-hosted runner: ${{ runner.name }}"
            echo "Using Python and uv installed via actions"
          fi
          echo ""
          echo "Python version: $(python --version)"
          echo "uv version: $(uv --version)"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync --frozen --all-extras

      - name: Create and migrate the extensions database
        run: |
          # The service container only creates the platform DB. DB-backed
          # extensions tests skip without this one, and the library-backed suites
          # need migration 0002's taxonomy seed.
          # A throwaway server: trade durability for speed. Hundreds of
          # DB-backed tests build a schema each, and every DDL statement
          # fsyncs otherwise. All three settings take effect on reload.
          for setting in "fsync = off" "synchronous_commit = off" "full_page_writes = off"; do
            PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
              -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET $setting"
          done
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          echo "🗄️  Creating the extensions database..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE extensions" \
            || echo "extensions database already exists"
          echo "🚀 Applying extensions migrations..."
          uv run alembic -c migrations/extensions.ini upgrade head
          echo "✅ extensions database ready"

      - name: Configure Valkey authentication
        run: |
          echo "🔐 Configuring Valkey authentication..."
          # GitHub Actions service containers run in Docker, so we use docker exec directly
          CONTAINER_ID=$(docker ps --filter "ancestor=valkey/valkey:8.0-alpine" --format "{{.ID}}" | head -1)
          if [ -n "$CONTAINER_ID" ]; then
            # Set the requirepass configuration (must match VALKEY_AUTH_TOKEN env var)
            docker exec $CONTAINER_ID redis-cli CONFIG SET requirepass valkey
            # Verify authentication is working
            docker exec $CONTAINER_ID redis-cli -a valkey ping
            echo "✅ Valkey authentication configured"
          else
            echo "⚠️ Warning: Could not find Valkey container - tests may fail"
            exit 1
          fi

      - name: Setup graph databases and S3
        run: |
          # Create graph database directory structure
          echo "Setting up graph database directories..."
          mkdir -p ./data/lbug-dbs
          chmod 755 ./data/lbug-dbs
          echo "✅ Graph database directory created: ./data/lbug-dbs"

          # SeaweedFS is the same S3 server as compose.yaml runs, with the same
          # identity file. Not a service container: those take no command, and
          # the image needs one to start in S3 mode.
          echo "Starting SeaweedFS..."
          docker run -d --name seaweedfs -p 8333:8333 \
            -v "$PWD/bin/setup/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.51 mini -dir=/data -s3.config=/etc/seaweedfs/s3.json \
            -master.telemetry=false -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
          timeout 60 bash -c 'until curl -sf http://localhost:8333/status > /dev/null; do sleep 2; done'

          # Create the test bucket
          echo "Creating S3 bucket for testing..."
          uv run python -c "import boto3; boto3.client('s3', endpoint_url='http://localhost:8333', region_name='us-east-1').create_bucket(Bucket='robosystems-local')"
          echo "✅ Test environment setup completed"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Install the LadybugDB vector extension
        run: |
          # The pinned extension repository and version the image bakes in,
          # read from the Dockerfile so the two cannot drift.
          image=$(sed -n 's|^FROM \(ghcr.io/ladybugdb/extension-repo[^ ]*\) AS extensions$|\1|p' Dockerfile)
          version=$(sed -n 's|^ARG LADYBUG_EXT_VERSION=||p' Dockerfile | head -1)
          arch=$(dpkg --print-architecture)
          target="$HOME/.lbdb/extension/${version}/linux_${arch}/vector"
          test -n "$image" && test -n "$version"
          mkdir -p "$target"
          container=$(docker create "$image")
          docker cp "$container:/usr/share/nginx/html/v${version}/linux_${arch}/vector/libvector.lbug_extension" "$target/"
          docker rm "$container" > /dev/null
          test -s "$target/libvector.lbug_extension"
          echo "✅ vector extension ${version} (${arch}) installed"

      - name: Run tests
        timeout-minutes: 15
        run: |
          # Run tests (exclude slow tests), one xdist worker per vCPU
          # (`auto` counts physical cores, which halves a hosted runner).
          # Each worker gets its own platform test database, created on demand
          # (tests/xdist_workers.py); the extensions DB stays shared, which
          # `--dist loadfile` makes safe. Same flags as `just test`.
          uv run pytest -n logical --dist loadfile --tb=short -m "not slow"

      - name: Post-test cleanup
        if: always()
        run: |
          # Clean up local Docker Compose containers (not GitHub Actions service containers)
          echo "🧹 Post-test cleanup..."
          docker ps -q --filter "label=com.docker.compose.project=robosystems" | xargs -r docker rm -f || true

          # Clean up graph test databases
          echo "🧹 Cleaning up graph test databases..."
          if [ -d "./data/lbug-dbs" ]; then
            rm -rf ./data/lbug-dbs/*
            echo "✅ Graph test databases cleaned up"
          fi

          docker rm -f seaweedfs > /dev/null 2>&1 || true
          # Note: GitHub Actions service containers (postgres, valkey) are
          # automatically cleaned up by GitHub Actions - do not remove them manually
          echo "✅ Cleanup completed"

      - name: Clean cache (CI optimization)
        if: always() && !contains(runner.name, 'robosystems')
        run: |
          uv cache prune --ci
