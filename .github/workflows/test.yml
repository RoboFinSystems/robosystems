name: Test

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.13"
      runner_config:
        required: true
        type: string
        description: "Runner configuration JSON (from runner availability check)"
jobs:
  test:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write  # Required for Trivy SARIF upload
    env:
      # Environment setup
      ENVIRONMENT: test
      LOG_LEVEL: INFO
      # Use fixed ports for robosystems
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robosystems_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robosystems_test
      # The second of the two databases — per-graph OLTP for the extensions.
      # Created in its own step below; the service container only makes one.
      EXTENSIONS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/extensions
      POSTGRES_PASSWORD: postgres
      # Graph API Configuration
      GRAPH_API_URL: http://localhost:8001
      LBUG_DATABASE_PATH: ./data/lbug-dbs
      # JWT and security secrets for authentication (test environment)
      JWT_SECRET_KEY: test-jwt-secret-key-12345678901234567890abcdef
      CONNECTION_CREDENTIALS_KEY: test-connection-credentials-key-12345678901234567890abcdef
      # Valkey/Redis Configuration (with authentication)
      VALKEY_URL: redis://localhost:6379
      VALKEY_AUTH_TOKEN: valkey # Must match pytest.ini
      # External Service Configuration (test values)
      INTUIT_CLIENT_ID: test-intuit-client-id
      INTUIT_CLIENT_SECRET: test-intuit-secret
      INTUIT_ENVIRONMENT: sandbox
      INTUIT_REDIRECT_URI: http://localhost:8000/auth/callback
      SEC_GOV_USER_AGENT: test-user-agent test@example.com
      OPENFIGI_API_KEY: test-openfigi-key
      # LocalStack S3 Configuration for testing
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_S3_ACCESS_KEY_ID: test
      AWS_S3_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      USER_DATA_BUCKET: robosystems-local
      SHARED_RAW_BUCKET: robosystems-local
      SHARED_PROCESSED_BUCKET: robosystems-local
      # Graph Database Backup Configuration
      LBUG_BACKUP_ENCRYPTION_KEY: test-encryption-key-dev
      # Queue Management Configuration (from pytest.ini)
      ADMISSION_MEMORY_THRESHOLD: "99.0"
      ADMISSION_CPU_THRESHOLD: "99.0"
      ADMISSION_QUEUE_THRESHOLD: "0.95"
      QUERY_QUEUE_MAX_SIZE: "10000"
      QUERY_QUEUE_MAX_CONCURRENT: "100"
      QUERY_QUEUE_MAX_PER_USER: "100"
      QUERY_QUEUE_TIMEOUT: "600"
      LBUG_HTTP_TIMEOUT: "60"
      LBUG_QUERY_TIMEOUT: "60"
      LBUG_MAX_QUERY_LENGTH: "100000"
      # Feature Flags (test configuration)
      USER_REGISTRATION_ENABLED: "true"
      RATE_LIMIT_ENABLED: "false"
      OTEL_ENABLED: "false"
      LOAD_SHEDDING_ENABLED: "true"
      MCP_AUTO_LIMIT_ENABLED: "true"
      MCP_WORKSPACE_ENABLED: "true"
      FACT_GRID_ENABLED: "true"
      BILLING_ENABLED: "true"
      SECURITY_AUDIT_ENABLED: "true"
      LBUG_CIRCUIT_BREAKERS_ENABLED: "true"
      LBUG_REDIS_CACHE_ENABLED: "true"
      LBUG_RETRY_LOGIC_ENABLED: "true"
      LBUG_HEALTH_CHECKS_ENABLED: "true"
      SUBGRAPH_CREATION_ENABLED: "true"
      BACKUP_CREATION_ENABLED: "true"
      EMAIL_VERIFICATION_ENABLED: "true"
      CAPTCHA_ENABLED: "false"
    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: robosystems_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      # Graph database (LadybugDB backend) runs as file-based database, no service container needed
      # Graph databases are created in ./data/lbug-dbs/ directory during tests
      valkey:
        # Note: GitHub Actions doesn't support custom commands for service containers
        # We'll configure authentication in a setup step instead
        image: valkey/valkey:8.0-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      localstack:
        image: localstack/localstack:3.0
        env:
          SERVICES: s3,secretsmanager,iam
          DEBUG: 1
          DATA_DIR: /var/lib/localstack
          PERSISTENCE: 1
          S3_SKIP_SIGNATURE_VALIDATION: 1
          S3_SKIP_KMS_KEY_VALIDATION: 1
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 4566:4566
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Setup Python (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ inputs.python-version || '3.13' }}

      - name: Install uv (GitHub-hosted runners only)
        if: runner.os == 'Linux' && !contains(runner.name, 'robosystems')
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Verify Python and uv installation
        run: |
          # Check runner type and verify installations
          if [[ "${{ runner.name }}" == *"robosystems"* ]]; then
            echo "🏃 Running on self-hosted runner: ${{ runner.name }}"
            echo "Using pre-installed Python and uv from GHA runner"
          else
            echo "🏃 Running on GitHub-hosted runner: ${{ runner.name }}"
            echo "Using Python and uv installed via actions"
          fi
          echo ""
          echo "Python version: $(python --version)"
          echo "uv version: $(uv --version)"

      - name: Install dependencies
        run: |
          uv venv .venv
          uv sync --frozen --all-extras

      - name: Validate lockfile
        run: |
          uv lock --locked

      - name: Create and migrate the extensions database
        run: |
          # The platform DB (robosystems_test) comes from the service
          # container's POSTGRES_DB; the extensions DB is the second of the two
          # databases this repo runs, and CI never made it — so every DB-backed
          # extensions test skipped itself, silently, forever.
          #
          # Migrating is what makes them worth running: 0002 seeds the taxonomy
          # library from the JSON-LD frameworks, which is exactly what the
          # library-backed suites assert against. ~25s on a cold database.
          echo "🗄️  Creating the extensions database..."
          PGPASSWORD=postgres psql -h localhost -U postgres -d postgres \
            -c "CREATE DATABASE extensions" \
            || echo "extensions database already exists"
          echo "🚀 Applying extensions migrations..."
          uv run alembic -c migrations/extensions.ini upgrade head
          echo "✅ extensions database ready"

      - name: Configure Valkey authentication
        run: |
          echo "🔐 Configuring Valkey authentication..."
          # GitHub Actions service containers run in Docker, so we use docker exec directly
          CONTAINER_ID=$(docker ps --filter "ancestor=valkey/valkey:8.0-alpine" --format "{{.ID}}" | head -1)
          if [ -n "$CONTAINER_ID" ]; then
            # Set the requirepass configuration (must match VALKEY_AUTH_TOKEN env var)
            docker exec $CONTAINER_ID redis-cli CONFIG SET requirepass valkey
            # Verify authentication is working
            docker exec $CONTAINER_ID redis-cli -a valkey ping
            echo "✅ Valkey authentication configured"
          else
            echo "⚠️ Warning: Could not find Valkey container - tests may fail"
            exit 1
          fi

      - name: Setup graph databases and LocalStack
        run: |
          # Create graph database directory structure
          echo "Setting up graph database directories..."
          mkdir -p ./data/lbug-dbs
          chmod 755 ./data/lbug-dbs
          echo "✅ Graph database directory created: ./data/lbug-dbs"

          # Wait for LocalStack to be ready
          echo "Waiting for LocalStack to be ready..."
          timeout 60 bash -c 'until curl -f http://localhost:4566/_localstack/health; do sleep 2; done'

          # Wait specifically for S3 service
          timeout 60 bash -c 'until curl -s http://localhost:4566/_localstack/health | grep -q "\"s3\": \"available\""; do sleep 2; done'

          # Create S3 bucket for testing using awslocal
          echo "Creating S3 bucket for testing..."
          uv run awslocal s3api create-bucket --bucket robosystems-local --region us-east-1 || echo "Bucket already exists"

          # Verify bucket was created
          uv run awslocal s3 ls
          echo "✅ Test environment setup completed"
        env:
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1

      - name: Run tests
        timeout-minutes: 15
        run: |
          # Run tests (exclude slow tests), one xdist worker per runner core.
          # Each worker gets its own platform test database, created on demand
          # (tests/xdist_workers.py); the extensions DB stays shared, which
          # `--dist loadfile` makes safe. Same flags as `just test`.
          uv run pytest -n auto --dist loadfile --tb=short -m "not slow"

      - name: Run dbt tests
        timeout-minutes: 1
        run: |
          echo "🔍 Running QuickBooks dbt models and tests..."
          DBT_DIR="robosystems/adapters/quickbooks/dbt"
          TMPDIR=$(mktemp -d)
          DBT_DUCKDB_PATH="$TMPDIR/quickbooks.duckdb" uv run dbt build \
            --profiles-dir "$DBT_DIR" \
            --project-dir "$DBT_DIR" \
            --target-path "$TMPDIR/target" \
            --vars '{"use_seeds": true}'
          echo "✅ dbt: all models and tests passed"

      - name: Run linting
        timeout-minutes: 1
        run: uv run ruff check . --output-format=github

      - name: Run type checking
        timeout-minutes: 3
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: uv run basedpyright

      - name: Lint CloudFormation templates
        timeout-minutes: 1
        run: |
          echo "🔍 Linting CloudFormation templates..."
          uv run cfn-lint

      - name: Lint GitHub Actions workflows
        timeout-minutes: 1
        run: |
          echo "🔍 Linting GitHub Actions workflows..."
          # GitHub does not validate a workflow file until it is triggered, so a
          # malformed expression is invisible until it breaks a run — and for a
          # reusable workflow like service-refresh.yml the run it breaks is a
          # deploy. Accepted pre-existing findings are baselined in
          # .github/actionlint.yaml; anything reported here is new.
          uv run actionlint -shellcheck=

      - name: Scan dependencies for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          scanners: 'vuln'

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
          category: 'dependency-scan'

      - name: Post-test cleanup
        if: always()
        run: |
          # Clean up local Docker Compose containers (not GitHub Actions service containers)
          echo "🧹 Post-test cleanup..."
          docker ps -q --filter "label=com.docker.compose.project=robosystems" | xargs -r docker rm -f || true

          # Clean up graph test databases
          echo "🧹 Cleaning up graph test databases..."
          if [ -d "./data/lbug-dbs" ]; then
            rm -rf ./data/lbug-dbs/*
            echo "✅ Graph test databases cleaned up"
          fi

          # Note: GitHub Actions service containers (postgres, valkey, localstack) are
          # automatically cleaned up by GitHub Actions - do not remove them manually
          echo "✅ Cleanup completed"

      - name: Clean cache (CI optimization)
        if: always() && !contains(runner.name, 'robosystems')
        run: |
          uv cache prune --ci
