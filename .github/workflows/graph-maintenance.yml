name: Graph Maintenance

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Maintenance task to perform"
        required: true
        type: choice
        options:
          - update-ami
          - docker-cleanup
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - staging
          - prod
      trigger_asg_refresh:
        description: "Trigger ASG instance refresh after updating AMI (default: just update SSM parameter for next deploy)"
        required: false
        type: boolean
        default: false
  # Monthly schedule for AMI updates - controlled by GRAPH_AMI_AUTO_UPDATE variable
  # Staging runs first (1st of month), Prod follows next day (2nd of month)
  schedule:
    - cron: "0 7 1 * *" # AMI: Staging 1st of month at 7am UTC
    - cron: "0 7 2 * *" # AMI: Prod 2nd of month at 7am UTC
    # Weekly Docker cleanup - every Sunday at 6am UTC (before typical work hours)
    - cron: "0 6 * * 0" # Docker: Both envs every Sunday

permissions:
  id-token: write
  contents: read
  actions: write
  deployments: write
  security-events: write

concurrency:
  # Use environment for manual runs, cron schedule for scheduled runs (distinguishes staging vs prod)
  group: graph-maintenance-${{ inputs.environment || github.event.schedule }}
  cancel-in-progress: false

jobs:
  # For scheduled runs, determine task type and check if enabled
  schedule-gate:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      environment: ${{ steps.check.outputs.environment }}
      task: ${{ steps.check.outputs.task }}
    steps:
      - name: Check if scheduled runs are enabled
        id: check
        run: |
          CRON="${{ github.event.schedule }}"

          # Docker cleanup: Sunday at 6am UTC - always enabled, runs for both envs
          if [[ "$CRON" == "0 6 * * 0" ]]; then
            echo "task=docker-cleanup" >> $GITHUB_OUTPUT
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "environment=both" >> $GITHUB_OUTPUT
            echo "Weekly Docker cleanup triggered"
            exit 0
          fi

          # AMI update: 1st/2nd of month - requires GRAPH_AMI_AUTO_UPDATE=true
          echo "task=update-ami" >> $GITHUB_OUTPUT
          SETTING="${{ vars.GRAPH_AMI_AUTO_UPDATE }}"
          if [ "$SETTING" == "true" ]; then
            # 1st of month = staging, 2nd of month = prod
            if [[ "$CRON" == "0 7 1 "* ]]; then
              ENV="staging"
            else
              ENV="prod"
            fi
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "environment=$ENV" >> $GITHUB_OUTPUT
            echo "Scheduled AMI update is enabled, will run for $ENV"
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
            echo "environment=" >> $GITHUB_OUTPUT
            echo "Scheduled AMI update is disabled (set GRAPH_AMI_AUTO_UPDATE=true to enable)"
          fi

  # =============================================================================
  # Task: update-ami
  # Updates the GRAPH_AMI_ID variable with the latest Amazon Linux 2023 ARM64 AMI.
  # By default, only updates the variable - deploy happens with next release.
  # If trigger_asg_refresh is true, triggers an ASG instance refresh to roll out the new AMI.
  # =============================================================================
  ami-get-latest:
    # always() needed because schedule-gate is skipped for workflow_dispatch
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.task == 'update-ami') ||
      (github.event_name == 'schedule' && needs.schedule-gate.outputs.should_run == 'true' && needs.schedule-gate.outputs.task == 'update-ami'))
    needs: [schedule-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ami_id: ${{ steps.ami.outputs.ami_id }}
      ami_name: ${{ steps.ami.outputs.ami_name }}
      current_ami: ${{ steps.current.outputs.current_ami }}
      param_name: ${{ steps.current.outputs.param_name }}
      ami_changed: ${{ steps.compare.outputs.ami_changed }}
      # Pass-through inputs for downstream jobs
      environment: ${{ steps.inputs.outputs.environment }}
      trigger_asg_refresh: ${{ steps.inputs.outputs.trigger_asg_refresh }}
    steps:
      - name: Resolve inputs
        id: inputs
        run: |
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "environment=${{ needs.schedule-gate.outputs.environment }}" >> $GITHUB_OUTPUT
            # GRAPH_AMI_AUTO_DEPLOY controls whether scheduled runs also trigger ASG refresh
            TRIGGER_REFRESH="${{ vars.GRAPH_AMI_AUTO_DEPLOY }}"
            if [ "$TRIGGER_REFRESH" == "true" ]; then
              echo "trigger_asg_refresh=true" >> $GITHUB_OUTPUT
              echo "Scheduled run for ${{ needs.schedule-gate.outputs.environment }} (will ASG refresh if AMI changed)"
            else
              echo "trigger_asg_refresh=false" >> $GITHUB_OUTPUT
              echo "Scheduled run for ${{ needs.schedule-gate.outputs.environment }} (SSM update only)"
            fi
          else
            echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
            echo "trigger_asg_refresh=${{ inputs.trigger_asg_refresh }}" >> $GITHUB_OUTPUT
            echo "Manual run for ${{ inputs.environment }}"
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Get Latest AMI
        id: ami
        uses: ./.github/actions/get-latest-ami
        with:
          architecture: arm64

      - name: Get Current AMI from SSM
        id: current
        run: |
          ENV="${{ steps.inputs.outputs.environment }}"
          PARAM_NAME="/robosystems/${ENV}/graph/ami-id"

          # Read current AMI from SSM Parameter Store
          CURRENT_AMI=$(aws ssm get-parameter \
            --name "$PARAM_NAME" \
            --query 'Parameter.Value' \
            --output text 2>/dev/null || echo "not-set")

          echo "current_ami=$CURRENT_AMI" >> $GITHUB_OUTPUT
          echo "param_name=$PARAM_NAME" >> $GITHUB_OUTPUT
          echo "Current $PARAM_NAME: $CURRENT_AMI"

      - name: Compare AMIs
        id: compare
        run: |
          if [ "${{ steps.ami.outputs.ami_id }}" != "${{ steps.current.outputs.current_ami }}" ]; then
            echo "ami_changed=true" >> $GITHUB_OUTPUT
            echo "AMI has changed!"
            echo "  Current: ${{ steps.current.outputs.current_ami }}"
            echo "  Latest:  ${{ steps.ami.outputs.ami_id }}"
          else
            echo "ami_changed=false" >> $GITHUB_OUTPUT
            echo "AMI is already up to date: ${{ steps.ami.outputs.ami_id }}"
          fi

  ami-update-ssm:
    if: |
      always() &&
      needs.ami-get-latest.result == 'success' &&
      needs.ami-get-latest.outputs.ami_changed == 'true'
    needs: [ami-get-latest]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Update AMI in SSM
        run: |
          PARAM_NAME="${{ needs.ami-get-latest.outputs.param_name }}"
          AMI_ID="${{ needs.ami-get-latest.outputs.ami_id }}"
          AMI_NAME="${{ needs.ami-get-latest.outputs.ami_name }}"

          echo "Updating $PARAM_NAME to: $AMI_ID"
          aws ssm put-parameter \
            --name "$PARAM_NAME" \
            --value "$AMI_ID" \
            --type "String" \
            --description "Graph AMI: $AMI_NAME (updated by graph-maintenance)" \
            --overwrite

          echo "✅ SSM parameter updated successfully"

  # ASG refresh to pick up new AMI (replaces instances without a full deploy)
  ami-deploy-staging:
    if: |
      always() &&
      needs.ami-update-ssm.result == 'success' &&
      needs.ami-get-latest.outputs.trigger_asg_refresh == 'true' &&
      needs.ami-get-latest.outputs.environment == 'staging'
    needs: [ami-get-latest, ami-update-ssm]
    uses: ./.github/workflows/graph-asg-refresh.yml
    with:
      environment: staging
    secrets: inherit

  # ASG refresh to pick up new AMI (replaces instances without a full deploy)
  ami-deploy-prod:
    if: |
      always() &&
      needs.ami-update-ssm.result == 'success' &&
      needs.ami-get-latest.outputs.trigger_asg_refresh == 'true' &&
      needs.ami-get-latest.outputs.environment == 'prod'
    needs: [ami-get-latest, ami-update-ssm]
    uses: ./.github/workflows/graph-asg-refresh.yml
    with:
      environment: prod
    secrets: inherit

  # =============================================================================
  # Task: docker-cleanup
  # Removes unused Docker images, containers, and volumes to free disk space.
  # Runs weekly on schedule, or can be triggered manually.
  # =============================================================================
  docker-cleanup:
    if: |
      always() &&
      ((github.event_name == 'workflow_dispatch' && inputs.task == 'docker-cleanup') ||
      (github.event_name == 'schedule' && needs.schedule-gate.outputs.should_run == 'true' && needs.schedule-gate.outputs.task == 'docker-cleanup'))
    needs: [schedule-gate]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      instances_cleaned: ${{ steps.cleanup.outputs.instances_cleaned }}
      space_freed: ${{ steps.cleanup.outputs.space_freed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Discover Graph Instances
        id: instances
        run: |
          # For manual runs, use selected environment; for scheduled, do both
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENVS="${{ inputs.environment }}"
          else
            ENVS="staging prod"
          fi

          INSTANCE_IDS=""
          for ENV in $ENVS; do
            echo "🔍 Discovering instances for $ENV..."

            # Find LadybugDB writer instances by tag
            WRITERS=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Environment,Values=$ENV" \
                "Name=tag:LadybugRole,Values=writer" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text 2>/dev/null || echo "")

            # Find shared-writer instances
            SHARED_WRITERS=$(aws ec2 describe-instances \
              --filters \
                "Name=tag:Environment,Values=$ENV" \
                "Name=tag:LadybugRole,Values=shared-writer" \
                "Name=instance-state-name,Values=running" \
              --query "Reservations[].Instances[].InstanceId" \
              --output text 2>/dev/null || echo "")

            for ID in $WRITERS $SHARED_WRITERS; do
              if [ -n "$ID" ]; then
                INSTANCE_IDS="$INSTANCE_IDS $ID"
                echo "  Found: $ID"
              fi
            done
          done

          INSTANCE_IDS=$(echo $INSTANCE_IDS | xargs)
          echo "instance_ids=$INSTANCE_IDS" >> $GITHUB_OUTPUT
          echo "📋 Total instances to clean: $(echo $INSTANCE_IDS | wc -w | xargs)"

      - name: Run Docker Cleanup
        id: cleanup
        run: |
          INSTANCE_IDS="${{ steps.instances.outputs.instance_ids }}"
          if [ -z "$INSTANCE_IDS" ]; then
            echo "::warning::No instances to clean"
            echo "instances_cleaned=0" >> $GITHUB_OUTPUT
            echo "space_freed=0" >> $GITHUB_OUTPUT
            exit 0
          fi

          CLEANED=0
          TOTAL_FREED=""

          for INSTANCE_ID in $INSTANCE_IDS; do
            echo "🧹 Cleaning Docker on $INSTANCE_ID..."

            # Send cleanup command
            COMMAND_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --parameters commands="docker system prune -af 2>&1 && df -h / | tail -1" \
              --query 'Command.CommandId' \
              --output text)

            echo "  Command ID: $COMMAND_ID"

            # Wait for completion
            if aws ssm wait command-executed \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" 2>/dev/null; then

              OUTPUT=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardOutputContent' \
                --output text 2>/dev/null || echo "")

              echo "  ✅ Cleanup completed"
              # Extract disk usage line
              DISK_LINE=$(echo "$OUTPUT" | grep -E '^/dev/' | tail -1 || echo "")
              if [ -n "$DISK_LINE" ]; then
                echo "  Disk: $DISK_LINE"
                TOTAL_FREED="$TOTAL_FREED\n$INSTANCE_ID: $DISK_LINE"
              fi
              CLEANED=$((CLEANED + 1))
            else
              echo "  ⚠️ Cleanup timed out or failed"
              ERROR=$(aws ssm get-command-invocation \
                --command-id "$COMMAND_ID" \
                --instance-id "$INSTANCE_ID" \
                --query 'StandardErrorContent' \
                --output text 2>/dev/null || echo "Unknown error")
              echo "  Error: $ERROR"
            fi
          done

          echo "instances_cleaned=$CLEANED" >> $GITHUB_OUTPUT
          echo "space_freed<<EOF" >> $GITHUB_OUTPUT
          echo -e "$TOTAL_FREED" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # =============================================================================
  # Email Notification (AMI updates only)
  # =============================================================================
  notify:
    needs: [ami-get-latest, ami-update-ssm, ami-deploy-staging, ami-deploy-prod]
    if: |
      always() &&
      needs.ami-get-latest.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Send SNS Notification
        run: |
          ENV="${{ needs.ami-get-latest.outputs.environment }}"
          REGION="${{ vars.AWS_REGION || 'us-east-1' }}"
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          # Gather results
          AMI_CHANGED="${{ needs.ami-get-latest.outputs.ami_changed }}"
          SSM_UPDATE="${{ needs.ami-update-ssm.result }}"
          ASG_STAGING="${{ needs.ami-deploy-staging.result }}"
          ASG_PROD="${{ needs.ami-deploy-prod.result }}"
          TRIGGER_REFRESH="${{ needs.ami-get-latest.outputs.trigger_asg_refresh }}"

          # Determine overall status
          HAS_FAILURE=false
          if [ "$SSM_UPDATE" == "failure" ] || [ "$ASG_STAGING" == "failure" ] || [ "$ASG_PROD" == "failure" ]; then
            HAS_FAILURE=true
          fi

          if [ "$HAS_FAILURE" == "true" ]; then
            SUBJECT="[ALERT] Graph AMI Update Failed - ${ENV}"
          elif [ "$AMI_CHANGED" == "true" ]; then
            SUBJECT="Graph AMI Updated - ${ENV}"
          else
            SUBJECT="Graph AMI Check - No Update Needed - ${ENV}"
          fi

          MESSAGE="RoboSystems Graph AMI Maintenance Report
          ==========================================

          Environment: ${ENV}
          Trigger: ${{ github.event_name }}
          Timestamp: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          AMI Details:
          ------------
          Previous AMI: ${{ needs.ami-get-latest.outputs.current_ami }}
          Latest AMI:   ${{ needs.ami-get-latest.outputs.ami_id }}
          AMI Name:     ${{ needs.ami-get-latest.outputs.ami_name }}
          AMI Changed:  ${AMI_CHANGED}

          Job Results:
          ------------
          Get Latest AMI:     ${{ needs.ami-get-latest.result }}
          Update SSM:         ${SSM_UPDATE}
          ASG Refresh Staging: ${ASG_STAGING}
          ASG Refresh Prod:    ${ASG_PROD}
          Trigger ASG Refresh: ${TRIGGER_REFRESH}

          ---
          This notification was sent by GitHub Actions (graph-maintenance workflow).
          "

          SNS_TOPIC="arn:aws:sns:${REGION}:${ACCOUNT_ID}:robosystems-postgres-${ENV}-alerts"

          if aws sns publish \
            --topic-arn "${SNS_TOPIC}" \
            --subject "${SUBJECT}" \
            --message "${MESSAGE}"; then
            echo "SNS notification sent to ${SNS_TOPIC}"
          else
            echo "Warning: Could not send SNS notification"
            echo "Topic ${SNS_TOPIC} may not exist"
          fi

  # =============================================================================
  # Summary (runs for all tasks)
  # =============================================================================
  summary:
    needs: [ami-get-latest, ami-update-ssm, ami-deploy-staging, ami-deploy-prod, docker-cleanup, notify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Docker Cleanup Summary
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.task == 'docker-cleanup') ||
          (github.event_name == 'schedule' && needs.docker-cleanup.result != 'skipped')
        run: |
          echo "## Graph Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Task: Docker Cleanup 🧹" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Instances Cleaned | ${{ needs.docker-cleanup.outputs.instances_cleaned || '0' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Result | ${{ needs.docker-cleanup.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -n "${{ needs.docker-cleanup.outputs.space_freed }}" ]; then
            echo "### Disk Status After Cleanup" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            echo "${{ needs.docker-cleanup.outputs.space_freed }}" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: **${{ github.actor }}** at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

      - name: Generate AMI Update Summary
        if: |
          (github.event_name == 'workflow_dispatch' && inputs.task == 'update-ami') ||
          (github.event_name == 'schedule' && needs.ami-get-latest.result != 'skipped')
        run: |
          echo "## Graph Maintenance Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Task: Update AMI" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | ${{ github.event_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ needs.ami-get-latest.outputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SSM Parameter | \`${{ needs.ami-get-latest.outputs.param_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Previous AMI | \`${{ needs.ami-get-latest.outputs.current_ami }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest AMI | \`${{ needs.ami-get-latest.outputs.ami_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| AMI Name | ${{ needs.ami-get-latest.outputs.ami_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| AMI Changed | ${{ needs.ami-get-latest.outputs.ami_changed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger ASG Refresh | ${{ needs.ami-get-latest.outputs.trigger_asg_refresh }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Get Latest AMI | ${{ needs.ami-get-latest.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Update SSM | ${{ needs.ami-update-ssm.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ASG Refresh Staging | ${{ needs.ami-deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ASG Refresh Prod | ${{ needs.ami-deploy-prod.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: **${{ github.actor }}** at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY
