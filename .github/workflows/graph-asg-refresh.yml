name: Graph ASG Refresh

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to refresh (staging, prod)"
        required: true
        type: choice
        options:
          - staging
          - prod
      tier:
        description: "Tier to refresh (leave empty for all tiers)"
        required: false
        type: choice
        options:
          - ""
          - ladybug-standard
          - ladybug-large
          - ladybug-xlarge
          - ladybug-shared
      instance_warmup:
        description: "Seconds to wait for instance warmup"
        required: false
        type: string
        default: "300"
      max_wait_minutes:
        description: "Minutes to wait for in-flight destructive ops to finish"
        required: false
        type: string
        default: "30"
      force_ignore_busy:
        description: "Skip busy-counter check (emergency override)"
        required: false
        type: boolean
        default: false
      wait_for_completion:
        description: "Monitor refreshes to completion (uncheck to start them and return)"
        required: false
        type: boolean
        default: true
      completion_wait_minutes:
        description: "Minutes to monitor for completion (ignored when not waiting)"
        required: false
        type: string
        default: "20"
  workflow_call:
    inputs:
      environment:
        description: "Environment to refresh (staging, prod)"
        required: true
        type: string
      tier:
        description: "Tier to refresh (empty for all tiers)"
        required: false
        type: string
        default: ""
      instance_warmup:
        description: "Seconds to wait for instance warmup"
        required: false
        type: string
        default: "300"
      max_wait_minutes:
        description: "Minutes to wait for in-flight destructive ops to finish"
        required: false
        type: string
        default: "30"
      force_ignore_busy:
        description: "Skip busy-counter check (emergency override)"
        required: false
        type: boolean
        default: false
      wait_for_completion:
        description: "Monitor refreshes to completion (false starts them and returns)"
        required: false
        type: string
        default: "true"
      completion_wait_minutes:
        description: "Minutes to monitor for completion (ignored when not waiting)"
        required: false
        type: string
        default: "20"

permissions:
  id-token: write
  contents: read
  actions: read

concurrency:
  group: graph-asg-refresh-${{ inputs.environment }}-${{ inputs.tier || 'all' }}
  cancel-in-progress: false

jobs:
  # This job exists only to do arithmetic, because GitHub Actions expressions have
  # no arithmetic operators and `timeout-minutes` can read `needs` but not compute.
  #
  # It is not cosmetic. The action's busy-counter wait runs **per tier,
  # sequentially**, each up to max_wait_minutes, and a run with no `tier` input
  # iterates every writer tier. A fixed 45-minute job cap was therefore roughly
  # 2.4x smaller than the worst-case internal budget (3 tiers x 30m, plus a 20m
  # refresh-completion wait), so both the "timed out waiting for idle" error and
  # the completion-wait branch were unreachable: a legitimately slow refresh was
  # killed by the runner and reported as a bare cancellation with no diagnostic.
  budget:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      job_timeout_minutes: ${{ steps.compute.outputs.job_timeout_minutes }}
    steps:
      - name: Compute job timeout from the internal wait budget
        id: compute
        env:
          MAX_WAIT: ${{ inputs.max_wait_minutes || '30' }}
          TIER: ${{ inputs.tier }}
          WAIT_FOR_COMPLETION: ${{ inputs.wait_for_completion }}
          COMPLETION_WAIT: ${{ inputs.completion_wait_minutes || '20' }}
        run: |
          set -uo pipefail
          for pair in "max_wait_minutes:$MAX_WAIT" "completion_wait_minutes:$COMPLETION_WAIT"; do
            if ! [[ "${pair#*:}" =~ ^[0-9]+$ ]]; then
              echo "::error::${pair%%:*} must be a positive integer, got '${pair#*:}'"
              exit 1
            fi
          done

          # One tier when explicitly targeted; otherwise every writer tier the
          # action iterates. ladybug-shared is skipped before its busy wait, so it
          # contributes nothing — keep this count in step with TIER_STACKS minus
          # SHARED_TIERS in .github/actions/refresh-graph-asg/action.yml.
          if [ -n "$TIER" ]; then TIERS=1; else TIERS=3; fi

          # The busy-counter gate runs per tier in both modes and cannot be
          # deferred, so it is always in the budget. The completion wait only
          # applies when monitoring — that is the whole point of the async mode.
          if [ "$WAIT_FOR_COMPLETION" = "false" ]; then COMPLETION=0; else COMPLETION="$COMPLETION_WAIT"; fi

          # +10 slack for runner startup, checkout, and describe calls.
          TOTAL=$(( MAX_WAIT * TIERS + COMPLETION + 10 ))
          echo "job_timeout_minutes=${TOTAL}" >> $GITHUB_OUTPUT
          echo "Busy wait ${MAX_WAIT}m x ${TIERS} tier(s) + ${COMPLETION}m completion + 10m slack = ${TOTAL}m"

  refresh-asgs:
    needs: [budget]
    runs-on: ubuntu-latest
    # Must exceed the action's own internal budget, or its timeout branches can
    # never report. Derived, never fixed — see the budget job.
    timeout-minutes: ${{ fromJSON(needs.budget.outputs.job_timeout_minutes) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Graph ASG Refresh
        id: refresh
        uses: ./.github/actions/refresh-graph-asg
        with:
          environment: ${{ inputs.environment }}
          tier: ${{ inputs.tier }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
          instance-warmup: ${{ inputs.instance_warmup }}
          max-wait-minutes: ${{ inputs.max_wait_minutes }}
          force-ignore-busy: ${{ inputs.force_ignore_busy }}
          wait-for-completion: ${{ inputs.wait_for_completion }}
          completion-wait-minutes: ${{ inputs.completion_wait_minutes }}

      - name: Summary
        if: always()
        run: |
          echo "## Graph ASG Instance Refresh Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | ${{ inputs.tier || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Instance Warmup | ${{ inputs.instance_warmup }}s |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.refresh.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ASGs Refreshed | ${{ steps.refresh.outputs['total-refreshed'] }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Refreshed ASGs | ${{ steps.refresh.outputs['refreshed-asgs'] || 'none' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Triggered by: ${{ github.actor }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    needs: [refresh-asgs]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Notify failure
        run: |
          echo "## Graph ASG Refresh Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | ${{ inputs.environment }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tier | ${{ inputs.tier || 'all' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the workflow logs for details." >> $GITHUB_STEP_SUMMARY
