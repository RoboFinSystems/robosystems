name: Deploy Dagster

on:
  workflow_call:
    inputs:
      # Stack & Repository Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod or staging)"
        required: true
        type: string
      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string
      vpc_id:
        description: "VPC ID for ECS tasks"
        required: true
        type: string
      subnet_ids:
        description: "Private subnet IDs for ECS tasks (comma-separated)"
        required: true
        type: string

      # Container & Application Configuration
      ecr_repository_url:
        description: "Full ECR repository URL"
        required: true
        type: string
      ecr_image_tag:
        description: "Docker image tag"
        required: true
        type: string

      # Fargate Configuration
      daemon_cpu:
        description: "CPU units for Dagster daemon"
        required: false
        type: string
        default: "512"
      daemon_memory:
        description: "Memory in MiB for Dagster daemon"
        required: false
        type: string
        default: "1024"
      webserver_cpu:
        description: "CPU units for Dagster webserver"
        required: false
        type: string
        default: "512"
      webserver_memory:
        description: "Memory in MiB for Dagster webserver"
        required: false
        type: string
        default: "1024"
      # Run Job Profiles are hardcoded (profile name = fixed resources):
      # - Light:    512 CPU,  2048 MB (0.5 vCPU, 2 GB)  - sensors, simple jobs
      # - Standard: 2048 CPU, 8192 MB (2 vCPU, 8 GB)    - moderate ETL
      # - Compute:  4096 CPU, 16384 MB (4 vCPU, 16 GB)  - SEC daily processing
      # - Heavy:    16384 CPU, 65536 MB (16 vCPU, 64 GB) - SEC backfills
      max_concurrent_runs:
        description: "Maximum concurrent Dagster runs (QueuedRunCoordinator)"
        required: false
        type: string
        default: "20"

      # Capacity Provider Configuration (Spot vs On-Demand)
      daemon_fargate_spot_weight:
        description: "Percentage of daemon tasks on Spot (0 = all on-demand, 80 = 80% Spot). On-demand weight is derived as 100 - spot_weight."
        required: false
        type: string
        default: "0"
      webserver_fargate_spot_weight:
        description: "Percentage of webserver tasks on Spot (0 = all on-demand, 80 = 80% Spot). On-demand weight is derived as 100 - spot_weight."
        required: false
        type: string
        default: "0"
      daemon_fargate_base:
        description: "Minimum daemon tasks guaranteed on FARGATE (On-Demand)"
        required: false
        type: string
        default: "0"
      webserver_fargate_base:
        description: "Minimum webserver tasks guaranteed on FARGATE (On-Demand)"
        required: false
        type: string
        default: "0"

      # Cache Configuration
      valkey_url:
        description: "Valkey ElastiCache endpoint URL"
        required: true
        type: string
      valkey_sg_id:
        description: "Security group ID for Valkey access"
        required: true
        type: string
      opensearch_endpoint:
        description: "OpenSearch domain endpoint URL (empty if not deployed)"
        required: false
        type: string
        default: ""

      # Database Configuration (from Postgres stack outputs)
      database_endpoint:
        description: "PostgreSQL database endpoint hostname"
        required: true
        type: string
      database_port:
        description: "PostgreSQL database port"
        required: false
        type: string
        default: "5432"
      database_sg_id:
        description: "Security group ID for PostgreSQL access"
        required: true
        type: string

      # Bastion Access (for port forwarding to Dagster UI)
      bastion_sg_id:
        description: "Security group ID for bastion host access (optional)"
        required: false
        type: string
        default: ""

      # Monitoring Configuration
      container_insights_enabled:
        description: "Enable Container Insights for ECS cluster (enabled/disabled)"
        required: false
        type: string
        default: "disabled"

      # S3 Bucket Configuration (from S3 stack outputs)
      shared_raw_bucket_arn:
        description: "ARN of shared raw data bucket (from S3 stack)"
        required: true
        type: string
      shared_processed_bucket_arn:
        description: "ARN of shared processed data bucket (from S3 stack)"
        required: true
        type: string
      deployment_bucket_arn:
        description: "ARN of deployment bucket (from S3 stack)"
        required: true
        type: string
      user_data_bucket_arn:
        description: "ARN of user data bucket (from S3 stack)"
        required: true
        type: string
      public_data_bucket_arn:
        description: "ARN of public data bucket (from S3 stack)"
        required: true
        type: string
      logs_bucket_arn:
        description: "ARN of logs bucket for Dagster compute logs (from S3 stack)"
        required: true
        type: string
      public_data_cdn_url:
        description: "CloudFront CDN URL for public data (from S3 stack)"
        required: true
        type: string
      robosystems_app_url:
        description: "RoboSystems frontend URL"
        required: false
        type: string
        default: "https://robosystems.ai"
      roboledger_app_url:
        description: "RoboLedger frontend URL"
        required: false
        type: string
        default: "https://roboledger.ai"
      roboinvestor_app_url:
        description: "RoboInvestor frontend URL"
        required: false
        type: string
        default: "https://roboinvestor.ai"

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    outputs:
      is_new_stack: ${{ steps.deploy-stack.outputs.is_new_stack }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Resolve API Security Group ID
        id: resolve-api-sg
        run: |
          echo "🔍 Looking up API Security Group ID..."
          SG_NAME="sg-robosystems-api-${{ inputs.environment }}"

          MAX_ATTEMPTS=18
          ATTEMPT=1

          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking for Security Group..."

            API_SG_ID=$(aws ec2 describe-security-groups \
              --filters "Name=tag:Name,Values=$SG_NAME" \
              --query "SecurityGroups[0].GroupId" \
              --output text 2>/dev/null || echo "")

            if [ -n "$API_SG_ID" ] && [ "$API_SG_ID" != "None" ]; then
              echo "✅ Found API Security Group ID: $API_SG_ID"
              echo "api_sg_id=$API_SG_ID" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Security Group not found yet - waiting 10 seconds..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ Timed out waiting for API Security Group after 3 minutes"
          exit 1

      - name: Deploy Dagster CloudFormation Stack
        id: deploy-stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'Stack with id ${{ inputs.stack_name }} does not exist'; then
            STACK_ACTION="create-stack"
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          # Convert Spot percentages to on-demand weights (capacity providers use relative weights)
          DAEMON_OD_WEIGHT=$((100 - ${{ inputs.daemon_fargate_spot_weight }}))
          WEBSERVER_OD_WEIGHT=$((100 - ${{ inputs.webserver_fargate_spot_weight }}))

          STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
                ParameterKey=VpcId,ParameterValue=${{ inputs.vpc_id }} \
                ParameterKey=SubnetIds,ParameterValue=\"${{ inputs.subnet_ids }}\" \
                ParameterKey=ECRRepositoryUrl,ParameterValue=${{ inputs.ecr_repository_url }} \
                ParameterKey=ECRImageTag,ParameterValue=${{ inputs.ecr_image_tag }} \
                ParameterKey=DaemonCpu,ParameterValue=${{ inputs.daemon_cpu }} \
                ParameterKey=DaemonMemory,ParameterValue=${{ inputs.daemon_memory }} \
                ParameterKey=WebserverCpu,ParameterValue=${{ inputs.webserver_cpu }} \
                ParameterKey=WebserverMemory,ParameterValue=${{ inputs.webserver_memory }} \
                ParameterKey=RunJobCpu,ParameterValue=512 \
                ParameterKey=RunJobMemory,ParameterValue=2048 \
                ParameterKey=MaxConcurrentRuns,ParameterValue=${{ inputs.max_concurrent_runs }} \
                ParameterKey=DaemonFargateWeight,ParameterValue=${DAEMON_OD_WEIGHT} \
                ParameterKey=DaemonFargateSpotWeight,ParameterValue=${{ inputs.daemon_fargate_spot_weight }} \
                ParameterKey=DaemonFargateBase,ParameterValue=${{ inputs.daemon_fargate_base }} \
                ParameterKey=WebserverFargateWeight,ParameterValue=${WEBSERVER_OD_WEIGHT} \
                ParameterKey=WebserverFargateSpotWeight,ParameterValue=${{ inputs.webserver_fargate_spot_weight }} \
                ParameterKey=WebserverFargateBase,ParameterValue=${{ inputs.webserver_fargate_base }} \
                ParameterKey=ValkeyUrl,ParameterValue=${{ inputs.valkey_url }} \
                ParameterKey=ValkeyClientSecurityGroupId,ParameterValue=${{ inputs.valkey_sg_id }} \
                ParameterKey=OpenSearchEndpoint,ParameterValue=\"${{ inputs.opensearch_endpoint }}\" \
                ParameterKey=DatabaseEndpoint,ParameterValue=${{ inputs.database_endpoint }} \
                ParameterKey=DatabasePort,ParameterValue=${{ inputs.database_port }} \
                ParameterKey=DatabaseSecurityGroupId,ParameterValue=${{ inputs.database_sg_id }} \
                ParameterKey=BastionSecurityGroupId,ParameterValue=${{ inputs.bastion_sg_id }} \
                ParameterKey=ApiSecurityGroupId,ParameterValue=${{ steps.resolve-api-sg.outputs.api_sg_id }} \
                ParameterKey=ContainerInsightsEnabled,ParameterValue=${{ inputs.container_insights_enabled }} \
                ParameterKey=SharedRawBucketArn,ParameterValue=\"${{ inputs.shared_raw_bucket_arn }}\" \
                ParameterKey=SharedProcessedBucketArn,ParameterValue=\"${{ inputs.shared_processed_bucket_arn }}\" \
                ParameterKey=DeploymentBucketArn,ParameterValue=\"${{ inputs.deployment_bucket_arn }}\" \
                ParameterKey=UserDataBucketArn,ParameterValue=\"${{ inputs.user_data_bucket_arn }}\" \
                ParameterKey=PublicDataBucketArn,ParameterValue=\"${{ inputs.public_data_bucket_arn }}\" \
                ParameterKey=LogsBucketArn,ParameterValue=\"${{ inputs.logs_bucket_arn }}\" \
                ParameterKey=PublicDataCDNURL,ParameterValue=\"${{ inputs.public_data_cdn_url }}\" \
                ParameterKey=RoboSystemsAppUrl,ParameterValue=\"${{ inputs.robosystems_app_url }}\" \
                ParameterKey=RoboLedgerAppUrl,ParameterValue=\"${{ inputs.roboledger_app_url }}\" \
                ParameterKey=RoboInvestorAppUrl,ParameterValue=\"${{ inputs.roboinvestor_app_url }}\""

          # Deploy or update the stack
          if [ "$STACK_ACTION" = "create-stack" ]; then
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/dagster.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=Dagster \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/dagster.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=Dagster \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions 2>&1) || true

            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "Stack is already up to date - no changes needed"
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "Stack update initiated successfully"
            fi
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: "1800"
          interval: "10"
