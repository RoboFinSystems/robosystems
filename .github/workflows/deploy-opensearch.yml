name: Deploy OpenSearch

on:
  workflow_call:
    inputs:
      # Stack & Repository Configuration
      stack_name:
        description: "CloudFormation stack name"
        required: true
        type: string
      environment:
        description: "Environment to deploy to (prod, staging)"
        required: true
        type: string

      # GHA Runner Configuration
      runner_config:
        description: "GitHub Actions runner configuration (JSON array)"
        required: false
        type: string
        default: '["ubuntu-latest"]'

      # AWS Configuration
      aws_region:
        description: "AWS region for deployment"
        required: true
        type: string

      # Capacity Limits (account-level OCU caps for cost control)
      max_indexing_ocu:
        description: "Maximum indexing OCUs (minimum 1, multiples of 2)"
        required: false
        type: string
        default: "1"
      max_search_ocu:
        description: "Maximum search OCUs (minimum 1, multiples of 2)"
        required: false
        type: string
        default: "1"

      # VPC Endpoint (optional — eliminates NAT data transfer costs)
      vpc_endpoint_enabled:
        description: "Enable VPC endpoint for private access (true/false)"
        required: false
        type: string
        default: "false"
      vpc_id:
        description: "VPC ID (always passed, only used when vpc_endpoint_enabled=true)"
        required: false
        type: string
        default: ""
      subnet_ids:
        description: "Comma-separated private subnet IDs (only used when vpc_endpoint_enabled=true)"
        required: false
        type: string
        default: ""

      # Notification Configuration
      aws_sns_alert_email:
        description: "Email address for SNS alerts and notifications"
        required: true
        type: string

    outputs:
      opensearch_endpoint:
        description: "OpenSearch Serverless collection endpoint URL"
        value: ${{ jobs.deploy.outputs.opensearch_endpoint }}

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner_config) }}
    timeout-minutes: 15  # Serverless collection creation is faster (~5 min)
    permissions:
      id-token: write
      contents: read
    outputs:
      opensearch_endpoint: ${{ steps.stack-outputs.outputs.opensearch_endpoint }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.ref }}
          token: ${{ github.token }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.aws_region }}

      - name: Deploy OpenSearch CloudFormation Stack
        id: deploy-stack
        run: |
          if aws cloudformation describe-stacks --stack-name ${{ inputs.stack_name }} 2>&1 | grep -q 'Stack with id ${{ inputs.stack_name }} does not exist'; then
            STACK_ACTION="create-stack"
            echo "Creating new stack ${{ inputs.stack_name }}"
            echo "is_new_stack=true" >> $GITHUB_OUTPUT
          else
            STACK_ACTION="update-stack"
            echo "Updating existing stack ${{ inputs.stack_name }}"
            echo "is_new_stack=false" >> $GITHUB_OUTPUT
          fi

          OPENSEARCH_STACK_PARAMS="ParameterKey=Environment,ParameterValue=${{ inputs.environment }} \
                ParameterKey=VpcEndpointEnabled,ParameterValue=${{ inputs.vpc_endpoint_enabled }} \
                ParameterKey=VpcId,ParameterValue=\"${{ inputs.vpc_id }}\" \
                ParameterKey=SubnetIds,ParameterValue=\"${{ inputs.subnet_ids }}\" \
                ParameterKey=SNSAlertEmail,ParameterValue=${{ inputs.aws_sns_alert_email }}"

          if [ "$STACK_ACTION" = "create-stack" ]; then
            aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/opensearch.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $OPENSEARCH_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=OpenSearch \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions
          else
            UPDATE_OUTPUT=$(aws cloudformation $STACK_ACTION \
              --stack-name ${{ inputs.stack_name }} \
              --template-body file://cloudformation/opensearch.yaml \
              --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
              --parameters $OPENSEARCH_STACK_PARAMS \
              --tags \
                Key=Environment,Value=${{ inputs.environment }} \
                Key=Service,Value=RoboSystems \
                Key=Component,Value=OpenSearch \
                Key=Repository,Value=${{ github.repository }} \
                Key=CreatedBy,Value=GitHubActions 2>&1) || true

            if echo "$UPDATE_OUTPUT" | grep -q "No updates are to be performed"; then
              echo "Stack is already up to date - no changes needed"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            elif echo "$UPDATE_OUTPUT" | grep -q "error"; then
              echo "Error updating stack: $UPDATE_OUTPUT"
              exit 1
            else
              echo "Stack update initiated successfully"
              echo "is_new_stack=false" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Monitor Stack Deployment
        uses: ./.github/actions/monitor-stack-deployment
        with:
          stack-name: ${{ inputs.stack_name }}
          timeout: "900"
          interval: "10"

      - name: Configure OCU Capacity Limits
        run: |
          echo "Setting account-level OCU capacity limits..."
          echo "  Max indexing: ${{ inputs.max_indexing_ocu }} OCUs"
          echo "  Max search: ${{ inputs.max_search_ocu }} OCUs"
          aws opensearchserverless update-account-settings \
            --capacity-limits "{\"maxIndexingCapacityInOCU\": ${{ inputs.max_indexing_ocu }}, \"maxSearchCapacityInOCU\": ${{ inputs.max_search_ocu }}}"
          echo "OCU capacity limits configured"

      - name: Get Stack Outputs
        id: stack-outputs
        run: |
          echo "Retrieving stack outputs..."

          OPENSEARCH_ENDPOINT=$(aws cloudformation describe-stacks \
            --stack-name ${{ inputs.stack_name }} \
            --query "Stacks[0].Outputs[?OutputKey=='OpenSearchEndpoint'].OutputValue" \
            --output text)

          if [ -n "$OPENSEARCH_ENDPOINT" ]; then
            echo "opensearch_endpoint=$OPENSEARCH_ENDPOINT" >> $GITHUB_OUTPUT
            echo "Found OpenSearch endpoint: $OPENSEARCH_ENDPOINT"
          else
            echo "Warning: Could not retrieve OpenSearch endpoint"
            exit 1
          fi

      - name: Update Deployment Status
        if: always()
        run: |
          if [ "${{ steps.deploy-stack.outputs.is_new_stack }}" == "true" ]; then
            echo "OpenSearch Serverless stack creation completed"
          else
            echo "OpenSearch Serverless stack update completed"
          fi
