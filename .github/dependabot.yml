version: 2
updates:
  # GitHub Actions — pinned action versions (e.g., trivy-action@0.35.0)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    ignore:
      # hold: v9's prune-cache flip bloats the cache; v10's guard covers events we don't use
      - dependency-name: "astral-sh/setup-uv"
        update-types: ["version-update:semver-major"]
    groups:
      # One PR per run for minor/patch pins; majors stay individual for review
      actions-minor-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Python — uv dependencies in pyproject.toml and uv.lock
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    ignore:
      # hold: pyproject caps dbt-core <1.12 (beta parser dep + unused metricflow subtree)
      - dependency-name: "dbt-core"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # hold: stripe-python 12+ removes stripe.error; upgrade deliberately, not via Dependabot
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
      # Graph-engine pins move only with a deliberate engine upgrade: ladybug pairs
      # with LADYBUG_EXT_VERSION in the Dockerfile, duckdb with the Arrow-export
      # seam, lancedb with an on-disk format check. 0.x minors are not "safe"
      - dependency-name: "ladybug"
      - dependency-name: "duckdb"
      - dependency-name: "lancedb"
      # hold: majors on these carry a pyproject `# hold:` comment with the reason
      - dependency-name: "pandas"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pyarrow"
        update-types: ["version-update:semver-major"]
      - dependency-name: "webauthn"
        update-types: ["version-update:semver-major"]
      # hold: 2.1 changes the default postgresql:// driver to psycopg 3 (see pyproject)
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      # The opentelemetry-* family is version-coupled (api/sdk/exporters on
      # 1.x, instrumentations on the paired 0.xxb0) and must move in lockstep
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      # The dagster family is version-coupled (core/webserver on 1.x.y,
      # libraries on the matching 0.(x+16).y) and must move in lockstep
      dagster:
        patterns:
          - "dagster"
          - "dagster-*"
      # dbt core and its duckdb adapter version independently but must be
      # compatibility-tested together; propose them as one PR
      dbt:
        patterns:
          - "dbt-core"
          - "dbt-duckdb"
      # Everything else at minor/patch in one PR per run; listed last so the
      # lockstep groups above claim their packages first, and majors stay individual
      python-minor-patch:
        patterns:
          - "*"
        update-types: ["minor", "patch"]

  # Docker — base images in Dockerfiles
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
    ignore:
      # Never auto-bump Python runtime versions — requires explicit migration
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "lambda/python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Digest-pinned; moves only with LADYBUG_EXT_VERSION on an engine upgrade.
      - dependency-name: "ghcr.io/ladybugdb/extension-repo"
      # Pinned in four places that must move together: this tag, the same tag in
      # Dockerfile.lambda, and setup-uv's `version` in test.yml + create-release.yml.
      - dependency-name: "ghcr.io/astral-sh/uv"
