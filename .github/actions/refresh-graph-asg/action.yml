name: Refresh Graph ASG
description: |
  Performs a rolling instance refresh for graph database EC2 instances using AWS native ASG instance refresh.
  Supports refreshing all tiers in an environment or a specific tier.

inputs:
  environment:
    description: "Environment (staging, prod)"
    required: true
  tier:
    description: "Specific tier to refresh (optional - if not set, refreshes all enabled tiers)"
    required: false
    default: ""
  aws-region:
    description: "AWS region"
    required: false
    default: "us-east-1"
  instance-warmup:
    description: "Seconds to wait for instance warmup before considering healthy"
    required: false
    default: "300"
  max-wait-minutes:
    description: >-
      Maximum minutes to wait for in-flight destructive operations
      (materialization, extensions mat, bulk table creates) to complete
      on ANY instance in the target WRITER ASG before starting the
      refresh. Polls every 60 seconds. NOTE: This action skips the
      shared tier entirely — shared-tier busy protection (which covers
      SEC staging on the shared-master) runs via refresh-graph-containers,
      called per-instance from service-refresh.yml.
    required: false
    default: "30"
  force-ignore-busy:
    description: >-
      If true, skip the busy-counter pre-check and start instance refresh
      immediately even if a destructive operation is in flight. Emergency
      escape hatch — use sparingly, interrupted materializations may
      require a full graph rebuild.
    required: false
    default: "false"

outputs:
  refreshed-asgs:
    description: "Comma-separated list of ASGs that were refreshed"
    value: ${{ steps.refresh.outputs.refreshed_asgs }}
  total-refreshed:
    description: "Total number of ASGs refreshed"
    value: ${{ steps.refresh.outputs.total_refreshed }}
  status:
    description: "Overall status of the refresh operation"
    value: ${{ steps.refresh.outputs.status }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: bash
      run: |
        if [[ ! "${{ inputs.environment }}" =~ ^(staging|prod)$ ]]; then
          echo "::error::Invalid environment: ${{ inputs.environment }}. Must be staging or prod."
          exit 1
        fi

        VALID_TIERS="ladybug-standard|ladybug-large|ladybug-xlarge|ladybug-shared"
        if [[ -n "${{ inputs.tier }}" && ! "${{ inputs.tier }}" =~ ^($VALID_TIERS)$ ]]; then
          echo "::error::Invalid tier: ${{ inputs.tier }}"
          echo "Must be one of: ladybug-standard, ladybug-large, ladybug-xlarge, ladybug-shared"
          exit 1
        fi

    - name: Refresh ASGs
      id: refresh
      shell: bash
      run: |
        set -e

        ENVIRONMENT="${{ inputs.environment }}"
        SPECIFIC_TIER="${{ inputs.tier }}"
        REGION="${{ inputs.aws-region }}"
        MIN_HEALTHY="50"
        WARMUP="${{ inputs.instance-warmup }}"
        MAX_WAIT_ATTEMPTS="${{ inputs.max-wait-minutes }}"
        FORCE_IGNORE_BUSY="${{ inputs.force-ignore-busy }}"
        # Stale detection: counter > 0 but heartbeat older than 6h → crashed.
        # 6h comfortably covers full SEC backfills; anything longer is likely hung.
        STALE_WINDOW_SECONDS=21600

        # Environment suffix for stack names
        if [ "$ENVIRONMENT" == "prod" ]; then
          ENV_SUFFIX="Prod"
        else
          ENV_SUFFIX="Staging"
        fi

        echo "========================================"
        echo "Graph ASG Instance Refresh"
        echo "========================================"
        echo "Environment: $ENVIRONMENT"
        echo "Specific Tier: ${SPECIFIC_TIER:-all}"
        echo ""

        # Define all possible tiers and their stack suffixes
        declare -A TIER_STACKS=(
          ["ladybug-standard"]="LadybugStandard"
          ["ladybug-large"]="LadybugLarge"
          ["ladybug-xlarge"]="LadybugXlarge"
          ["ladybug-shared"]="LadybugShared"
        )

        # Shared tiers have rebuildable data (no database allocation check needed)
        declare -A SHARED_TIERS=(
          ["ladybug-shared"]=1
        )

        REFRESHED_ASGS=""
        TOTAL_REFRESHED=0
        HAS_ERRORS=false

        # Determine which tiers to process
        if [ -n "$SPECIFIC_TIER" ]; then
          TIERS_TO_PROCESS="$SPECIFIC_TIER"
        else
          TIERS_TO_PROCESS="${!TIER_STACKS[@]}"
        fi

        for TIER in $TIERS_TO_PROCESS; do
          # Skip shared replicas - use Dagster shared_repository_refresh_replicas_job
          # which has zero-downtime settings (MinHealthy=100%, MaxHealthy=200%)
          if [ "$TIER" == "ladybug-shared" ]; then
            echo "----------------------------------------"
            echo "Skipping: $TIER (use Dagster job for zero-downtime refresh)"
            continue
          fi

          STACK_SUFFIX="${TIER_STACKS[$TIER]}"
          STACK_NAME="RoboSystemsGraph${STACK_SUFFIX}${ENV_SUFFIX}"

          echo "----------------------------------------"
          echo "Processing: $TIER"
          echo "Stack: $STACK_NAME"

          # Check if stack exists and get ASG name
          ASG_NAME=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='WriterAutoScalingGroupName'].OutputValue" \
            --output text \
            --region "$REGION" 2>/dev/null || echo "")

          if [ -z "$ASG_NAME" ] || [ "$ASG_NAME" == "None" ]; then
            echo "  Stack not found or no ASG output - skipping"
            continue
          fi

          echo "  ASG: $ASG_NAME"

          # Get ASG details
          ASG_INFO=$(aws autoscaling describe-auto-scaling-groups \
            --auto-scaling-group-names "$ASG_NAME" \
            --query "AutoScalingGroups[0].{DesiredCapacity: DesiredCapacity, Instances: Instances[?LifecycleState=='InService'].InstanceId}" \
            --output json \
            --region "$REGION" 2>/dev/null || echo '{}')

          DESIRED=$(echo "$ASG_INFO" | jq -r '.DesiredCapacity // 0')
          INSTANCES=$(echo "$ASG_INFO" | jq -r '.Instances // [] | length')

          echo "  Desired: $DESIRED, InService: $INSTANCES"

          if [ "$INSTANCES" -eq 0 ]; then
            echo "  No instances in service - skipping"
            continue
          fi

          # For non-shared tiers, log allocated databases (informational only)
          IS_SHARED="${SHARED_TIERS[$TIER]:-0}"

          if [ "$IS_SHARED" != "1" ]; then
            INSTANCE_IDS=$(echo "$ASG_INFO" | jq -r '.Instances[]')
            ALLOCATED_COUNT=0

            for INSTANCE_ID in $INSTANCE_IDS; do
              DB_COUNT=$(aws dynamodb get-item \
                --table-name "robosystems-graph-${ENVIRONMENT}-instance-registry" \
                --key "{\"instance_id\":{\"S\":\"${INSTANCE_ID}\"}}" \
                --query "Item.database_count.N" \
                --output text \
                --region "$REGION" 2>/dev/null || echo "0")

              if [ "$DB_COUNT" != "0" ] && [ "$DB_COUNT" != "None" ] && [ -n "$DB_COUNT" ]; then
                ALLOCATED_COUNT=$((ALLOCATED_COUNT + 1))
              fi
            done

            if [ "$ALLOCATED_COUNT" -gt 0 ]; then
              echo "  Note: $ALLOCATED_COUNT instances have allocated databases"
            fi
          else
            echo "  Shared tier (data is rebuildable)"
          fi

          # Check for in-progress refresh
          CURRENT_REFRESH=$(aws autoscaling describe-instance-refreshes \
            --auto-scaling-group-name "$ASG_NAME" \
            --query "InstanceRefreshes[?Status=='InProgress' || Status=='Pending'].InstanceRefreshId" \
            --output text \
            --region "$REGION" 2>/dev/null || echo "")

          if [ -n "$CURRENT_REFRESH" ] && [ "$CURRENT_REFRESH" != "None" ]; then
            echo "  Refresh already in progress: $CURRENT_REFRESH - skipping"
            continue
          fi

          # Wait for in-flight destructive operations on ANY instance in this
          # writer ASG before starting the refresh. Covers user materialization,
          # extensions mat, and bulk table creates. Shared-tier SEC staging
          # protection runs through refresh-graph-containers (per-instance via
          # service-refresh.yml) — the ladybug-shared branch of this loop skips
          # to `continue` above, so this block never executes for shared tiers.
          if [ "$FORCE_IGNORE_BUSY" = "true" ]; then
            echo "  force-ignore-busy=true — skipping destructive-op wait"
          else
            echo "  Checking for in-flight destructive operations..."
            BUSY_INSTANCE_IDS=$(echo "$ASG_INFO" | jq -r '.Instances[]')
            WAIT_ATTEMPT=0
            TOTAL_BUSY=0

            while [ $WAIT_ATTEMPT -lt $MAX_WAIT_ATTEMPTS ]; do
              WAIT_ATTEMPT=$((WAIT_ATTEMPT + 1))
              TOTAL_BUSY=0

              for BUSY_INSTANCE_ID in $BUSY_INSTANCE_IDS; do
                BUSY_ITEM=$(aws dynamodb get-item \
                  --table-name "robosystems-graph-${ENVIRONMENT}-instance-registry" \
                  --key "{\"instance_id\":{\"S\":\"${BUSY_INSTANCE_ID}\"}}" \
                  --query "Item" \
                  --output json \
                  --region "$REGION" 2>/dev/null || echo "null")

                if [ "$BUSY_ITEM" = "null" ] || [ -z "$BUSY_ITEM" ]; then
                  continue
                fi

                BUSY_COUNT=$(echo "$BUSY_ITEM" | jq -r '.active_destructive_ops.N // "0"')
                BUSY_LAST_AT=$(echo "$BUSY_ITEM" | jq -r '.last_destructive_op_at.S // ""')
                BUSY_KIND=$(echo "$BUSY_ITEM" | jq -r '.last_destructive_op_kind.S // "unknown"')

                # Integer comparison — a counter that went negative (from a
                # swallowed increment-failure on the writer side) should be
                # treated as idle, not "still waiting."
                if [ "${BUSY_COUNT:-0}" -le 0 ] 2>/dev/null; then
                  if [ "${BUSY_COUNT:-0}" -lt 0 ] 2>/dev/null; then
                    echo "    ::warning::Negative busy counter on ${BUSY_INSTANCE_ID} (count=${BUSY_COUNT}); treating as idle."
                  fi
                  continue
                fi

                # Stale detection: counter > 0 but no heartbeat for 2h → crashed
                if [ -n "$BUSY_LAST_AT" ]; then
                  BUSY_LAST_EPOCH=$(date -u -d "${BUSY_LAST_AT}" +%s 2>/dev/null || echo 0)
                  BUSY_NOW_EPOCH=$(date -u +%s)
                  BUSY_AGE=$((BUSY_NOW_EPOCH - BUSY_LAST_EPOCH))
                  if [ $BUSY_LAST_EPOCH -gt 0 ] && [ $BUSY_AGE -gt $STALE_WINDOW_SECONDS ]; then
                    echo "    ::warning::Stale busy counter on ${BUSY_INSTANCE_ID}: count=${BUSY_COUNT}, kind=${BUSY_KIND}, last=${BUSY_LAST_AT} (${BUSY_AGE}s ago). Treating as crashed."
                    continue
                  fi
                fi

                echo "    ${BUSY_INSTANCE_ID}: busy (count=${BUSY_COUNT}, kind=${BUSY_KIND}, last=${BUSY_LAST_AT})"
                TOTAL_BUSY=$((TOTAL_BUSY + BUSY_COUNT))
              done

              if [ "${TOTAL_BUSY:-0}" -le 0 ] 2>/dev/null; then
                if [ $WAIT_ATTEMPT -eq 1 ]; then
                  echo "  All instances idle — proceeding with refresh"
                else
                  echo "  All instances idle after ${WAIT_ATTEMPT} attempt(s)"
                fi
                break
              fi

              echo "  Attempt ${WAIT_ATTEMPT}/${MAX_WAIT_ATTEMPTS}: ${TOTAL_BUSY} in-flight op(s). Waiting 60s..."
              sleep 60
            done

            if [ "${TOTAL_BUSY:-0}" -gt 0 ] 2>/dev/null; then
              echo "::error::Timed out after ${MAX_WAIT_ATTEMPTS} minute(s) waiting for ASG $ASG_NAME to become idle. Use force-ignore-busy=true to override."
              HAS_ERRORS=true
              continue
            fi
          fi

          # Disable scale-in protection on all instances (required for refresh to proceed)
          INSTANCE_IDS=$(echo "$ASG_INFO" | jq -r '.Instances[]' 2>/dev/null || echo "")
          if [ -n "$INSTANCE_IDS" ]; then
            echo "  Disabling scale-in protection..."
            for INSTANCE_ID in $INSTANCE_IDS; do
              aws autoscaling set-instance-protection \
                --instance-ids "$INSTANCE_ID" \
                --auto-scaling-group-name "$ASG_NAME" \
                --no-protected-from-scale-in \
                --region "$REGION" 2>/dev/null || true
            done
          fi

          # Start instance refresh
          echo "  Starting instance refresh..."
          echo "    MinHealthyPercentage: $MIN_HEALTHY%"
          echo "    InstanceWarmup: ${WARMUP}s"

          REFRESH_RESULT=$(aws autoscaling start-instance-refresh \
            --auto-scaling-group-name "$ASG_NAME" \
            --preferences "{\"MinHealthyPercentage\": $MIN_HEALTHY, \"InstanceWarmup\": $WARMUP}" \
            --region "$REGION" 2>&1) || {
              echo "  ERROR: Failed to start instance refresh"
              echo "  $REFRESH_RESULT"
              HAS_ERRORS=true
              continue
            }

          REFRESH_ID=$(echo "$REFRESH_RESULT" | jq -r '.InstanceRefreshId // "unknown"')
          echo "  Instance refresh started: $REFRESH_ID"
          REFRESHED_ASGS="${REFRESHED_ASGS}${ASG_NAME},"
          TOTAL_REFRESHED=$((TOTAL_REFRESHED + 1))
        done

        # Remove trailing comma
        REFRESHED_ASGS="${REFRESHED_ASGS%,}"

        echo ""
        echo "========================================"
        echo "Waiting for Refreshes to Complete"
        echo "========================================"

        if [ "$TOTAL_REFRESHED" -eq 0 ]; then
          echo "No ASGs were refreshed"
          echo "refreshed_asgs=" >> $GITHUB_OUTPUT
          echo "total_refreshed=0" >> $GITHUB_OUTPUT
          echo "status=no_asgs_found" >> $GITHUB_OUTPUT
          exit 0
        fi

        # Wait for all refreshes to complete (max 20 minutes)
        MAX_WAIT=1200
        POLL_INTERVAL=30
        ELAPSED=0

        while [ $ELAPSED -lt $MAX_WAIT ]; do
          ALL_COMPLETE=true
          ANY_FAILED=false

          IFS=',' read -ra ASG_ARRAY <<< "$REFRESHED_ASGS"
          for ASG in "${ASG_ARRAY[@]}"; do
            STATUS=$(aws autoscaling describe-instance-refreshes \
              --auto-scaling-group-name "$ASG" \
              --query "InstanceRefreshes[0].{Status:Status,Percent:PercentageComplete}" \
              --output json \
              --region "$REGION" 2>/dev/null || echo '{}')

            REFRESH_STATUS=$(echo "$STATUS" | jq -r '.Status // "Unknown"')
            PERCENT=$(echo "$STATUS" | jq -r '.Percent // 0')

            echo "  $ASG: $REFRESH_STATUS ($PERCENT%)"

            if [ "$REFRESH_STATUS" == "InProgress" ] || [ "$REFRESH_STATUS" == "Pending" ]; then
              ALL_COMPLETE=false
            elif [ "$REFRESH_STATUS" == "Failed" ] || [ "$REFRESH_STATUS" == "Cancelled" ]; then
              ANY_FAILED=true
            fi
          done

          if [ "$ALL_COMPLETE" = true ]; then
            break
          fi

          echo "  Waiting ${POLL_INTERVAL}s... ($ELAPSED/$MAX_WAIT)"
          sleep $POLL_INTERVAL
          ELAPSED=$((ELAPSED + POLL_INTERVAL))
        done

        echo ""
        echo "========================================"
        echo "Summary"
        echo "========================================"
        echo "Total ASGs refreshed: $TOTAL_REFRESHED"

        # Set outputs
        echo "refreshed_asgs=$REFRESHED_ASGS" >> $GITHUB_OUTPUT
        echo "total_refreshed=$TOTAL_REFRESHED" >> $GITHUB_OUTPUT

        if [ "$ANY_FAILED" = true ] || [ "$HAS_ERRORS" = true ]; then
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "One or more refreshes failed"
          exit 1
        elif [ "$ALL_COMPLETE" = false ]; then
          echo "status=timeout" >> $GITHUB_OUTPUT
          echo "Timeout waiting for refreshes to complete"
          exit 1
        else
          echo "status=success" >> $GITHUB_OUTPUT
          echo "All refreshes completed successfully"
        fi
