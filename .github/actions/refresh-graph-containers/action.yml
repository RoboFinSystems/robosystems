name: Refresh Graph Container
description: >-
  Refreshes a single graph API container in-place without replacing the instance,
  by invoking the instance-side refresh script over SSM. All per-instance logic —
  the busy-counter wait, the pull, the digest check, the swap, the health check —
  lives in /usr/local/bin/refresh-graph-container.sh on the instance, not here.
  This action is only the trigger and the result reporter.

inputs:
  environment:
    description: 'Environment (staging, prod)'
    required: true
  instance-id:
    description: 'EC2 Instance ID to update'
    required: true
  node-type:
    description: 'Node type (writer, shared-writer, shared-replica)'
    required: true
  backend:
    description: 'Graph runtime (ladybug)'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  max-wait-minutes:
    description: >-
      Maximum minutes the instance waits for in-flight destructive operations
      (materialization, SEC staging, extensions mat, bulk table creates)
      to complete before cycling the container. Polls every 60 seconds.
    required: false
    default: '30'
  force-ignore-busy:
    description: >-
      If true, skip the busy-counter pre-check and cycle the container
      immediately even if a destructive operation is in flight. Emergency
      escape hatch — use sparingly, interrupted materializations may
      require a full graph rebuild.
    required: false
    default: 'false'

outputs:
  status:
    description: 'Update status (success/failed)'
    value: ${{ steps.refresh.outputs.status }}
  result:
    description: 'Whether the container was restarted (updated) or already current (no-op)'
    value: ${{ steps.refresh.outputs.result }}
  instance-id:
    description: 'Instance ID that was updated'
    value: ${{ inputs.instance-id }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: bash
      run: |
        VALID_RUNTIMES="ladybug"
        if [[ ! "${{ inputs.backend }}" =~ ^($VALID_RUNTIMES)$ ]]; then
          echo "❌ Invalid graph runtime: ${{ inputs.backend }}"
          echo "Must be: ladybug"
          exit 1
        fi

        VALID_NODE_TYPES="writer|shared-writer|shared-replica"
        if [[ ! "${{ inputs.node-type }}" =~ ^($VALID_NODE_TYPES)$ ]]; then
          echo "❌ Invalid node-type: ${{ inputs.node-type }}"
          echo "Must be one of: writer, shared-writer, shared-replica"
          exit 1
        fi

        VALID_ENVIRONMENTS="staging|prod"
        if [[ ! "${{ inputs.environment }}" =~ ^($VALID_ENVIRONMENTS)$ ]]; then
          echo "❌ Invalid environment: ${{ inputs.environment }}"
          echo "Must be one of: staging, prod"
          exit 1
        fi

    - name: Refresh Container on ${{ inputs.instance-id }}
      id: refresh
      shell: bash
      run: |
        set -uo pipefail

        INSTANCE_ID="${{ inputs.instance-id }}"
        REGION="${{ inputs.aws-region }}"
        MAX_WAIT_MINUTES="${{ inputs.max-wait-minutes }}"
        FORCE_IGNORE_BUSY="${{ inputs.force-ignore-busy }}"

        # The instance may spend up to MAX_WAIT_MINUTES waiting for an in-flight
        # destructive op, then needs time to pull, restart, and pass its health
        # check. Both budgets are derived from that ceiling rather than fixed, so
        # raising max-wait-minutes can never silently truncate the refresh.
        BUDGET_SECONDS=$(( MAX_WAIT_MINUTES * 60 + 900 ))

        echo "🔄 Refreshing graph container on ${INSTANCE_ID} (${{ inputs.node-type }})"
        echo "   busy-wait ceiling: ${MAX_WAIT_MINUTES}m, total budget: ${BUDGET_SECONDS}s"

        # Two commands, run as sequential lines of one script. The first is a
        # presence guard with its own exit code, so "the instance has not picked up
        # this script yet" is reported as itself rather than inferred from bash's
        # generic 127 — see the exit-code handling below.
        #
        # executionTimeout is always explicit. The AWS-RunShellScript default is
        # 3600s, which happens to accommodate a 30-minute busy-wait today, but
        # leaving it implicit means a later raise of max-wait-minutes truncates
        # the command mid-refresh.
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${INSTANCE_ID}" \
          --document-name "AWS-RunShellScript" \
          --comment "graph container refresh (${{ inputs.environment }})" \
          --parameters "commands=[\"[ -x /usr/local/bin/refresh-graph-container.sh ] || { echo REFRESH_RESULT=skipped-no-script; exit 4; }\",\"MAX_WAIT_MINUTES=${MAX_WAIT_MINUTES} FORCE_IGNORE_BUSY=${FORCE_IGNORE_BUSY} /usr/local/bin/refresh-graph-container.sh\"],executionTimeout=[\"${BUDGET_SECONDS}\"]" \
          --query "Command.CommandId" \
          --output text \
          --region "${REGION}")

        if [ -z "${COMMAND_ID}" ] || [ "${COMMAND_ID}" == "None" ]; then
          echo "❌ Failed to dispatch SSM command to ${INSTANCE_ID}"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "⏳ Command ${COMMAND_ID} dispatched; polling for completion..."

        # A bounded manual poll, deliberately NOT `aws ssm wait command-executed`.
        # That waiter is delay:5 × maxAttempts:20 = 100 seconds, far shorter than
        # this command can legitimately take; when it expired it reported failure
        # for a refresh that was still running and about to succeed, and the
        # natural response — re-running the deploy — cycled the container twice.
        DEADLINE=$(( $(date +%s) + BUDGET_SECONDS ))
        STATUS="Pending"
        while true; do
          STATUS=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "Status" \
            --output text \
            --region "${REGION}" 2>/dev/null) || STATUS="Pending"

          case "${STATUS}" in
            Success)
              break
              ;;
            Failed|Cancelled|TimedOut|Undeliverable|Terminated)
              break
              ;;
          esac

          if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
            echo "::error::Refresh on ${INSTANCE_ID} exceeded its ${BUDGET_SECONDS}s budget (last status: ${STATUS}). The command may still be running on the instance."
            echo "status=failed" >> $GITHUB_OUTPUT
            exit 1
          fi
          sleep 15
        done

        OUTPUT=$(aws ssm get-command-invocation \
          --command-id "${COMMAND_ID}" \
          --instance-id "${INSTANCE_ID}" \
          --query "StandardOutputContent" \
          --output text \
          --region "${REGION}" 2>/dev/null || echo "")

        if [ "${STATUS}" != "Success" ]; then
          RESPONSE_CODE=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "ResponseCode" \
            --output text \
            --region "${REGION}" 2>/dev/null || echo "-1")

          # Two exit codes mean "this instance has not picked up the new
          # deployment yet," which is a transitional state to be waited out (ASG
          # churn) or backfilled — not a broken refresh — so neither may fail the
          # deploy. Both are reported loudly and distinctly, so a fleet that never
          # cycles cannot hide behind a green run.
          #
          #     4 — refresh-graph-container.sh is not on the instance at all.
          #         Common scripts are downloaded from S3 in userdata, i.e. only at
          #         boot, so uploading a new one does not put it on a running
          #         instance. Every instance predating this change reports 4 until
          #         it cycles. The guard that emits it is an explicit -x test in
          #         the dispatched command, deliberately NOT an inference from
          #         bash's 127: a missing `docker` inside the script would also
          #         exit 127, and that is a real failure, not a stale instance.
          #     3 — the script is present but /etc/environment predates the
          #         complete-environment contract, so it declined to start a
          #         container missing mounts the boot configured.
          if [ "${RESPONSE_CODE}" == "4" ]; then
            echo "::warning::${INSTANCE_ID} skipped: refresh-graph-container.sh is not on this instance yet (it is installed at boot). The container was left running its current image. Cycle the instance to pick it up."
            echo "status=success" >> $GITHUB_OUTPUT
            echo "result=skipped-no-script" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "${RESPONSE_CODE}" == "3" ]; then
            echo "::warning::${INSTANCE_ID} skipped: /etc/environment predates the complete-environment contract. The container was left running its current image. Cycle the instance or backfill /etc/environment."
            echo "${OUTPUT}" | tail -20
            echo "status=success" >> $GITHUB_OUTPUT
            echo "result=skipped-stale-env" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "❌ Refresh failed on ${INSTANCE_ID} (status: ${STATUS}, exit: ${RESPONSE_CODE})"
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${INSTANCE_ID}" \
            --query "StandardErrorContent" \
            --output text \
            --region "${REGION}" 2>/dev/null || echo "No error details available")
          echo "Error details:"
          echo "${ERROR_OUTPUT}"
          echo "Output:"
          echo "${OUTPUT}" | tail -30
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

        # The script reports whether it actually restarted anything. Surfacing it
        # matters: a refresh that no-ops on nearly every instance must be
        # distinguishable from one that pulled nothing and quietly did nothing.
        RESULT=$(echo "${OUTPUT}" | grep -o 'REFRESH_RESULT=[a-z-]*' | tail -1 | cut -d= -f2)
        RESULT="${RESULT:-unknown}"

        echo "📝 Refresh output:"
        echo "${OUTPUT}" | tail -30

        if [ "${RESULT}" == "no-op" ]; then
          echo "✅ ${INSTANCE_ID} already on the current image — no restart"
        else
          echo "✅ ${INSTANCE_ID} refreshed and healthy"
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        echo "result=${RESULT}" >> $GITHUB_OUTPUT
