name: Refresh Graph Container
description: Refreshes a single graph API container in-place without replacing the instance

inputs:
  environment:
    description: 'Environment (staging, prod)'
    required: true
  instance-id:
    description: 'EC2 Instance ID to update'
    required: true
  node-type:
    description: 'Node type (writer, shared-writer, shared-replica)'
    required: true
  backend:
    description: 'Graph runtime (ladybug)'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'us-east-1'
  aws-account-id:
    description: 'AWS account ID for ECR URI'
    required: true
  health-check-timeout:
    description: 'Seconds to wait for health check after update'
    required: false
    default: '30'
  max-wait-minutes:
    description: >-
      Maximum minutes to wait for in-flight destructive operations
      (materialization, SEC staging, extensions mat, bulk table creates)
      to complete before cycling the container. Polls every 60 seconds.
    required: false
    default: '30'
  force-ignore-busy:
    description: >-
      If true, skip the busy-counter pre-check and cycle the container
      immediately even if a destructive operation is in flight. Emergency
      escape hatch — use sparingly, interrupted materializations may
      require a full graph rebuild.
    required: false
    default: 'false'

outputs:
  status:
    description: 'Update status (success/failed)'
    value: ${{ steps.update.outputs.status }}
  instance-id:
    description: 'Instance ID that was updated'
    value: ${{ inputs.instance-id }}

runs:
  using: composite
  steps:
    - name: Validate Inputs
      shell: bash
      run: |
        VALID_RUNTIMES="ladybug"
        if [[ ! "${{ inputs.backend }}" =~ ^($VALID_RUNTIMES)$ ]]; then
          echo "❌ Invalid graph runtime: ${{ inputs.backend }}"
          echo "Must be: ladybug"
          exit 1
        fi

        VALID_NODE_TYPES="writer|shared-writer|shared-replica"
        if [[ ! "${{ inputs.node-type }}" =~ ^($VALID_NODE_TYPES)$ ]]; then
          echo "❌ Invalid node-type: ${{ inputs.node-type }}"
          echo "Must be one of: writer, shared-writer, shared-replica"
          exit 1
        fi

        VALID_ENVIRONMENTS="staging|prod"
        if [[ ! "${{ inputs.environment }}" =~ ^($VALID_ENVIRONMENTS)$ ]]; then
          echo "❌ Invalid environment: ${{ inputs.environment }}"
          echo "Must be one of: staging, prod"
          exit 1
        fi

    - name: Wait for In-Flight Destructive Ops on ${{ inputs.instance-id }}
      id: wait_for_idle
      shell: bash
      run: |
        set -e

        REGISTRY_TABLE="robosystems-graph-${{ inputs.environment }}-instance-registry"
        INSTANCE_ID="${{ inputs.instance-id }}"
        REGION="${{ inputs.aws-region }}"
        MAX_ATTEMPTS=${{ inputs.max-wait-minutes }}
        FORCE_IGNORE="${{ inputs.force-ignore-busy }}"
        # Stale detection: counter > 0 but no heartbeat for 6h → treat as crashed.
        # 6h comfortably covers even full SEC historical backfills (30-120min).
        # If a single op actually runs longer than this, it's almost certainly hung.
        STALE_WINDOW_SECONDS=21600

        if [ "$FORCE_IGNORE" = "true" ]; then
          echo "⚠️  force-ignore-busy=true — bypassing busy-counter check for ${INSTANCE_ID}"
          echo "status=bypassed" >> $GITHUB_OUTPUT
          exit 0
        fi

        echo "🔍 Checking destructive-op counter on ${INSTANCE_ID} (table: ${REGISTRY_TABLE})"

        ATTEMPT=0
        COUNT=0
        while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
          ATTEMPT=$((ATTEMPT + 1))

          ITEM=$(aws dynamodb get-item \
            --table-name "${REGISTRY_TABLE}" \
            --key "{\"instance_id\":{\"S\":\"${INSTANCE_ID}\"}}" \
            --query "Item" \
            --output json \
            --region "${REGION}" 2>/dev/null || echo "null")

          if [ "$ITEM" = "null" ] || [ -z "$ITEM" ]; then
            echo "ℹ️  No registry entry for ${INSTANCE_ID} (not yet registered or unmanaged) — proceeding"
            COUNT=0
            break
          fi

          COUNT=$(echo "$ITEM" | jq -r '.active_destructive_ops.N // "0"')
          LAST_AT=$(echo "$ITEM" | jq -r '.last_destructive_op_at.S // ""')
          KIND=$(echo "$ITEM" | jq -r '.last_destructive_op_kind.S // "unknown"')

          # Integer comparison — a counter that went negative (from a
          # swallowed increment-failure on the writer side) should be
          # treated as idle, not "still waiting."
          if [ "${COUNT:-0}" -le 0 ] 2>/dev/null; then
            if [ "${COUNT:-0}" -lt 0 ] 2>/dev/null; then
              echo "::warning::Negative busy counter on ${INSTANCE_ID} (count=${COUNT}); treating as idle. May indicate a swallowed increment failure."
            fi
            if [ $ATTEMPT -eq 1 ]; then
              echo "✅ Instance ${INSTANCE_ID} is idle — proceeding with refresh"
            else
              echo "✅ Instance ${INSTANCE_ID} became idle after ${ATTEMPT} attempt(s)"
            fi
            COUNT=0
            break
          fi

          # Stale detection: if the counter is stuck but heartbeat is old,
          # assume the writer crashed and proceed anyway (GHA log warning).
          if [ -n "$LAST_AT" ]; then
            LAST_EPOCH=$(date -u -d "${LAST_AT}" +%s 2>/dev/null || echo 0)
            NOW_EPOCH=$(date -u +%s)
            AGE=$((NOW_EPOCH - LAST_EPOCH))
            if [ $LAST_EPOCH -gt 0 ] && [ $AGE -gt $STALE_WINDOW_SECONDS ]; then
              echo "::warning::Stale busy counter on ${INSTANCE_ID}: count=${COUNT}, kind=${KIND}, last_update=${LAST_AT} (${AGE}s ago > ${STALE_WINDOW_SECONDS}s). Treating as crashed and proceeding."
              COUNT=0
              break
            fi
          fi

          echo "⏳ Attempt ${ATTEMPT}/${MAX_ATTEMPTS}: instance ${INSTANCE_ID} busy (count=${COUNT}, kind=${KIND}, last=${LAST_AT}). Waiting 60s..."
          sleep 60
        done

        if [ "${COUNT:-0}" -gt 0 ] 2>/dev/null; then
          echo "::error::Timed out after ${MAX_ATTEMPTS} minute(s) waiting for ${INSTANCE_ID} to become idle (count=${COUNT}, kind=${KIND}). Use force-ignore-busy=true to override."
          echo "status=timeout" >> $GITHUB_OUTPUT
          exit 1
        fi

        echo "status=idle" >> $GITHUB_OUTPUT

    - name: Update Container on ${{ inputs.instance-id }}
      id: update
      shell: bash
      run: |
        echo "🔄 Updating graph container on instance ${{ inputs.instance-id }} - ${{ inputs.node-type }}"

        # Get ECR URI
        ECR_URI="${{ inputs.aws-account-id }}.dkr.ecr.${{ inputs.aws-region }}.amazonaws.com/robosystems"

        # Container name represents the service role, not the storage engine
        if [ "${{ inputs.node-type }}" == "shared-writer" ] || [ "${{ inputs.node-type }}" == "shared-replica" ]; then
          CONTAINER_NAME="graph-api-shared"
        else
          CONTAINER_NAME="graph-api"
        fi

        # Graph API health endpoint
        HEALTH_PORT="8001"

        # Use universal startup script
        STARTUP_SCRIPT="/usr/local/bin/run-graph-container.sh"

        echo "📦 Pulling and updating container: $CONTAINER_NAME (runtime: ${{ inputs.backend }}, health port: $HEALTH_PORT)"

        # Send update command
        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "${{ inputs.instance-id }}" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[
            \"#!/bin/bash\",
            \"set -e\",
            \"echo \\\"🔄 Starting container refresh for $CONTAINER_NAME\\\"\",
            \"echo \\\"Loading environment variables...\\\"\",
            \"if [ -f /etc/environment ]; then set -a; source /etc/environment; set +a; fi\",
            \"echo \\\"Pulling latest image...\\\"\",
            \"aws ecr get-login-password --region ${{ inputs.aws-region }} | docker login --username AWS --password-stdin ${ECR_URI%/*}\",
            \"docker pull ${ECR_URI}:${{ inputs.environment }}\",
            \"export ECR_IMAGE=\\\"${ECR_URI}:${{ inputs.environment }}\\\"\",
            \"echo \\\"Stopping existing container...\\\"\",
            \"docker stop $CONTAINER_NAME || true\",
            \"docker rm $CONTAINER_NAME || true\",
            \"echo \\\"Starting new container...\\\"\",
            \"$STARTUP_SCRIPT\",
            \"echo \\\"✅ Container updated successfully\\\"\"
          ]" \
          --query "Command.CommandId" \
          --output text \
          --region "${{ inputs.aws-region }}")

        echo "⏳ Waiting for update to complete (Command: ${COMMAND_ID})..."

        # Wait for command execution
        if aws ssm wait command-executed \
          --command-id "${COMMAND_ID}" \
          --instance-id "${{ inputs.instance-id }}" \
          --region "${{ inputs.aws-region }}"; then

          echo "✅ Container update completed successfully"

          # Get the output for logging
          OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ inputs.instance-id }}" \
            --query "StandardOutputContent" \
            --output text \
            --region "${{ inputs.aws-region }}" 2>/dev/null || echo "")

          if [ -n "$OUTPUT" ]; then
            echo "📝 Update output:"
            echo "$OUTPUT" | head -20
          fi

        else
          echo "❌ Container update failed"

          # Get error details
          ERROR_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${COMMAND_ID}" \
            --instance-id "${{ inputs.instance-id }}" \
            --query "StandardErrorContent" \
            --output text \
            --region "${{ inputs.aws-region }}" 2>/dev/null || echo "No error details available")

          echo "Error details:"
          echo "$ERROR_OUTPUT"

          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        fi

        # Health check
        echo "🏥 Waiting ${{ inputs.health-check-timeout }} seconds for container to stabilize..."
        sleep ${{ inputs.health-check-timeout }}

        echo "🏥 Performing health check..."
        HEALTH_COMMAND=$(aws ssm send-command \
          --instance-ids "${{ inputs.instance-id }}" \
          --document-name "AWS-RunShellScript" \
          --parameters "commands=[\"curl -f -s http://localhost:${HEALTH_PORT}/health || echo UNHEALTHY\"]" \
          --query "Command.CommandId" \
          --output text \
          --region "${{ inputs.aws-region }}")

        sleep 5

        HEALTH_STATUS=$(aws ssm get-command-invocation \
          --command-id "${HEALTH_COMMAND}" \
          --instance-id "${{ inputs.instance-id }}" \
          --query "StandardOutputContent" \
          --output text \
          --region "${{ inputs.aws-region }}" 2>/dev/null || echo "UNHEALTHY")

        if [[ "$HEALTH_STATUS" == *"UNHEALTHY"* ]]; then
          echo "❌ Health check failed for instance ${{ inputs.instance-id }}"
          echo "status=failed" >> $GITHUB_OUTPUT
          exit 1
        else
          echo "✅ Instance ${{ inputs.instance-id }} is healthy"
          echo "Health response: ${HEALTH_STATUS:0:100}..."
          echo "status=success" >> $GITHUB_OUTPUT
        fi

    - name: Cleanup Old Docker Images
      if: success()
      shell: bash
      run: |
        echo "🧹 Cleaning up old Docker images on ${{ inputs.instance-id }}..."

        CLEANUP_COMMAND=$(aws ssm send-command \
          --instance-ids "${{ inputs.instance-id }}" \
          --document-name "AWS-RunShellScript" \
          --parameters 'commands=["docker image prune -af --filter \"until=1h\""]' \
          --query "Command.CommandId" \
          --output text \
          --region "${{ inputs.aws-region }}")

        # Wait briefly for cleanup (non-blocking - don't fail deployment if cleanup has issues)
        sleep 10

        CLEANUP_STATUS=$(aws ssm get-command-invocation \
          --command-id "${CLEANUP_COMMAND}" \
          --instance-id "${{ inputs.instance-id }}" \
          --query "Status" \
          --output text \
          --region "${{ inputs.aws-region }}" 2>/dev/null || echo "Unknown")

        if [ "$CLEANUP_STATUS" == "Success" ]; then
          CLEANUP_OUTPUT=$(aws ssm get-command-invocation \
            --command-id "${CLEANUP_COMMAND}" \
            --instance-id "${{ inputs.instance-id }}" \
            --query "StandardOutputContent" \
            --output text \
            --region "${{ inputs.aws-region }}" 2>/dev/null || echo "")
          echo "✅ Docker cleanup completed"
          echo "$CLEANUP_OUTPUT" | tail -5
        else
          echo "⚠️ Docker cleanup status: $CLEANUP_STATUS (non-fatal)"
        fi
