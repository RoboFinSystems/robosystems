Description: RoboSystems Postgres Service - RDS PostgreSQL with optional RDS Proxy

Parameters:
  # Environment
  Environment:
    Type: String
    Description: Environment name (e.g., prod, staging)
    Default: prod
    AllowedValues:
      - prod
      - staging
    ConstraintDescription: Must be prod or staging

  # Infrastructure & Networking Configuration
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID
  SubnetId1:
    Type: AWS::EC2::Subnet::Id
    Description: First subnet ID for RDS multi-AZ deployment
  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: Second subnet ID for RDS multi-AZ deployment

  # FORK NOTE: Pin version via DATABASE_POSTGRES_VERSION_<ENV> GitHub variable
  PostgresEngineVersion:
    Type: String
    Description: >-
      PostgreSQL major version floor. RDS provisions the preferred minor for
      this major and AutoMinorVersionUpgrade keeps it current. Bump to the next
      major (e.g. "17") only for a deliberate, staging-first major upgrade.
    Default: "16"
    AllowedValues:
      - "16"
      - "17"
    ConstraintDescription: Must be a supported PostgreSQL major version

  # Instance & Database Configuration
  DBInstanceClass:
    Type: String
    Description: Database instance type
    Default: db.t4g.micro
    AllowedValues:
      - db.t4g.micro
      - db.t4g.small
      - db.t4g.medium
      - db.r7g.large
      - db.r7g.xlarge
      - db.r7g.2xlarge
    ConstraintDescription: Must be a valid database instance class
  DBAllocatedStorage:
    Type: Number
    Description: Initial storage size in GB
    Default: 20
    MinValue: 20
    MaxValue: 1000
    ConstraintDescription: Must be between 20 and 1000 GB
  DBMaxAllocatedStorage:
    Type: Number
    Description: Maximum storage size in GB
    Default: 100
    MinValue: 20
    MaxValue: 16384
    ConstraintDescription: Must be between 20 and 16384 GB
  DBInstanceName:
    Type: String
    Description: RDS instance identifier
    Default: robosystems
    AllowedPattern: ^[a-z][a-z0-9-]*$
    ConstraintDescription: Must begin with a letter and contain only lowercase
      letters, numbers, and hyphens
  DBName:
    Type: String
    Description: Initial database name
    Default: robosystems
    AllowedPattern: ^[a-z][a-z0-9_]*$
    ConstraintDescription: Must begin with a letter and contain only lowercase
      letters, numbers, and underscores

  # Security & Access Configuration
  DBUsername:
    Type: String
    Description: Master database username
    MinLength: 1
    MaxLength: 63
    Default: postgres
    AllowedPattern: ^[a-z][a-z0-9_]*$
    ConstraintDescription: Must begin with a letter and contain only lowercase
      letters, numbers, and underscores

  # Lambda Configuration
  LambdaImageUri:
    Type: String
    Description: ECR image URI for Lambda functions (container-based deployment)

  # High Availability Configuration
  EnableMultiAZ:
    Type: String
    Description: Enable Multi-AZ deployment for high availability (increases cost ~2x)
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be true or false

  # Accidental-deletion protection (independent of Multi-AZ; no additional cost)
  EnableDeletionProtection:
    Type: String
    Description: Block accidental deletion of the RDS instance (recommended for prod/staging)
    Default: "true"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be true or false

  # RDS Proxy Configuration (off by default - billed at ~$0.015/vCPU/hour when enabled)
  # Requires DBPasswordSecret to contain "username" and "password" keys, which the
  # rotation lambda adds on first rotation after this template is deployed. A freshly
  # deployed stack with no prior rotation will have only the legacy POSTGRES_USER /
  # POSTGRES_PASSWORD keys; trigger a manual rotation before setting EnableRDSProxy=true,
  # or wait for the next scheduled rotation.
  EnableRDSProxy:
    Type: String
    Description: Enable RDS Proxy for connection pooling (off by default - see template
      comment for enablement prerequisites)
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be true or false
  RDSProxyMaxConnectionsPercent:
    Type: Number
    Description: Maximum percentage of DB max_connections the proxy can use (ignored
      when EnableRDSProxy=false)
    Default: 100
    MinValue: 1
    MaxValue: 100
    ConstraintDescription: Must be between 1 and 100
  RDSProxyConnectionBorrowTimeout:
    Type: Number
    Description: Seconds a client waits for a pooled connection before the proxy
      returns an error. AWS default is 120 (retained here); consider lowering to
      30 for web workloads to surface overload faster (ignored when EnableRDSProxy=false)
    Default: 120
    MinValue: 1
    MaxValue: 3600
    ConstraintDescription: Must be between 1 and 3600 seconds

  # Monitoring & Observability Configuration
  SNSAlertEmail:
    Type: String
    Description: Email for SNS alerts
    ConstraintDescription: Must be a valid email address

  # Performance Insights / CloudWatch Database Insights (Standard mode).
  # Free at the default 7-day retention; longer retention is billed per vCPU/month.
  # RDS for PostgreSQL has no instance-class restriction, so this is safe on t4g.micro.
  EnablePerformanceInsights:
    Type: String
    Description: Enable RDS Performance Insights / Database Insights Standard mode
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    ConstraintDescription: Must be true or false
  PerformanceInsightsRetentionPeriod:
    Type: Number
    Description: Performance Insights retention in days (7 = free tier; 31/62/93/186/372
      are month*31; 731 = 24 months). Ignored when EnablePerformanceInsights=false.
    Default: 7
    AllowedValues:
      - 7
      - 31
      - 62
      - 93
      - 186
      - 372
      - 731
    ConstraintDescription: Must be 7 or a valid Performance Insights retention value

  # Tagging Configuration
  ServiceTag:
    Type: String
    Description: Service tag for resource identification and billing
    Default: RoboSystems

  ComponentTag:
    Type: String
    Description: Component tag for resource identification and billing
    Default: Postgres

Conditions:
  EnableMultiAZCondition: !Equals [!Ref EnableMultiAZ, "true"]
  DeletionProtectionCondition: !Equals [!Ref EnableDeletionProtection, "true"]
  RDSProxyEnabledCondition: !Equals [!Ref EnableRDSProxy, "true"]
  PerformanceInsightsEnabledCondition: !Equals [!Ref EnablePerformanceInsights, "true"]

Resources:
  # Common IAM policy for EC2 instances
  CommonEC2Policy:
    Type: AWS::IAM::ManagedPolicy
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Description: Common policy for EC2 instances
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - ec2:DescribeTags
            Resource: "*"
          - Effect: Allow
            Action:
              - cloudwatch:PutMetricData
              - logs:PutLogEvents
              - logs:DescribeLogStreams
              - logs:DescribeLogGroups
              - logs:CreateLogStream
              - logs:CreateLogGroup
              - logs:PutRetentionPolicy
            Resource: "*"

  # Secret for database password generation with automatic rotation
  DBPasswordSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub robosystems/${Environment}/postgres
      Description: Database password for RoboSystems with automatic rotation
      GenerateSecretString:
        SecretStringTemplate: '{"POSTGRES_USER": "postgres"}'
        GenerateStringKey: POSTGRES_PASSWORD
        PasswordLength: 32
        ExcludePunctuation: true
      Tags:
        - Key: Name
          Value: robosystems-postgres-secret
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Secret Rotation Lambda Function
  PostgresSecretRotationLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-postgres-rotation
      Description: "Rotates PostgreSQL database passwords - container-based deployment"
      PackageType: Image
      Architectures:
        - arm64
      Role: !GetAtt PostgresSecretRotationRole.Arn
      Timeout: 300
      VpcConfig:
        SecurityGroupIds:
          - !Ref RDSSecurityGroup
        SubnetIds:
          - !Ref SubnetId1
          - !Ref SubnetId2
      Environment:
        Variables:
          SECRETS_MANAGER_ENDPOINT: !Sub https://secretsmanager.${AWS::Region}.amazonaws.com
          ENVIRONMENT: !Ref Environment
      Code:
        ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command:
          - postgres_rotation.lambda_handler
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-rotation-lambda
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Lambda Execution Role for Secret Rotation
  PostgresSecretRotationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SecretsManagerRotationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref DBPasswordSecret
              - Effect: Allow
                Action:
                  - secretsmanager:GetRandomPassword
                Resource: "*"
              # KMS permissions for secret rotation
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              - Effect: Allow
                Action:
                  - rds:DescribeDBInstances
                Resource: "*"
              # ECR permissions for container-based Lambda
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/robosystems"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-rotation-role
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Lambda Permission for Secrets Manager
  PostgresSecretRotationPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PostgresSecretRotationLambda.Arn
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com

  # Rotation Schedule - links Lambda to secret and enables on-demand rotation
  # Actual rotation timing is managed via GitHub Actions (secrets-rotation.yml)
  # The AutomaticallyAfterDays is set to max (1000 days) as a fallback only
  PostgresSecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DependsOn:
      - PostgresSecretRotationPermission
    Properties:
      SecretId: !Ref DBPasswordSecret
      RotationLambdaARN: !GetAtt PostgresSecretRotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: 1000 # Fallback only - GHA triggers monthly
      RotateImmediatelyOnUpdate: false

  # CloudWatch Alarms for Rotation Monitoring
  PostgresRotationFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-postgres-${Environment}-rotation-failure
      AlarmDescription: Alert when PostgreSQL password rotation fails
      MetricName: Errors
      Namespace: AWS/Lambda
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      Dimensions:
        - Name: FunctionName
          Value: !Ref PostgresSecretRotationLambda
      AlarmActions:
        - !Ref PostgresAlertTopic
      TreatMissingData: notBreaching
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-rotation-failure-alarm
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Composite alarm for overall PostgreSQL health including rotation.
  # Logical ID retains the historical "-RDS" suffix to avoid triggering a CFN
  # rename, which would collide on the shared AlarmName and fail the stack
  # update. Previously gated on a now-removed IsRDS condition.
  PostgresHealthCompositeAlarmRDS:
    Type: AWS::CloudWatch::CompositeAlarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-postgres-${Environment}-health-composite
      AlarmDescription: Overall PostgreSQL health including rotation status
      AlarmRule: !Sub 'ALARM("${PostgresRotationFailureAlarm}") OR ALARM("${RDSStorageLowAlarm}")'
      ActionsEnabled: true
      AlarmActions:
        - !Ref PostgresAlertTopic
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-health-composite
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Database parameter group with SSL enforcement
  RDSDBParameterGroup:
    Type: AWS::RDS::DBParameterGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub Parameter group for ${DBInstanceName}-${Environment} database
      Family: postgres16
      Parameters:
        rds.force_ssl: "1"
        # pgaudit session auditing (DDL + role/privilege changes). The library
        # list keeps RDS's default pg_stat_statements. shared_preload_libraries
        # is static: it sits in pending-reboot until the instance is rebooted.
        shared_preload_libraries: "pg_stat_statements,pgaudit"
        pgaudit.log: "ddl,role"
      Tags:
        - Key: Name
          Value: !Sub ${DBInstanceName}-${Environment}-paramgroup
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Database subnet group for multi-AZ deployment
  RDSDBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      DBSubnetGroupDescription: !Sub Subnet group for ${DBInstanceName}-${Environment} database
      SubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2
      Tags:
        - Key: Name
          Value: !Sub ${DBInstanceName}-${Environment}-subnetgroup
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Security group for PostgreSQL database access
  RDSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      GroupDescription: !Sub Security group for ${DBInstanceName}-${Environment} database
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 10.0.0.0/16 # Restrict to VPC CIDR only
      Tags:
        - Key: Name
          Value: !Sub sg-postgres-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # PostgreSQL RDS instance
  RDSDBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      DBName: !Ref DBName
      Engine: postgres
      EngineVersion: !Ref PostgresEngineVersion
      DBInstanceClass: !Ref DBInstanceClass
      AllocatedStorage: !Ref DBAllocatedStorage
      MaxAllocatedStorage: !Ref DBMaxAllocatedStorage
      StorageType: gp3
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Sub "{{resolve:secretsmanager:${DBPasswordSecret}:SecretString:POSTGRES_PASSWORD}}"
      DBSubnetGroupName: !Ref RDSDBSubnetGroup
      VPCSecurityGroups:
        - !GetAtt RDSSecurityGroup.GroupId
      PubliclyAccessible: false
      MultiAZ: !If [EnableMultiAZCondition, true, false]
      DeletionProtection: !If [DeletionProtectionCondition, true, false]
      EnablePerformanceInsights: !If [PerformanceInsightsEnabledCondition, true, false]
      PerformanceInsightsRetentionPeriod:
        !If [PerformanceInsightsEnabledCondition, !Ref PerformanceInsightsRetentionPeriod, !Ref "AWS::NoValue"]
      BackupRetentionPeriod: 30
      PreferredBackupWindow: 03:00-04:00
      PreferredMaintenanceWindow: sun:04:30-sun:05:30
      # Auto-apply RDS-vetted minor version upgrades during the maintenance
      # window. The PostgresEngineVersion pin acts as a provisioning floor;
      # AWS keeps the running minor current (security/bug fixes) without a
      # per-minor template/GHA-var bump. Major upgrades stay deliberate
      # (AllowMajorVersionUpgrade below + an explicit version change).
      AutoMinorVersionUpgrade: true
      AllowMajorVersionUpgrade: true
      StorageEncrypted: true
      CopyTagsToSnapshot: true
      DBInstanceIdentifier: !Sub ${DBInstanceName}-${Environment}
      DBParameterGroupName: !Ref RDSDBParameterGroup
      Tags:
        - Key: Name
          Value: !Sub ${DBInstanceName}-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # RDS Proxy IAM role (only when EnableRDSProxy=true)
  RDSProxyRole:
    Type: AWS::IAM::Role
    Condition: RDSProxyEnabledCondition
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: rds.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: GetDatabaseSecret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource: !Ref DBPasswordSecret
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-rds-proxy-role
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # RDS Proxy (only when EnableRDSProxy=true)
  # Billed at ~$0.015 per vCPU of target DB per hour while enabled.
  RDSProxy:
    Type: AWS::RDS::DBProxy
    Condition: RDSProxyEnabledCondition
    Properties:
      DBProxyName: !Sub ${DBInstanceName}-${Environment}-proxy
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt RDSProxyRole.Arn
      Auth:
        # IAMAuth: DISABLED is intentional. Flipping to REQUIRED would force app-side
        # IAM token generation (short-lived tokens via rds-db:connect), which this app
        # does not implement — the app reads POSTGRES_PASSWORD from Secrets Manager
        # and builds a standard postgres:// URL. The trade-off: DISABLED accepts any
        # VPC-reachable client with the correct password; REQUIRED would require a
        # valid IAM identity *plus* the password. Revisit if threat model demands
        # defense-in-depth against leaked DB credentials alone.
        - AuthScheme: SECRETS
          SecretArn: !Ref DBPasswordSecret
          IAMAuth: DISABLED
          Description: "Password auth via Secrets Manager"
      VpcSubnetIds:
        - !Ref SubnetId1
        - !Ref SubnetId2
      VpcSecurityGroupIds:
        - !GetAtt RDSSecurityGroup.GroupId
      RequireTLS: true
      IdleClientTimeout: 1800
      DebugLogging: false
      Tags:
        - Key: Name
          Value: !Sub ${DBInstanceName}-${Environment}-proxy
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # RDS Proxy target group (only when EnableRDSProxy=true)
  # AWS currently only supports the "default" target group name.
  RDSProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Condition: RDSProxyEnabledCondition
    Properties:
      DBProxyName: !Ref RDSProxy
      TargetGroupName: default
      DBInstanceIdentifiers:
        - !Ref RDSDBInstance
      ConnectionPoolConfigurationInfo:
        MaxConnectionsPercent: !Ref RDSProxyMaxConnectionsPercent
        MaxIdleConnectionsPercent: 50
        ConnectionBorrowTimeout: !Ref RDSProxyConnectionBorrowTimeout

  # SNS topic for PostgreSQL monitoring alerts
  PostgresAlertTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TopicName: !Sub "robosystems-postgres-${Environment}-alerts"
      DisplayName: !Sub "RoboSystems PostgreSQL ${Environment} Alerts"
      Subscription:
        - Endpoint: !Ref SNSAlertEmail
          Protocol: email
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-alerts
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # CloudWatch alarms for instance health (CPU, memory, disk queue)
  RDSCpuHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub robosystems-postgres-${Environment}-cpu-high
      Namespace: AWS/RDS
      MetricName: CPUUtilization
      Dimensions:
        - Value: !Sub ${DBInstanceName}-${Environment}
          Name: DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PostgresAlertTopic

  RDSFreeableMemoryLowAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub robosystems-postgres-${Environment}-memory-low
      Namespace: AWS/RDS
      MetricName: FreeableMemory
      Dimensions:
        - Value: !Sub ${DBInstanceName}-${Environment}
          Name: DBInstanceIdentifier
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 268435456
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref PostgresAlertTopic

  RDSDiskQueueHighAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub robosystems-postgres-${Environment}-disk-queue-high
      Namespace: AWS/RDS
      MetricName: DiskQueueDepth
      Dimensions:
        - Value: !Sub ${DBInstanceName}-${Environment}
          Name: DBInstanceIdentifier
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 8
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref PostgresAlertTopic

  # CloudWatch alarm for low storage space
  RDSStorageLowAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      ActionsEnabled: true
      AlarmName: !Sub robosystems-postgres-${Environment}-storage-low
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Value: !Sub ${DBInstanceName}-${Environment}
          Name: DBInstanceIdentifier
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 5
      DatapointsToAlarm: 3
      Threshold: 1000000000
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions:
        - !Ref PostgresAlertTopic
      Tags:
        - Key: Name
          Value: !Sub ${AWS::StackName}-postgres-free-storage-space-alarm
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

Outputs:
  DatabaseEndpoint:
    Description: Endpoint of the PostgreSQL database
    Value: !GetAtt RDSDBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabaseEndpoint

  # Legacy output for backwards compatibility
  RDSInstanceEndpoint:
    Description: Endpoint of the PostgreSQL database (legacy name for compatibility)
    Value: !GetAtt RDSDBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSEndpoint

  PostgresSecretArn:
    Description: ARN pattern for the PostgreSQL Secret in Secrets Manager
    Value: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/postgres
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-PostgresSecretArnPattern

  DatabasePort:
    Description: Port of the PostgreSQL database
    Value: !GetAtt RDSDBInstance.Endpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabasePort

  # Legacy output for backwards compatibility
  RDSPort:
    Description: Port of the PostgreSQL database (legacy name for compatibility)
    Value: !GetAtt RDSDBInstance.Endpoint.Port
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSPort

  DatabaseIdentifier:
    Description: Identifier of the PostgreSQL database
    Value: !Ref RDSDBInstance
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabaseIdentifier

  # Legacy output for backwards compatibility
  RDSIdentifier:
    Description: Identifier of the PostgreSQL database (legacy name for compatibility)
    Value: !Ref RDSDBInstance
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSIdentifier

  # Retained as literal for backwards compatibility with any downstream consumer
  # that conditions on engine type. Aurora support was removed in favor of RDS + RIs.
  DatabaseEngine:
    Description: Database engine type
    Value: postgres
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabaseEngine

  RDSSecurityGroupId:
    Description: ID of the RDS security group
    Value: !Ref RDSSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSSecurityGroupId

  RDSDatabaseName:
    Description: Name of the PostgreSQL database
    Value: !Ref DBName
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSDatabaseName

  RDSUsername:
    Description: Master username for the PostgreSQL database
    Value: !Ref DBUsername
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSUsername

  RDSAllocatedStorage:
    Description: Allocated storage for the PostgreSQL database in GB
    Value: !Ref DBAllocatedStorage
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSAllocatedStorage

  RDSPasswordSecretArn:
    Description: ARN of the PostgreSQL password secret
    Value: !Ref DBPasswordSecret
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSPasswordSecretArn

  PostgresRotationLambdaArn:
    Description: ARN of the PostgreSQL password rotation Lambda function
    Value: !GetAtt PostgresSecretRotationLambda.Arn
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-PostgresRotationLambdaArn

  # NOTE: Rotation schedule/days outputs removed - rotation is managed via GitHub Actions
  # with a 1000-day automatic fallback in the RotationSchedule resource

  MultiAZEnabled:
    Description: Whether Multi-AZ deployment is enabled for high availability
    Value: !If [EnableMultiAZCondition, "true", "false"]
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-MultiAZEnabled

  DeletionProtectionEnabled:
    Description: Whether accidental-deletion protection is enabled on the RDS instance
    Value: !If [DeletionProtectionCondition, "true", "false"]
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DeletionProtectionEnabled

  PerformanceInsightsEnabled:
    Description: Whether Performance Insights / Database Insights Standard mode is enabled
    Value: !If [PerformanceInsightsEnabledCondition, "true", "false"]
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-PerformanceInsightsEnabled

  PostgresEngineVersionConfigured:
    Description: PostgreSQL engine version configured for this deployment
    Value: !Ref PostgresEngineVersion
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-PostgresEngineVersion

  PostgresParameterGroupFamilyConfigured:
    Description: PostgreSQL parameter group family configured for this deployment
    Value: postgres16
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-PostgresParameterGroupFamily

  # RDS Proxy outputs (only present when EnableRDSProxy=true)
  DatabaseProxyEndpoint:
    Condition: RDSProxyEnabledCondition
    Description: Read/write endpoint of the RDS Proxy
    Value: !GetAtt RDSProxy.Endpoint
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabaseProxyEndpoint

  DatabaseProxyArn:
    Condition: RDSProxyEnabledCondition
    Description: ARN of the RDS Proxy
    Value: !GetAtt RDSProxy.DBProxyArn
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-DatabaseProxyArn

  RDSProxyEnabled:
    Description: Whether RDS Proxy is enabled for this deployment
    Value: !Ref EnableRDSProxy
    Export:
      Name: !Sub ${AWS::StackName}-${Environment}-RDSProxyEnabled
