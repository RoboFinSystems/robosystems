Description: RoboSystems Background Task Worker - ECS Fargate

Parameters:
  # Environment
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Environment name (prod or staging)
    ConstraintDescription: Must be prod or staging

  # Infrastructure & Networking
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for ECS tasks (comma-separated)

  # Dagster Stack References (cross-stack)
  DagsterClusterArn:
    Type: String
    Description: ARN of the Dagster ECS cluster (from dagster stack output)
  DagsterSecurityGroupId:
    Type: String
    Description: Security group ID from Dagster stack (VPC-internal access)
    AllowedPattern: ^sg-[0-9a-f]+$

  # Container & Application Configuration
  ECRRepositoryUrl:
    Type: String
    Description: Full ECR repository URL (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/robosystems)
  ECRImageTag:
    Type: String
    Description: Docker image tag
    Default: latest

  # Fargate Configuration
  WorkerCpu:
    Type: String
    Default: "512"
    Description: CPU units for worker (512 = 0.5 vCPU)
    AllowedValues: ["512", "1024", "2048"]
  WorkerMemory:
    Type: String
    Default: "1024"
    Description: Memory in MiB for worker
    AllowedValues: ["1024", "2048", "4096"]
  WorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 5
    Description: Number of worker tasks (0 to pause, 1 for singleton, 2+ for parallel processing)

  # Database Configuration (from Postgres stack outputs)
  DatabaseEndpoint:
    Type: String
    Description: PostgreSQL database endpoint hostname
  DatabasePort:
    Type: String
    Description: PostgreSQL database port
    Default: "5432"
  DatabaseSecurityGroupId:
    Type: String
    Description: Security group ID for PostgreSQL access
    AllowedPattern: ^sg-[0-9a-f]+$

  # Cache Configuration
  ValkeyUrl:
    Type: String
    Description: Valkey ElastiCache endpoint URL
    AllowedPattern: ^rediss?://.*:[0-9]+$
  ValkeyClientSecurityGroupId:
    Type: String
    Description: Security group ID for applications connecting to Valkey
    AllowedPattern: ^sg-[0-9a-f]+$

  # OpenSearch (optional)
  OpenSearchEndpoint:
    Type: String
    Description: OpenSearch domain endpoint URL (empty if not deployed)
    Default: ""
  OpenSearchClientSecurityGroupId:
    Type: String
    Description: Security group ID for applications connecting to OpenSearch (empty if not deployed)
    Default: ""

  # S3 Bucket Configuration (from S3 stack outputs)
  SharedRawBucketArn:
    Type: String
    Description: ARN of shared raw data bucket (from S3 stack output)
  SharedProcessedBucketArn:
    Type: String
    Description: ARN of shared processed data bucket (from S3 stack output)
  UserDataBucketArn:
    Type: String
    Description: ARN of user data bucket (from S3 stack output)
  DeploymentBucketArn:
    Type: String
    Description: ARN of deployment bucket (from S3 stack output)
  LogsBucketArn:
    Type: String
    Description: ARN of logs bucket (from S3 stack output)

  # Monitoring
  LogRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: CloudWatch log retention in days

  # Tagging Configuration
  ServiceTag:
    Type: String
    Default: RoboSystems
    Description: Service tag for resource identification and billing
  ComponentTag:
    Type: String
    Default: Worker
    Description: Component tag for resource identification and billing

Conditions:
  HasOpenSearch: !Not [!Equals [!Ref OpenSearchEndpoint, ""]]

Resources:
  # ========================================
  # LOG GROUP
  # ========================================
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /robosystems/${Environment}/worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ========================================
  # IAM ROLES
  # ========================================
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub robosystems-worker-task-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/*"
              # ListSecrets doesn't support resource-level permissions (AWS API constraint)
              - Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: "*"
              # SSM Parameter Store (feature flags, tuning)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/features"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/features/*"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/tuning"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/tuning/*"
              # KMS for secrets
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              # S3 for data access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Ref SharedRawBucketArn
                  - !Sub "${SharedRawBucketArn}/*"
                  - !Ref SharedProcessedBucketArn
                  - !Sub "${SharedProcessedBucketArn}/*"
                  - !Ref UserDataBucketArn
                  - !Sub "${UserDataBucketArn}/*"
                  - !Ref DeploymentBucketArn
                  - !Sub "${DeploymentBucketArn}/*"
                  - !Ref LogsBucketArn
                  - !Sub "${LogsBucketArn}/*"
              # AWS Bedrock for Claude AI (agent tasks)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/global.anthropic.claude-*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - bedrock:GetFoundationModel
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              # DynamoDB for graph registries
              - Effect: Allow
                Action:
                  - dynamodb:Scan
                  - dynamodb:Query
                  - dynamodb:GetItem
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/robosystems-graph-${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/robosystems-graph-${Environment}-*/index/*"
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/robosystems/${Environment}/worker:*"
              # CloudWatch Metrics
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    "cloudwatch:namespace": !Sub "RoboSystems/Worker/${Environment}"
              # OpenSearch (conditional)
              - !If
                - HasOpenSearch
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpHead
                    - es:ESHttpPost
                    - es:ESHttpPut
                  Resource:
                    - !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/robosystems-${Environment}/*"
                - !Ref "AWS::NoValue"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub robosystems-worker-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ExecutionRoleSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ========================================
  # TASK DEFINITION
  # ========================================
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub robosystems-worker-${Environment}
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation
      ContainerDefinitions:
        - Name: worker
          Image: !Sub ${ECRRepositoryUrl}:${ECRImageTag}
          Essential: true
          Command: ["/app/bin/entrypoint.sh"]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: DOCKER_PROFILE
              Value: worker
            - Name: DATABASE_ENDPOINT
              Value: !Ref DatabaseEndpoint
            - Name: DATABASE_PORT
              Value: !Ref DatabasePort
            - Name: VALKEY_URL
              Value: !Ref ValkeyUrl
            - !If
              - HasOpenSearch
              - Name: OPENSEARCH_URL
                Value: !Ref OpenSearchEndpoint
              - !Ref "AWS::NoValue"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # Worker → API access (via service discovery within VPC)
            - Name: WORKER_API_BASE_URL
              Value: !Sub "http://api.${Environment}.robosystems.local:8000"
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/postgres:POSTGRES_PASSWORD::"

  # ========================================
  # ECS SERVICE
  # ========================================
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub robosystems-worker-${Environment}
      Cluster: !Ref DagsterClusterArn
      DesiredCount: !Ref WorkerDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref DagsterSecurityGroupId
            - !Ref ValkeyClientSecurityGroupId
            - !Ref DatabaseSecurityGroupId
            - !If [HasOpenSearch, !Ref OpenSearchClientSecurityGroupId, !Ref "AWS::NoValue"]
      TaskDefinition: !Ref WorkerTaskDefinition
      EnableExecuteCommand: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MaximumPercent: 100
        MinimumHealthyPercent: 0
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

Outputs:
  WorkerServiceArn:
    Description: ARN of the worker ECS service
    Value: !Ref WorkerService
    Export:
      Name: !Sub ${AWS::StackName}-WorkerServiceArn

  WorkerTaskDefinitionArn:
    Description: ARN of the worker task definition
    Value: !GetAtt WorkerTaskDefinition.TaskDefinitionArn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerTaskDefinitionArn
