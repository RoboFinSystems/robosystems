Description: RoboSystems Background Task Worker - ECS Fargate

Parameters:
  # Environment
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Environment name (prod or staging)
    ConstraintDescription: Must be prod or staging

  # Infrastructure & Networking
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnet IDs for ECS tasks (comma-separated)

  # Dagster Stack References (cross-stack)
  DagsterClusterArn:
    Type: String
    Description: ARN of the Dagster ECS cluster (from dagster stack output)
  DagsterSecurityGroupId:
    Type: String
    Description: Security group ID from Dagster stack (VPC-internal access)
    AllowedPattern: ^sg-[0-9a-f]+$

  # Container & Application Configuration
  ECRRepositoryUrl:
    Type: String
    Description: Full ECR repository URL (e.g., 123456789.dkr.ecr.us-east-1.amazonaws.com/robosystems)
  ECRImageTag:
    Type: String
    Description: Docker image tag
    Default: latest

  # Fargate Configuration
  WorkerCpu:
    Type: String
    Default: "512"
    Description: CPU units for worker (512 = 0.5 vCPU)
    AllowedValues: ["512", "1024", "2048"]
  WorkerMemory:
    Type: String
    Default: "1024"
    Description: Memory in MiB for worker
    AllowedValues: ["1024", "2048", "4096"]
  WorkerDesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 10
    Description: Static desired count when autoscaling is disabled; ignored when autoscaling is enabled
  WorkerMinCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 10
    Description: Minimum number of worker tasks (always-on baseline)
  WorkerMaxCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 10
    Description: Maximum number of worker tasks during burst
  DagsterClusterName:
    Type: String
    Description: Name of the Dagster ECS cluster (last segment of ARN)

  # Database Configuration (from Postgres stack outputs)
  DatabaseEndpoint:
    Type: String
    Description: PostgreSQL database endpoint hostname
  DatabasePort:
    Type: String
    Description: PostgreSQL database port
    Default: "5432"
  DatabaseSecurityGroupId:
    Type: String
    Description: Security group ID for PostgreSQL access
    AllowedPattern: ^sg-[0-9a-f]+$

  # Cache Configuration
  ValkeyUrl:
    Type: String
    Description: Valkey ElastiCache endpoint URL
    AllowedPattern: ^rediss?://.*:[0-9]+$
  ValkeyClientSecurityGroupId:
    Type: String
    Description: Security group ID for applications connecting to Valkey
    AllowedPattern: ^sg-[0-9a-f]+$

  # OpenSearch (optional)
  OpenSearchEndpoint:
    Type: String
    Description: OpenSearch domain endpoint URL (empty if not deployed)
    Default: ""
  OpenSearchClientSecurityGroupId:
    Type: String
    Description: Security group ID for applications connecting to OpenSearch (empty if not deployed)
    Default: ""

  # S3 Bucket Configuration (from S3 stack outputs)
  SharedRawBucketArn:
    Type: String
    Description: ARN of shared raw data bucket (from S3 stack output)
  SharedProcessedBucketArn:
    Type: String
    Description: ARN of shared processed data bucket (from S3 stack output)
  UserDataBucketArn:
    Type: String
    Description: ARN of user data bucket (from S3 stack output)
  DeploymentBucketArn:
    Type: String
    Description: ARN of deployment bucket (from S3 stack output)
  LogsBucketArn:
    Type: String
    Description: ARN of logs bucket (from S3 stack output)

  # Monitoring
  LogRetentionDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 365
    Description: CloudWatch log retention in days

  SNSAlertEmail:
    Type: String
    Default: ""
    Description: Email for worker alerts (e.g. DLQ depth); empty disables alarm notifications

  # Tagging Configuration
  ServiceTag:
    Type: String
    Default: RoboSystems
    Description: Service tag for resource identification and billing
  ComponentTag:
    Type: String
    Default: Worker
    Description: Component tag for resource identification and billing

  WorkerAutoscalingEnabled:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable queue-depth-based autoscaling (when false, uses static WorkerDesiredCount)

Conditions:
  HasOpenSearch: !Not [!Equals [!Ref OpenSearchEndpoint, ""]]
  AutoscalingEnabled: !Equals [!Ref WorkerAutoscalingEnabled, "true"]
  HasAlertEmail: !Not [!Equals [!Ref SNSAlertEmail, ""]]

Resources:
  # ========================================
  # LOG GROUP
  # ========================================
  WorkerLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub /robosystems/${Environment}/worker
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ========================================
  # IAM ROLES
  # ========================================
  WorkerTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub robosystems-worker-task-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WorkerTaskPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Secrets Manager
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/*"
              # ListSecrets doesn't support resource-level permissions (AWS API constraint)
              - Effect: Allow
                Action:
                  - secretsmanager:ListSecrets
                Resource: "*"
              # SSM Parameter Store (feature flags, tuning)
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource:
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/features"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/features/*"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/tuning"
                  - !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/robosystems/${Environment}/tuning/*"
              # KMS for secrets
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              # S3 for data access
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !Ref SharedRawBucketArn
                  - !Sub "${SharedRawBucketArn}/*"
                  - !Ref SharedProcessedBucketArn
                  - !Sub "${SharedProcessedBucketArn}/*"
                  - !Ref UserDataBucketArn
                  - !Sub "${UserDataBucketArn}/*"
                  - !Ref DeploymentBucketArn
                  - !Sub "${DeploymentBucketArn}/*"
                  - !Ref LogsBucketArn
                  - !Sub "${LogsBucketArn}/*"
              # AWS Bedrock for Claude AI (agent tasks)
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/anthropic.claude-*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/global.anthropic.claude-*"
                  - !Sub "arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*"
              - Effect: Allow
                Action:
                  - bedrock:GetFoundationModel
                  - bedrock:ListFoundationModels
                  - bedrock:ListInferenceProfiles
                Resource: "*"
              # DynamoDB for graph registries (read + write for allocation, tier upgrades)
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/robosystems-graph-${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:dynamodb:${AWS::Region}:${AWS::AccountId}:table/robosystems-graph-${Environment}-*/index/*"
              # Lambda invocation (Volume Manager for tier upgrades)
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:RoboSystemsGraphVolumes*-volume-manager"
              # Auto Scaling (graph instance allocation, tier upgrades)
              - Effect: Allow
                Action:
                  - autoscaling:DescribeAutoScalingGroups
                Resource: "*"
              - Effect: Allow
                Action:
                  - autoscaling:SetDesiredCapacity
                  - autoscaling:SetInstanceProtection
                Resource:
                  - !Sub "arn:${AWS::Partition}:autoscaling:${AWS::Region}:${AWS::AccountId}:autoScalingGroup:*:autoScalingGroupName/robosystems-*-writers-${Environment}-asg"
              # ECS task scale-in protection (worker protects itself while busy)
              - Effect: Allow
                Action:
                  - ecs:UpdateTaskProtection
                Resource:
                  - !Sub "arn:${AWS::Partition}:ecs:${AWS::Region}:${AWS::AccountId}:task/${DagsterClusterName}/*"
              # CloudFormation (lookup infrastructure outputs like Lambda ARNs)
              - Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource:
                  - !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/RoboSystemsGraph*/*"
              # CloudWatch Logs
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource:
                  - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/robosystems/${Environment}/worker:*"
              # CloudWatch Metrics
              #
              # Two namespaces, and the second one is load-bearing. Graph
              # allocation runs in the worker, and its failure metric publishes
              # to RoboSystems/Graph/${Environment} (allocation_manager.py's
              # _publish_failure_metric) because that is the namespace the
              # AllocationFailures alarms in graph-ladybug.yaml watch. With only
              # the Worker namespace allowed, every publish returned AccessDenied
              # into a logger.error and the alarms sat OK on "no datapoints
              # received" -- in BOTH environments -- since February.
              #
              # Proven 2026-08-15 by inducing a real no_capacity failure in
              # staging: the allocation failed in 17s, the metric never
              # published, and the worker log carried the AccessDenied. The
              # 2026-08-09 dimension fix was correct and could never have taken
              # effect underneath this.
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    "cloudwatch:namespace":
                      - !Sub "RoboSystems/Worker/${Environment}"
                      - !Sub "RoboSystems/Graph/${Environment}"
              # OpenSearch (conditional)
              - !If
                - HasOpenSearch
                - Effect: Allow
                  Action:
                    - es:ESHttpGet
                    - es:ESHttpHead
                    - es:ESHttpPost
                    - es:ESHttpPut
                  Resource:
                    - !Sub "arn:${AWS::Partition}:es:${AWS::Region}:${AWS::AccountId}:domain/robosystems-${Environment}/*"
                - !Ref "AWS::NoValue"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  WorkerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub robosystems-worker-execution-role-${Environment}
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ExecutionRoleSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/*"
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ========================================
  # TASK DEFINITION
  # ========================================
  WorkerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub robosystems-worker-${Environment}
      Cpu: !Ref WorkerCpu
      Memory: !Ref WorkerMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: ARM64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt WorkerExecutionRole.Arn
      TaskRoleArn: !GetAtt WorkerTaskRole.Arn
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation
      ContainerDefinitions:
        - Name: worker
          Image: !Sub ${ECRRepositoryUrl}:${ECRImageTag}
          Essential: true
          StopTimeout: 119 # Fargate max is <120s
          Command: ["/app/bin/entrypoint.sh"]
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref WorkerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: worker
          Environment:
            - Name: ENVIRONMENT
              Value: !Ref Environment
            - Name: DOCKER_PROFILE
              Value: worker
            - Name: DATABASE_ENDPOINT
              Value: !Ref DatabaseEndpoint
            - Name: DATABASE_PORT
              Value: !Ref DatabasePort
            - Name: VALKEY_URL
              Value: !Ref ValkeyUrl
            - !If
              - HasOpenSearch
              - Name: OPENSEARCH_URL
                Value: !Ref OpenSearchEndpoint
              - !Ref "AWS::NoValue"
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            # Dagster event-log storage — lets worker tasks report runless
            # AssetMaterialization events to the Dagster asset catalog
            # (graph_creation, subgraph_creation, graph_tier_upgrade,
            # extensions_materialize). Without these the baked dagster.yaml's
            # postgres storage can't resolve, and DagsterInstance.get() fails.
            - Name: DAGSTER_HOME
              Value: /app/dagster_home
            - Name: DAGSTER_POSTGRES_HOST
              Value: !Ref DatabaseEndpoint
            - Name: DAGSTER_POSTGRES_PORT
              Value: !Ref DatabasePort
            - Name: DAGSTER_POSTGRES_USER
              Value: "postgres"
            - Name: DAGSTER_POSTGRES_DB
              Value: dagster
            # Address of the Dagster webserver's GraphQL API. Without these the
            # worker falls back to env.py's compose default ("dagster-webserver"),
            # which doesn't resolve in the VPC, and every job the worker submits
            # (backup, restore, materialize) fails at DNS resolution.
            - Name: DAGSTER_HOST
              Value: !Sub webserver.dagster.${Environment}.robosystems.local
            - Name: DAGSTER_PORT
              Value: "3000"
          Secrets:
            - Name: POSTGRES_PASSWORD
              ValueFrom: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/postgres:POSTGRES_PASSWORD::"
            - Name: DAGSTER_POSTGRES_PASSWORD
              ValueFrom: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:robosystems/${Environment}/postgres:POSTGRES_PASSWORD::"

  # ========================================
  # ECS SERVICE
  # ========================================
  WorkerService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub robosystems-worker-${Environment}
      Cluster: !Ref DagsterClusterArn
      DesiredCount: !If
        - AutoscalingEnabled
        - !Ref "AWS::NoValue"
        - !Ref WorkerDesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref DagsterSecurityGroupId
            - !Ref ValkeyClientSecurityGroupId
            - !Ref DatabaseSecurityGroupId
            - !If [HasOpenSearch, !Ref OpenSearchClientSecurityGroupId, !Ref "AWS::NoValue"]
      TaskDefinition: !Ref WorkerTaskDefinition
      EnableExecuteCommand: true
      PropagateTags: SERVICE
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ========================================
  # AUTOSCALING
  # ========================================
  WorkerScalableTarget:
    Condition: AutoscalingEnabled
    DependsOn: WorkerService
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      ServiceNamespace: ecs
      ScalableDimension: ecs:service:DesiredCount
      ResourceId: !Sub service/${DagsterClusterName}/robosystems-worker-${Environment}
      MinCapacity: !Ref WorkerMinCount
      MaxCapacity: !Ref WorkerMaxCount
      RoleARN: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService

  WorkerScaleOutPolicy:
    Condition: AutoscalingEnabled
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: worker-scale-out
      PolicyType: StepScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 60
        MetricAggregationType: Maximum
        StepAdjustments:
          # QueueDepth > 2 and <= 5: add 1
          - MetricIntervalLowerBound: 0
            MetricIntervalUpperBound: 3
            ScalingAdjustment: 1
          # QueueDepth > 5 and <= 10: add 2
          - MetricIntervalLowerBound: 3
            MetricIntervalUpperBound: 8
            ScalingAdjustment: 2
          # QueueDepth > 10: add 3
          - MetricIntervalLowerBound: 8
            ScalingAdjustment: 3

  WorkerScaleOutAlarm:
    Condition: AutoscalingEnabled
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub robosystems-worker-queue-depth-high-${Environment}
      AlarmDescription: Worker queue depth exceeds threshold - scale out
      Namespace: !Sub RoboSystems/Worker/${Environment}
      MetricName: QueueDepth
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 2
      ComparisonOperator: GreaterThanThreshold
      # Fail open: a gap in published depth errs toward adding capacity rather
      # than silently not scaling. Scale-in stays notBreaching so a gap never
      # wrongly scales to zero.
      TreatMissingData: breaching
      AlarmActions:
        - !Ref WorkerScaleOutPolicy

  WorkerScaleInPolicy:
    Condition: AutoscalingEnabled
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: worker-scale-in
      PolicyType: StepScaling
      ScalingTargetId: !Ref WorkerScalableTarget
      StepScalingPolicyConfiguration:
        AdjustmentType: ChangeInCapacity
        Cooldown: 300
        MetricAggregationType: Maximum
        StepAdjustments:
          # QueueDepth dropped to 0: remove 1
          - MetricIntervalUpperBound: 0
            ScalingAdjustment: -1

  WorkerScaleInAlarm:
    Condition: AutoscalingEnabled
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub robosystems-worker-queue-depth-zero-${Environment}
      AlarmDescription: Worker queue empty - scale in
      Namespace: !Sub RoboSystems/Worker/${Environment}
      MetricName: QueueDepth
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 0
      ComparisonOperator: LessThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WorkerScaleInPolicy

  # ========================================
  # ALERTING
  # ========================================
  WorkerNotificationTopic:
    Condition: HasAlertEmail
    Type: AWS::SNS::Topic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TopicName: !Sub robosystems-worker-${Environment}-alerts
      DisplayName: !Sub RoboSystems Worker ${Environment} Alerts
      Subscription:
        - Endpoint: !Ref SNSAlertEmail
          Protocol: email
      Tags:
        - Key: Name
          Value: !Sub robosystems-worker-notifications-${Environment}
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  WorkerDLQDepthAlarm:
    Condition: HasAlertEmail
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub robosystems-worker-dlq-depth-${Environment}
      AlarmDescription: >-
        Worker dead-letter queue has one or more messages - a job failed
        permanently and needs investigation.
      Namespace: !Sub RoboSystems/Worker/${Environment}
      MetricName: DLQDepth
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      # Only an actual DLQ message pages; a gap in published depth is not an
      # alertable condition (worker liveness is covered elsewhere).
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref WorkerNotificationTopic

Outputs:
  WorkerServiceArn:
    Description: ARN of the worker ECS service
    Value: !Ref WorkerService
    Export:
      Name: !Sub ${AWS::StackName}-WorkerServiceArn

  WorkerTaskDefinitionArn:
    Description: ARN of the worker task definition
    Value: !GetAtt WorkerTaskDefinition.TaskDefinitionArn
    Export:
      Name: !Sub ${AWS::StackName}-WorkerTaskDefinitionArn

  WorkerNotificationTopicArn:
    Condition: HasAlertEmail
    Description: ARN of the worker alerts SNS topic
    Value: !Ref WorkerNotificationTopic
