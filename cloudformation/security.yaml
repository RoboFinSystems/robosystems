Description: RoboSystems Security Baseline - Account-Global Detective Controls (SOC 2)

# Account/region-global detective services for SOC 2 (CC4/CC6/CC7). Every
# resource here is a per-account singleton, so this is ONE shared stack
# (RoboSystemsSecurity) like cloudtrail.yaml — never per-environment, or the
# second environment's deploy would collide. Deployed by the `security` job in
# deploy-api's VPC workflow, gated on the SECURITY_ENABLED variable (mirrors
# CloudTrail). Off by default.
#
# Covers: GuardDuty (threat detection), Security Hub (+ FSBP standard),
# AWS Config (config recorder — the cost outlier, gated separately), and
# IAM Access Analyzer. Amazon Inspector v2 has no native single-account
# CloudFormation resource (enablement is the inspector2:Enable API), so it is
# turned on by a small idempotent CLI step in the deploy job, not here.
#
# Workflow scope: the deploy job wires only Environment + EnableConfig
# (SECURITY_CONFIG_ENABLED). GuardDuty / Security Hub / Access Analyzer use their
# template defaults (on) — SECURITY_ENABLED is intentionally all-or-nothing for
# those three; granular per-service toggling would need additional GH variables.
#
# Precondition: these are account-global singletons. If GuardDuty, Security Hub,
# or Access Analyzer is already enabled out-of-band in the target account, first
# stack creation fails with an "already exists" error — an account-state
# precondition, not a permissions gap, so there is no CFN-level guard for it.

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Environment name (tagging only; the services are account-global)

  EnableGuardDuty:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable Amazon GuardDuty threat detection

  EnableSecurityHub:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable AWS Security Hub with the FSBP standard

  EnableCISStandard:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Also enable the CIS AWS Foundations Benchmark standard (in addition to FSBP)

  EnableAccessAnalyzer:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Enable IAM Access Analyzer (account scope)

  EnableConfig:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Enable AWS Config recorder (cost scales with resource count — off by default)

  ConfigRecordingFrequency:
    Type: String
    Default: DAILY
    AllowedValues:
      - DAILY
      - CONTINUOUS
    Description: Config recording cadence (DAILY is far cheaper than CONTINUOUS)

  ConfigRetentionDays:
    Type: Number
    Default: 400
    MinValue: 1
    MaxValue: 2555
    Description: Days to retain Config snapshots in S3 (~13 months for a SOC 2 window)

  ServiceTag:
    Type: String
    Default: RoboSystems
    Description: Service tag for resource identification

  ComponentTag:
    Type: String
    Default: Security
    Description: Component tag for resource identification

Conditions:
  GuardDutyOn: !Equals [!Ref EnableGuardDuty, "true"]
  SecurityHubOn: !Equals [!Ref EnableSecurityHub, "true"]
  CISOn: !And
    - !Condition SecurityHubOn
    - !Equals [!Ref EnableCISStandard, "true"]
  AccessAnalyzerOn: !Equals [!Ref EnableAccessAnalyzer, "true"]
  ConfigOn: !Equals [!Ref EnableConfig, "true"]

Resources:
  # --- GuardDuty: continuous threat detection over CloudTrail/VPC/DNS telemetry.
  GuardDutyDetector:
    Type: AWS::GuardDuty::Detector
    Condition: GuardDutyOn
    Properties:
      Enable: true
      FindingPublishingFrequency: FIFTEEN_MINUTES
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  # --- Security Hub: aggregates findings + scores controls against standards.
  SecurityHub:
    Type: AWS::SecurityHub::Hub
    Condition: SecurityHubOn
    Properties:
      ControlFindingGenerator: SECURITY_CONTROL
      AutoEnableControls: true
      # Do not auto-enable default standards on Hub creation — the explicit
      # SecurityHubFSBP / SecurityHubCIS resources own standards deterministically.
      # Leaving this on makes the Hub enable FSBP itself, which then collides with
      # SecurityHubFSBP ("Standards is already enabled") and fails the stack.
      EnableDefaultStandards: false
      # Hub Tags is a JSON map (not the Key/Value list the other resources use).
      Tags:
        Environment: !Ref Environment
        Service: !Ref ServiceTag
        Component: !Ref ComponentTag
        Purpose: SOC2-Compliance

  # AWS Foundational Security Best Practices — the AWS-recommended baseline.
  SecurityHubFSBP:
    Type: AWS::SecurityHub::Standard
    Condition: SecurityHubOn
    DependsOn: SecurityHub
    Properties:
      StandardsArn: !Sub arn:${AWS::Partition}:securityhub:${AWS::Region}::standards/aws-foundational-security-best-practices/v/1.0.0

  # CIS AWS Foundations Benchmark — optional, in addition to FSBP.
  SecurityHubCIS:
    Type: AWS::SecurityHub::Standard
    Condition: CISOn
    DependsOn: SecurityHub
    Properties:
      StandardsArn: !Sub arn:${AWS::Partition}:securityhub:::ruleset/cis-aws-foundations-benchmark/v/1.2.0

  # --- IAM Access Analyzer: flags resources shared outside the account.
  AccessAnalyzer:
    Type: AWS::AccessAnalyzer::Analyzer
    Condition: AccessAnalyzerOn
    Properties:
      AnalyzerName: robosystems-account-analyzer
      Type: ACCOUNT
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  # --- AWS Config: records resource configuration history for drift/compliance.
  # Heavier + cost-bearing, so gated behind EnableConfig (default off). Needs a
  # dedicated S3 bucket, a delivery role, a recorder, and a delivery channel.
  ConfigBucket:
    Type: AWS::S3::Bucket
    Condition: ConfigOn
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub robosystems-config-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ConfigRetention
            Status: Enabled
            Transitions:
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING
            ExpirationInDays: !Ref ConfigRetentionDays
            NoncurrentVersionExpirationInDays: !Ref ConfigRetentionDays
      Tags:
        - Key: Name
          Value: !Sub ${ServiceTag}-config
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  ConfigBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ConfigOn
    Properties:
      Bucket: !Ref ConfigBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AWSConfigBucketPermissionsCheck
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action:
              - s3:GetBucketAcl
              - s3:ListBucket
            Resource: !GetAtt ConfigBucket.Arn
            Condition:
              StringEquals:
                "AWS:SourceAccount": !Ref AWS::AccountId
          - Sid: AWSConfigBucketDelivery
            Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub ${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/Config/*
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
                "AWS:SourceAccount": !Ref AWS::AccountId

  ConfigRole:
    Type: AWS::IAM::Role
    Condition: ConfigOn
    Properties:
      RoleName: robosystems-config-recorder
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: config.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWS_ConfigRole
      Policies:
        - PolicyName: config-s3-delivery
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetBucketAcl
                Resource: !GetAtt ConfigBucket.Arn
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${ConfigBucket.Arn}/AWSLogs/${AWS::AccountId}/*
                Condition:
                  StringEquals:
                    "s3:x-amz-acl": bucket-owner-full-control

  ConfigRecorder:
    Type: AWS::Config::ConfigurationRecorder
    Condition: ConfigOn
    Properties:
      Name: default
      RoleARN: !GetAtt ConfigRole.Arn
      RecordingGroup:
        AllSupported: true
        IncludeGlobalResourceTypes: true
      RecordingMode:
        RecordingFrequency: !Ref ConfigRecordingFrequency

  # The delivery channel can only be created once the configuration recorder
  # exists (otherwise CloudFormation fails with "configuration recorder is not
  # available to put delivery channel"), and it needs the bucket policy in place
  # to write. Order it after both.
  ConfigDeliveryChannel:
    Type: AWS::Config::DeliveryChannel
    Condition: ConfigOn
    DependsOn:
      - ConfigBucketPolicy
      - ConfigRecorder
    Properties:
      Name: default
      S3BucketName: !Ref ConfigBucket
      ConfigSnapshotDeliveryProperties:
        DeliveryFrequency: TwentyFour_Hours

  # --- Security alerting: route detective-control signals to the existing
  # per-env security-alerts SNS topics (owned by api.yaml as
  # robosystems-<env>-security-alerts, email-subscribed). Account-global
  # signals (GuardDuty findings, root-credential use) notify the prod topic —
  # ${Environment} normalizes to prod in the deploy job.
  #
  # What belongs in this stack is the account-global detective baseline only.
  # Alarms on API-stack resources (ALB health, the security metric namespace,
  # the rotation Lambda) used to live here because api.yaml had run out of
  # inline-template room; api.yaml now deploys from S3, so they sit beside the
  # resources they watch and reference them directly. Resist adding per-env
  # application alarms back here — the size pressure that justified it is gone.
  #
  # Precondition: the topic must already exist (api stack deployed with
  # SNSAlertEmail set), or the topic-policy attachment fails this stack.
  SecurityAlertsTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          # A TopicPolicy replaces the topic's access policy wholesale, so the
          # SNS default same-account owner statement must be reproduced — the
          # CloudWatch alarm actions publish through it.
          - Sid: DefaultOwnerAccess
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
            Condition:
              StringEquals:
                AWS:SourceOwner: !Ref AWS::AccountId
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
            Condition:
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*

  # GuardDuty findings otherwise sit unseen in the console until the next
  # manual posture audit. Medium+ (severity >= 4) goes to email; low-severity
  # recon noise stays out of the inbox and is still visible in the console.
  GuardDutyFindingsRule:
    Type: AWS::Events::Rule
    Condition: GuardDutyOn
    Properties:
      Name: robosystems-guardduty-findings
      Description: Route GuardDuty findings of severity >= 4 (medium and high) to the security-alerts topic
      State: ENABLED
      EventPattern:
        source:
          - aws.guardduty
        detail-type:
          - GuardDuty Finding
        detail:
          severity:
            - numeric: [">=", 4]
      Targets:
        - Id: security-alerts-sns
          Arn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
          InputTransformer:
            InputPathsMap:
              severity: $.detail.severity
              type: $.detail.type
              title: $.detail.title
              description: $.detail.description
              region: $.region
              resourceType: $.detail.resource.resourceType
            InputTemplate: >-
              "GuardDuty finding (severity <severity>) in <region>: <type>.
              <title>. <description> [resource: <resourceType>]"

  # Root-credential use should be near-zero in this OIDC-only account; any
  # occurrence (API call or console sign-in, including failed sign-ins) is
  # worth an immediate email. Matches only direct root activity — service
  # events and service-invoked calls are excluded, mirroring the CIS 1.7
  # filter. Requires the CloudTrail trail (CLOUDTRAIL_ENABLED) to be logging;
  # global service events (IAM, sign-in) deliver to us-east-1, where this
  # stack lives.
  RootAccountActivityRule:
    Type: AWS::Events::Rule
    Properties:
      Name: robosystems-root-account-activity
      Description: Alert on any root-credential API call or console sign-in
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
          - AWS Console Sign In via CloudTrail
        detail:
          userIdentity:
            type:
              - Root
            invokedBy:
              - exists: false
          eventType:
            - anything-but: AwsServiceEvent
      Targets:
        - Id: security-alerts-sns
          Arn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              sourceIP: $.detail.sourceIPAddress
              eventTime: $.detail.eventTime
              region: $.region
            InputTemplate: >-
              "Root account activity detected: <eventName> from <sourceIP> at
              <eventTime> (<region>). Root use is unexpected in this account -
              investigate immediately."

  # A new ACTIVE Access Analyzer finding means something in the account became
  # reachable from outside it (a bucket policy, a role trust, a KMS grant) —
  # the same notify gap the GuardDuty rule closes: findings recorded that
  # nobody is emailed about. ACTIVE-only keeps archive/resolve transitions
  # quiet; baseline in this account is zero findings.
  AccessAnalyzerFindingsRule:
    Type: AWS::Events::Rule
    Condition: AccessAnalyzerOn
    Properties:
      Name: robosystems-access-analyzer-findings
      Description: Route active IAM Access Analyzer findings (external access) to the security-alerts topic
      State: ENABLED
      EventPattern:
        source:
          - aws.access-analyzer
        detail-type:
          - Access Analyzer Finding
        detail:
          status:
            - ACTIVE
      Targets:
        - Id: security-alerts-sns
          Arn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
          InputTransformer:
            InputPathsMap:
              resource: $.detail.resource
              resourceType: $.detail.resourceType
              isPublic: $.detail.isPublic
              region: $.region
            InputTemplate: >-
              "Access Analyzer finding in <region>: <resourceType> <resource>
              is accessible from outside the account (public: <isPublic>).
              Review, then remediate or archive."

  # The alert chain above depends on CloudTrail (feeds the root rule),
  # GuardDuty, and the rest of the detective baseline staying on — but
  # disabling any of them is otherwise silent, and StopLogging is the
  # canonical first move before doing something worth hiding. Event names are
  # unique per service, so the flat eventSource x eventName lists cannot
  # cross-match. Unlike the CIS metric-filter suite (skipped: needs CloudWatch
  # Logs ingest), EventBridge management events cost nothing; same
  # CloudTrail-logging precondition as the root rule. UpdateTrail and
  # UpdateDetector are matched wholesale (CIS 3.5-style) — a legitimate
  # settings change emails once, acceptable on a tamper surface.
  DetectiveControlTamperRule:
    Type: AWS::Events::Rule
    Properties:
      Name: robosystems-detective-control-tamper
      Description: Alert when CloudTrail, GuardDuty, Security Hub, Config, or Access Analyzer is disabled or deleted
      State: ENABLED
      EventPattern:
        detail-type:
          - AWS API Call via CloudTrail
        detail:
          eventSource:
            - cloudtrail.amazonaws.com
            - guardduty.amazonaws.com
            - securityhub.amazonaws.com
            - config.amazonaws.com
            - access-analyzer.amazonaws.com
          eventName:
            - StopLogging
            - DeleteTrail
            - UpdateTrail
            - DeleteDetector
            - UpdateDetector
            - DisableSecurityHub
            - StopConfigurationRecorder
            - DeleteConfigurationRecorder
            - DeleteDeliveryChannel
            - DeleteAnalyzer
      Targets:
        - Id: security-alerts-sns
          Arn: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-${Environment}-security-alerts
          InputTransformer:
            InputPathsMap:
              eventName: $.detail.eventName
              eventSource: $.detail.eventSource
              actor: $.detail.userIdentity.arn
              sourceIP: $.detail.sourceIPAddress
              eventTime: $.detail.eventTime
            InputTemplate: >-
              "Detective-control change: <eventName> (<eventSource>) by <actor>
              from <sourceIP> at <eventTime>. If this was not a deliberate
              deploy or teardown, investigate immediately."

  # Delivery assurance for the alert channel itself: every alarm in this account
  # reaches a human through SNS email.
  #
  # **Be precise about what this catches, because the obvious reading is wrong.**
  # It fires when SNS *attempts* a delivery and the attempt fails — the bounce
  # window that precedes AWS disabling a confirmed subscriber. It does NOT
  # detect a subscription sitting in `PendingConfirmation`, nor one AWS has
  # already dropped: neither receives delivery attempts, so neither produces a
  # failed-notification datapoint, and the alarm is silent straight through the
  # scenario people assume it covers. **The check for that state is the
  # subscription list itself** — `aws sns list-subscriptions-by-topic` for a
  # `PendingConfirmation` ARN or a missing subscriber. See the periodic
  # verification in `runbooks/incident-triage.md`.
  #
  # **This alarm cannot report its own brokenness.** SNS publishes
  # `NumberOfNotificationsFailed` only on failure — healthy is *no data*, which
  # `notBreaching` renders as OK. A query that matches nothing (typo, changed
  # schema) produces the same no-data and the same OK. `notBreaching` is still
  # the right setting — the alternative is an alarm that lives permanently in
  # INSUFFICIENT_DATA — but it means a real deploy is the *only* validation this
  # alarm will ever get. **Re-validate whenever this expression changes**, with
  # `aws cloudwatch get-metric-data` on the expression before deploying it.
  #
  # Aggregated across every topic rather than one alarm per topic: sixteen alert
  # topics across ten stacks, and the query also picks up topics added later
  # without anyone remembering.
  #
  # **This is a Metrics Insights query, and it must not be rewritten as SEARCH.**
  # `SUM(SEARCH(...))` is the obvious way to express this and it is rejected at
  # deploy time — `PutMetricAlarm` answers "SEARCH is not supported on Metric
  # Alarms". SEARCH works in dashboards and GetMetricData but never in an alarm.
  # Metrics Insights is the supported route to the same fleet-wide aggregate, and
  # it keeps the property this alarm exists for: the query picks up new topics on
  # its own. No GROUP BY — that would make it a multi-time-series alarm, which
  # additionally requires ORDER BY; a bare aggregate returns the single series an
  # alarm wants. Period is required here, exactly as it was for the metric-math
  # form: with no MetricStat there is nothing to inherit a period from.
  #
  # **One alarm, not one per environment.** The query matches every topic in the
  # account and region, so prod and staging copies would watch identical data and
  # both fire on the same failure. It routes to the prod alert topic because that
  # is the destination that gets read, not because it is prod-scoped.
  #
  # Circular by design — a delivery-failure alarm delivered by the channel that
  # is failing. Accepted: the realistic failure is one subscriber bouncing, not
  # SNS itself being down.
  SnsDeliveryFailureAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: robosystems-sns-delivery-failures
      AlarmDescription: An SNS topic failed to deliver a notification
      ComparisonOperator: GreaterThanThreshold
      EvaluationPeriods: 1
      Threshold: 0
      TreatMissingData: notBreaching
      Metrics:
        - Id: failed
          Label: NumberOfNotificationsFailed across all topics
          ReturnData: true
          Period: 300
          Expression: >-
            SELECT SUM(NumberOfNotificationsFailed)
            FROM SCHEMA("AWS/SNS", TopicName)
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-prod-security-alerts

  # CUR pipeline Lambdas live in the AWS-provided RoboSystemsCUR stack (not in
  # this repo), so their generated names are literals here. They are stable
  # unless that stack is recreated — update these two values if it ever is.
  CurInitializerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: robosystems-cur-initializer-errors
      AlarmDescription: CUR Athena initializer Lambda reported errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: RoboSystemsCUR-AWSCURInitializer-dhIFEKWJGt2f
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-prod-security-alerts

  CurNotificationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: robosystems-cur-notification-errors
      AlarmDescription: CUR S3 notification Lambda reported errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: RoboSystemsCUR-AWSS3CURNotification-ZSi5BHYx7O2N
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:robosystems-prod-security-alerts

Outputs:
  GuardDutyDetectorId:
    Condition: GuardDutyOn
    Description: GuardDuty detector id
    Value: !Ref GuardDutyDetector
    Export:
      Name: !Sub ${AWS::StackName}-GuardDutyDetectorId

  ConfigBucketName:
    Condition: ConfigOn
    Description: S3 bucket holding AWS Config snapshots
    Value: !Ref ConfigBucket
    Export:
      Name: !Sub ${AWS::StackName}-ConfigBucket

  EstimatedMonthlyCost:
    Description: Rough monthly cost at low account volume
    Value: "~$5-15/mo without Config; Config adds cost scaling with resource count (DAILY keeps it low)"
