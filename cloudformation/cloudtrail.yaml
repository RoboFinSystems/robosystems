Description: RoboSystems CloudTrail - Audit Logging for Compliance

Parameters:
  # Environment
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Environment name (prod or staging)

  # CloudTrail Configuration
  EnableCloudTrail:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable CloudTrail for audit logging

  # Cost Optimization
  LogRetentionDays:
    Type: Number
    Default: 90
    MinValue: 1
    MaxValue: 2555
    Description: Number of days to retain CloudTrail logs

  DataEventsEnabled:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: Enable data events logging (increases cost significantly)

  # Tagging
  ServiceTag:
    Type: String
    Default: RoboSystems
    Description: Service tag for resource identification
  ComponentTag:
    Type: String
    Default: CloudTrail
    Description: Component tag for resource identification

  # Data Events Configuration (Optional)
  MonitoredBuckets:
    Type: CommaDelimitedList
    Default: ""
    Description: Comma-separated list of S3 bucket names to monitor for data events (leave empty to use defaults)

  # S3 Bucket Configuration (from S3 stack outputs - for data events monitoring)
  UserDataBucketArn:
    Type: String
    Default: ""
    Description: ARN of user data bucket for default data events monitoring (optional)

Conditions:
  CreateCloudTrail: !Equals [!Ref EnableCloudTrail, "true"]
  EnableDataEvents: !And
    - !Condition CreateCloudTrail
    - !Equals [!Ref DataEventsEnabled, "true"]
  HasCustomBuckets: !Not
    - !Equals
      - !Join ["", !Ref MonitoredBuckets]
      - ""
  HasUserDataBucket: !Not [!Equals [!Ref UserDataBucketArn, ""]]

Resources:
  # S3 Bucket for CloudTrail logs
  CloudTrailBucket:
    Type: AWS::S3::Bucket
    Condition: CreateCloudTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "robosystems-cloudtrail-${Environment}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: IntelligentTieringAndExpiry
            Status: Enabled
            Transitions:
              # Use Intelligent-Tiering for automatic cost optimization
              - TransitionInDays: 0
                StorageClass: INTELLIGENT_TIERING
            # Delete old logs after retention period
            ExpirationInDays: !Ref LogRetentionDays
      VersioningConfiguration:
        Status: Enabled
      # Object Lock (governance mode) is enabled on the existing bucket via the
      # S3 API, not here: CloudFormation's ObjectLockEnabled property requires
      # bucket replacement, which a retained, name-pinned bucket cannot do.
      Tags:
        - Key: Name
          Value: !Sub "${ServiceTag}-cloudtrail-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  # Bucket policy to allow CloudTrail to write logs
  CloudTrailBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: CreateCloudTrail
    Properties:
      Bucket: !Ref CloudTrailBucket
      PolicyDocument:
        Statement:
          - Sid: AWSCloudTrailAclCheck
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:GetBucketAcl
            Resource: !GetAtt CloudTrailBucket.Arn
          - Sid: AWSCloudTrailWrite
            Effect: Allow
            Principal:
              Service: cloudtrail.amazonaws.com
            Action: s3:PutObject
            Resource: !Sub "${CloudTrailBucket.Arn}/*"
            Condition:
              StringEquals:
                "s3:x-amz-acl": bucket-owner-full-control
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !Sub "${CloudTrailBucket.Arn}/*"
              - !GetAtt CloudTrailBucket.Arn
            Condition:
              Bool:
                "aws:SecureTransport": "false"

  # CloudTrail - Minimalistic configuration
  CloudTrail:
    Type: AWS::CloudTrail::Trail
    Condition: CreateCloudTrail
    DependsOn: CloudTrailBucketPolicy
    Properties:
      TrailName: !Sub "robosystems-${Environment}"
      S3BucketName: !Ref CloudTrailBucket
      # Multi-region for comprehensive coverage (no extra cost)
      IsMultiRegionTrail: true
      IncludeGlobalServiceEvents: true
      # Enable log file validation for integrity (free)
      EnableLogFileValidation: true
      # Trail must be logging
      IsLogging: true
      # Event selectors for cost control
      EventSelectors:
        # Management events (API calls) - minimal cost
        - ReadWriteType: All
          IncludeManagementEvents: true
          # Data events - only if explicitly enabled (costly - $0.10 per 100,000 events)
          DataResources: !If
            - EnableDataEvents
            - - Type: "AWS::S3::Object"
                Values: !If
                  - HasCustomBuckets
                  - !Split
                    - ","
                    - !Sub
                      - "arn:${AWS::Partition}:s3:::${InnerItem}/*"
                      - InnerItem: !Join
                          - "/*,arn:${AWS::Partition}:s3:::"
                          - !Ref MonitoredBuckets
                  # Default: monitor user data bucket if ARN provided (from S3 stack)
                  - !If
                    - HasUserDataBucket
                    - - !Sub "${UserDataBucketArn}/*"
                    - !Ref AWS::NoValue
            - !Ref AWS::NoValue
      Tags:
        - Key: Name
          Value: !Sub "${ServiceTag}-cloudtrail-${Environment}"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  # SSM Session Manager command logging — captures the commands run during
  # bastion `start-session` shells (admin-tunnel accountability beyond
  # CloudTrail's "who connected"). The SSM-SessionManagerRunShell document is
  # account/region-global, so it lives in this single shared stack rather than
  # the per-env bastion stacks (which would collide on the reserved name). The
  # bastion instance role already carries logs:CreateLogStream/PutLogEvents.
  SessionLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateCloudTrail
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: /robosystems/ssm-sessions
      RetentionInDays: 400
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: Purpose
          Value: SOC2-Compliance

  SessionManagerPreferences:
    Type: AWS::SSM::Document
    Condition: CreateCloudTrail
    Properties:
      Name: SSM-SessionManagerRunShell
      DocumentType: Session
      DocumentFormat: JSON
      Content:
        schemaVersion: "1.0"
        description: Session Manager preferences with CloudWatch command logging
        sessionType: Standard_Stream
        inputs:
          cloudWatchLogGroupName: !Ref SessionLogGroup
          cloudWatchEncryptionEnabled: false
          cloudWatchStreamingEnabled: true
          idleSessionTimeout: "20"
          runAsEnabled: false
          shellProfile:
            linux: ""
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag

Outputs:
  CloudTrailArn:
    Description: ARN of the CloudTrail
    Value: !If
      - CreateCloudTrail
      - !GetAtt CloudTrail.Arn
      - "CloudTrail not enabled"
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailArn"

  CloudTrailBucketName:
    Description: S3 bucket for CloudTrail logs
    Value: !If
      - CreateCloudTrail
      - !Ref CloudTrailBucket
      - "CloudTrail not enabled"
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailBucket"

  CloudTrailEnabled:
    Description: Whether CloudTrail is enabled
    Value: !Ref EnableCloudTrail
    Export:
      Name: !Sub "${AWS::StackName}-CloudTrailEnabled"
