Description: RoboSystems Graph Database Infrastructure - DynamoDB, Lambda, and Secrets Manager

Parameters:
  # Environment
  Environment:
    Type: String
    Default: prod
    AllowedValues:
      - prod
      - staging
    Description: Environment name (prod or staging)
    ConstraintDescription: Must be prod or staging

  # Lambda Configuration
  LambdaImageUri:
    Type: String
    Description: ECR image URI for Lambda functions (container-based deployment)

  # Monitoring & Alerting
  SNSAlertEmail:
    Type: String
    Description: Email address for infrastructure alerts
    ConstraintDescription: Must be a valid email address

  # Tagging Configuration
  ServiceTag:
    Type: String
    Default: RoboSystems
    Description: Service tag for resource identification and billing
    ConstraintDescription: Must be a valid tag value
  ComponentTag:
    Type: String
    Default: GraphInfra
    Description: Component tag for resource identification and billing
    ConstraintDescription: Must be a valid tag value

Resources:
  # ===== DynamoDB Tables =====
  # Single instance registry for all graph database instances
  InstanceRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "robosystems-graph-${Environment}-instance-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: database_count
          AttributeType: N
        - AttributeName: cluster_tier
          AttributeType: S
        - AttributeName: backend_type
          AttributeType: S
      KeySchema:
        - AttributeName: instance_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: status-database-count-index
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: database_count
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: tier-status-index
          KeySchema:
            - AttributeName: cluster_tier
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: backend-type-status-index
          KeySchema:
            - AttributeName: backend_type
              KeyType: HASH
            - AttributeName: status
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: RoboSystems
        - Key: Component
          Value: GraphInfra
        - Key: CreatedBy
          Value: CloudFormation

  # Single graph registry for all database allocations
  GraphRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "robosystems-graph-${Environment}-graph-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: graph_id
          AttributeType: S
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: entity_id
          AttributeType: S
      KeySchema:
        - AttributeName: graph_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: instance-index
          KeySchema:
            - AttributeName: instance_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: entity-index
          KeySchema:
            - AttributeName: entity_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: RoboSystems
        - Key: Component
          Value: GraphInfra
        - Key: CreatedBy
          Value: CloudFormation

  # Volume registry for tracking graph database volumes
  VolumeRegistry:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub "robosystems-graph-${Environment}-volume-registry"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: volume_id
          AttributeType: S
        - AttributeName: instance_id
          AttributeType: S
        - AttributeName: database_id
          AttributeType: S
        - AttributeName: tier
          AttributeType: S
      KeySchema:
        - AttributeName: volume_id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: instance-index
          KeySchema:
            - AttributeName: instance_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: database-index
          KeySchema:
            - AttributeName: database_id
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        - IndexName: tier-index
          KeySchema:
            - AttributeName: tier
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Name
          Value: !Sub "robosystems-graph-${Environment}-volume-registry"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # ===== Authentication Infrastructure =====
  # Graph API authentication secret for Graph API clients on port 8001
  GraphApiSecret:
    Type: AWS::SecretsManager::Secret
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      Name: !Sub robosystems/${Environment}/graph-api
      Description: !Sub Graph API authentication key for ${Environment}
      SecretString: !Sub
        - |
          {
            "GRAPH_API_KEY": "${ApiKey}",
            "ENVIRONMENT": "${Environment}",
            "GENERATED_AT": "${GeneratedAt}"
          }
        - ApiKey: !GetAtt ApiKeyGenerator.ApiKey
          GeneratedAt: !GetAtt ApiKeyGenerator.GeneratedAt
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: ManagedBy
          Value: CloudFormation

  # Custom resource to generate initial API keys
  ApiKeyGenerator:
    Type: Custom::ApiKeyGenerator
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      ServiceToken: !GetAtt ApiKeyGeneratorFunction.Arn
      Environment: !Ref Environment

  ApiKeyGeneratorFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-key-generator"
      Description: "API Key Generator Lambda - inline code (no S3)"
      Runtime: python3.13
      Handler: index.lambda_handler
      Role: !GetAtt ApiKeyGeneratorRole.Arn
      Timeout: 60
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api-key-generator"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation
      Code:
        ZipFile: |
          """
          Graph API Key Generator Lambda Function

          CloudFormation custom resource that generates initial API keys for Graph services.
          This function is called during stack creation to generate the initial set of API keys.
          """

          import secrets
          import string
          import cfnresponse
          from datetime import datetime, timezone


          def generate_api_key(prefix, length=64):
            """
            Generate a secure API key with a given prefix.

            Args:
                prefix: Prefix for the API key (e.g., 'lbug_prod')
                length: Length of the random portion (default: 64)

            Returns:
                A secure API key string with high entropy
            """
            # Use a larger character set for better entropy
            alphabet = string.ascii_letters + string.digits + "-_"
            # Generate a longer key for better security
            random_part = "".join(secrets.choice(alphabet) for _ in range(length))
            return f"{prefix}_{random_part}"


          def lambda_handler(event, context):
            """
            CloudFormation custom resource handler for generating API keys.

            This function handles Create, Update, and Delete requests from CloudFormation.
            For Create/Update, it generates new API keys. For Delete, it simply returns success.

            Args:
                event: CloudFormation custom resource event
                context: Lambda context
            """
            try:
              request_type = event.get("RequestType", "")

              # For delete requests, just return success
              if request_type == "Delete":
                cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
                return

              # Get the environment from the resource properties
              resource_properties = event.get("ResourceProperties", {})
              environment = resource_properties.get("Environment", "unknown")

              # Generate a single high-entropy API key
              response_data = {
                "ApiKey": generate_api_key(f"graph_{environment}"),
                "GeneratedAt": datetime.now(timezone.utc).isoformat(),
              }

              # Log the generation (without exposing the actual key)
              print(f"Generated API key for environment: {environment}")
              print(f"Request Type: {request_type}")
              print(f"Generated at: {response_data['GeneratedAt']}")

              # Send success response to CloudFormation
              cfnresponse.send(event, context, cfnresponse.SUCCESS, response_data)

            except Exception as e:
              print(f"Error generating API keys: {str(e)}")
              error_message = str(e)

              # Send failure response to CloudFormation
              cfnresponse.send(
                event,
                context,
                cfnresponse.FAILED,
                {},
                reason=f"Failed to generate API key: {error_message}",
              )

  ApiKeyGeneratorRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Tags:
        - Key: Name
          Value: !Sub "robosystems-graph-${Environment}-api-key-generator-role"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Lambda function for Graph API secret rotation
  SecretRotationLambda:
    Type: AWS::Lambda::Function
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FunctionName: !Sub "${AWS::StackName}-api-secret-rotation"
      Description: "Graph API Rotation Lambda - container-based deployment"
      PackageType: Image
      Architectures:
        - arm64
      Role: !GetAtt SecretRotationRole.Arn
      Timeout: 60
      MemorySize: 128
      Environment:
        Variables:
          SECRETS_MANAGER_ENDPOINT: !Sub https://secretsmanager.${AWS::Region}.amazonaws.com
      Code:
        ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command:
          - api_key_rotation.lambda_handler
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-api-secret-rotation"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # IAM role for rotation Lambda
  SecretRotationRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      RoleName: !Sub "robosystems-graph-${Environment}-secret-rotation-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: SecretRotationPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:DescribeSecret
                  - secretsmanager:GetSecretValue
                  - secretsmanager:PutSecretValue
                  - secretsmanager:UpdateSecretVersionStage
                Resource: !Ref GraphApiSecret
              # KMS permissions for secret rotation
              - Effect: Allow
                Action:
                  - kms:Decrypt
                  - kms:DescribeKey
                  - kms:GenerateDataKey
                Resource:
                  - !Sub "arn:${AWS::Partition}:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/secretsmanager"
                Condition:
                  StringEquals:
                    "kms:ViaService":
                      - !Sub "secretsmanager.${AWS::Region}.amazonaws.com"
              # ECR permissions for container-based Lambda
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !Sub "arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/robosystems"
      Tags:
        - Key: Name
          Value: !Sub "robosystems-graph-${Environment}-secret-rotation-role"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Rotation schedule associates the Lambda with the secret so Secrets Manager
  # knows which Lambda to invoke. Actual rotation cadence is managed by the
  # GitHub Actions workflow (secrets-rotation.yml) which orchestrates rotation +
  # service refresh atomically. The high AutomaticallyAfterDays prevents SM from
  # auto-triggering outside of the GHA workflow.
  SecretRotationSchedule:
    Type: AWS::SecretsManager::RotationSchedule
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    DependsOn:
      - LambdaInvokePermission
    Properties:
      SecretId: !Ref GraphApiSecret
      RotationLambdaARN: !GetAtt SecretRotationLambda.Arn
      RotationRules:
        AutomaticallyAfterDays: 1000
      RotateImmediatelyOnUpdate: false

  # Permission for Secrets Manager to invoke Lambda
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      FunctionName: !Ref SecretRotationLambda
      Action: lambda:InvokeFunction
      Principal: secretsmanager.amazonaws.com

  # ===== Monitoring Infrastructure =====
  # SNS Topic for Infrastructure Alerts
  InfraAlertTopic:
    Type: AWS::SNS::Topic
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      TopicName: !Sub robosystems-graph-${Environment}-infra-alerts
      DisplayName: !Sub "RoboSystems Graph Database ${Environment} Infrastructure Alerts"
      Tags:
        - Key: Name
          Value: !Sub "robosystems-graph-${Environment}-infra-alerts"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation
      Subscription:
        - Endpoint: !Ref SNSAlertEmail
          Protocol: email

  # Database capacity alarms
  DatabaseCapacityAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-database-capacity
      AlarmDescription: RoboSystems graph database capacity is running low
      MetricName: DatabaseUtilizationPercent
      Namespace: !Sub "RoboSystems/Graph/${Environment}"
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  # Registry table throttle alarms (tables are on-demand; throttles signal
  # burst beyond adaptive capacity or a hot key)
  InstanceRegistryReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-instance-registry-read-throttle
      MetricName: ReadThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref InstanceRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  InstanceRegistryWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-instance-registry-write-throttle
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref InstanceRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  GraphRegistryReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-graph-registry-read-throttle
      MetricName: ReadThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref GraphRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  GraphRegistryWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-graph-registry-write-throttle
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref GraphRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  VolumeRegistryReadThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-volume-registry-read-throttle
      MetricName: ReadThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref VolumeRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  VolumeRegistryWriteThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-volume-registry-write-throttle
      MetricName: WriteThrottleEvents
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref VolumeRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  # Registry table consumed-capacity alarms (on-demand billing, so these are
  # anomaly ceilings: registry traffic is tiny and sustained consumption at
  # this level means a runaway scan loop or abuse, not organic growth)
  InstanceRegistryConsumedReadAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-instance-registry-read-consumed
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref InstanceRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  InstanceRegistryConsumedWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-instance-registry-write-consumed
      MetricName: ConsumedWriteCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref InstanceRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  GraphRegistryConsumedReadAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-graph-registry-read-consumed
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref GraphRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  GraphRegistryConsumedWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-graph-registry-write-consumed
      MetricName: ConsumedWriteCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref GraphRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  VolumeRegistryConsumedReadAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-volume-registry-read-consumed
      MetricName: ConsumedReadCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref VolumeRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  VolumeRegistryConsumedWriteAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub robosystems-graph-${Environment}-volume-registry-write-consumed
      MetricName: ConsumedWriteCapacityUnits
      Namespace: AWS/DynamoDB
      Dimensions:
        - Name: TableName
          Value: !Ref VolumeRegistry
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  # Error alarms for this stack's Lambdas (key generation + secret rotation)
  ApiKeyGeneratorErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-key-generator-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${AWS::StackName}-api-key-generator"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  ApiSecretRotationErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AlarmName: !Sub ${AWS::StackName}-api-secret-rotation-errors
      MetricName: Errors
      Namespace: AWS/Lambda
      Dimensions:
        - Name: FunctionName
          Value: !Sub "${AWS::StackName}-api-secret-rotation"
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref InfraAlertTopic

  # ===== CloudWatch Log Groups =====
  # Unified log group for all Graph API instances
  # Log streams are partitioned by: {cluster_tier}/{instance_id}/{node_type}
  # Examples:
  #   - standard/i-1234567890abcdef0/writer
  #   - large/i-0987654321fedcba0/writer
  #   - shared/i-abcdef1234567890/shared_master
  GraphUnifiedLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub "/robosystems/${Environment}/graph-api"
      RetentionInDays: 30
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: GraphAPI
        - Key: Description
          Value: "Unified log group for all Graph API instances"

  # ========================================
  # GRAPH CONTAINER REFRESH
  # ========================================
  # Fans a container refresh out across the graph fleet with one tag-targeted SSM
  # command per node-type group. The per-instance logic lives on the instance in
  # refresh-graph-container.sh; this is the trigger and the aggregator.
  #
  # Its value over calling `aws ssm send-command` from a workflow is that the
  # platform gets a refresh path that is not GitHub Actions — an ops CLI command,
  # a post-image-push hook, or an Operator tool — with the rate-control defaults
  # applied in one place rather than at each caller.
  GraphContainerRefreshFunction:
    Type: AWS::Lambda::Function
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      FunctionName: !Sub "${AWS::StackName}-graph-container-refresh"
      Description: "Fleet-wide graph container refresh via tag-targeted SSM Run Command"
      PackageType: Image
      Architectures:
        - arm64
      # Dispatch and aggregation only — the 30-minute busy-wait happens on the
      # instance, which is precisely why this does not need to outlive it. A
      # Lambda that waited would exceed the 15-minute ceiling and pay to idle.
      Timeout: 120
      MemorySize: 256
      Role: !GetAtt GraphContainerRefreshRole.Arn
      Environment:
        Variables:
          ENVIRONMENT: !Ref Environment
          ALERT_TOPIC_ARN: !Ref InfraAlertTopic
      Code:
        ImageUri: !Ref LambdaImageUri
      ImageConfig:
        Command:
          - graph_container_refresh.lambda_handler
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-graph-container-refresh"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  GraphContainerRefreshRole:
    Type: AWS::IAM::Role
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: GraphContainerRefreshPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # SendCommand is scoped to the document AND to instances carrying
              # this environment's Service tag, so this role cannot be used to
              # run shell on arbitrary instances in the account.
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript"
              - Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub "arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*"
                Condition:
                  StringEquals:
                    ssm:resourceTag/Environment: !Ref Environment
                    ssm:resourceTag/Service: !Ref ServiceTag
              - Effect: Allow
                Action:
                  - ssm:ListCommands
                  - ssm:ListCommandInvocations
                  - ssm:GetCommandInvocation
                Resource: "*"
      Tags:
        - Key: Name
          Value: !Sub "${AWS::StackName}-graph-container-refresh-role"
        - Key: Environment
          Value: !Ref Environment
        - Key: Service
          Value: !Ref ServiceTag
        - Key: Component
          Value: !Ref ComponentTag
        - Key: CreatedBy
          Value: CloudFormation

  # Failure notification is push, not poll. Previously a failed refresh surfaced
  # only as a red job in a workflow someone had to be watching; nothing paged.
  # This fires regardless of whether anyone is looking at the run.
  GraphRefreshFailureRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-graph-refresh-failure"
      Description: Page when a graph container refresh invocation fails or times out
      State: ENABLED
      EventPattern:
        source:
          - aws.ssm
        detail-type:
          - EC2 Command Invocation Status-change Notification
        detail:
          status:
            - Failed
            - TimedOut
      Targets:
        - Id: infra-alerts-sns
          Arn: !Ref InfraAlertTopic
          InputTransformer:
            InputPathsMap:
              instance: $.detail.instance-id
              command: $.detail.command-id
              state: $.detail.status
            InputTemplate: !Sub >-
              "Graph container refresh <state> on instance <instance> (SSM command <command>)
              in ${Environment}. The container was left as-is; check the command output for
              REFRESH_RESULT and the instance's docker state."

  # A TopicPolicy replaces the topic's access policy wholesale, so the SNS
  # default same-account owner statement must be reproduced here — every
  # CloudWatch alarm in this stack publishes to this topic through it, and
  # omitting it would silence all of them.
  InfraAlertTopicPolicy:
    Type: AWS::SNS::TopicPolicy
    Properties:
      Topics:
        - !Ref InfraAlertTopic
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DefaultOwnerAccess
            Effect: Allow
            Principal:
              AWS: "*"
            Action:
              - sns:GetTopicAttributes
              - sns:SetTopicAttributes
              - sns:AddPermission
              - sns:RemovePermission
              - sns:DeleteTopic
              - sns:Subscribe
              - sns:ListSubscriptionsByTopic
              - sns:Publish
            Resource: !Ref InfraAlertTopic
            Condition:
              StringEquals:
                AWS:SourceOwner: !Ref AWS::AccountId
          - Sid: AllowEventBridgePublish
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sns:Publish
            Resource: !Ref InfraAlertTopic
            Condition:
              ArnLike:
                aws:SourceArn: !Sub "arn:${AWS::Partition}:events:${AWS::Region}:${AWS::AccountId}:rule/*"

Outputs:
  # CloudWatch Log Groups
  GraphUnifiedLogGroupName:
    Description: Unified CloudWatch log group for all Graph API instances
    Value: !Ref GraphUnifiedLogGroup
    Export:
      Name: !Sub "${AWS::StackName}-unified-log-group"

  # DynamoDB Table Names
  InstanceRegistryTableName:
    Description: DynamoDB table name for instance registry
    Value: !Ref InstanceRegistry
    Export:
      Name: !Sub "${AWS::StackName}-InstanceRegistryTable"

  GraphRegistryTableName:
    Description: DynamoDB table name for graph registry
    Value: !Ref GraphRegistry
    Export:
      Name: !Sub "${AWS::StackName}-GraphRegistryTable"

  # DynamoDB Table ARNs
  InstanceRegistryTableArn:
    Description: DynamoDB table ARN for instance registry
    Value: !GetAtt InstanceRegistry.Arn
    Export:
      Name: !Sub "${AWS::StackName}-InstanceRegistryTableArn"

  GraphRegistryTableArn:
    Description: DynamoDB table ARN for graph registry
    Value: !GetAtt GraphRegistry.Arn
    Export:
      Name: !Sub "${AWS::StackName}-GraphRegistryTableArn"

  VolumeRegistryTableName:
    Description: DynamoDB table name for volume registry
    Value: !Ref VolumeRegistry
    Export:
      Name: !Sub "${AWS::StackName}-VolumeRegistryTable"

  VolumeRegistryTableArn:
    Description: DynamoDB table ARN for volume registry
    Value: !GetAtt VolumeRegistry.Arn
    Export:
      Name: !Sub "${AWS::StackName}-VolumeRegistryTableArn"

  # Authentication
  SecretArn:
    Description: ARN of the Graph API authentication secret
    Value: !Ref GraphApiSecret
    Export:
      Name: !Sub "${AWS::StackName}-SecretArn"

  # Monitoring
  AlertTopicArn:
    Description: SNS topic ARN for infrastructure alerts
    Value: !Ref InfraAlertTopic
    Export:
      Name: !Sub "${AWS::StackName}-AlertTopicArn"

  # Published so callers never reconstruct the function name from the stack-name
  # convention. service-refresh.yml reads this output rather than string-building
  # it, so the name exists in exactly one place — here.
  GraphContainerRefreshFunctionName:
    Description: Lambda that fans a graph container refresh across the fleet
    Value: !Ref GraphContainerRefreshFunction
    Export:
      Name: !Sub "${AWS::StackName}-GraphContainerRefreshFunctionName"
