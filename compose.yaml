# The backend services mount the checkout over /app/robosystems only when
# their image is built here (ROBOSYSTEMS_IMAGE unset), so an edit applies on
# `just restart`. With a published image the mount lands under /mnt/checkout,
# where nothing reads it, and the image runs the release it was built from.
# The same holds for building: `just rebuild` sets ROBOSYSTEMS_LOCAL_PULL_POLICY
# to `build`, which only reaches a service whose own pull policy is unset.
services:
  # Robosystems API
  api:
    container_name: robosystems-api
    image: ${ROBOSYSTEMS_IMAGE:-robosystems-local}
    pull_policy: ${ROBOSYSTEMS_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/bin/entrypoint.sh
    environment:
      - DOCKER_PROFILE=api
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./robosystems:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/robosystems
    depends_on:
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "/app/bin/healthcheck.py", "http://robosystems-api:8000/v1/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: always
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-1g}
          cpus: "1"
        reservations:
          memory: 512m
          cpus: "0.5"
    profiles: ["api", "robosystems", "all"]

  # Graph API - Default LadybugDB Backend
  graph-api:
    container_name: robosystems-graph-api
    image: ${ROBOSYSTEMS_IMAGE:-robosystems-local}
    pull_policy: ${ROBOSYSTEMS_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/bin/entrypoint.sh
    environment:
      - DOCKER_PROFILE=ladybug-writer
      - GRAPH_BACKEND_TYPE=ladybug
      - LBUG_PORT=8001
      - LBUG_DATABASE_PATH=/app/data/lbug-dbs
      - LBUG_NODE_TYPE=writer
      - CLUSTER_TIER=ladybug-standard
      - LBUG_DATABASES_PER_INSTANCE=${LBUG_DATABASES_PER_INSTANCE:-50}
    env_file:
      - .env
    ports:
      - "8001:8001"
    volumes:
      - ./robosystems:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/robosystems
      - ./data/lbug-dbs:/app/data/lbug-dbs
      - ./data/staging:/app/data/staging
      - ./data/artifacts:/app/data/artifacts
      - ./data/lance:/app/data/lance
    healthcheck:
      test: ["CMD", "python3", "/app/bin/healthcheck.py", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          # Unlike prod, this one container holds every local graph (1GB each
          # plus admission-control headroom); 6g covers what the demos create.
          memory: ${GRAPH_API_MEMORY_LIMIT:-6g}
          cpus: "1.5"
        reservations:
          memory: 1g
          cpus: "1"
    profiles: ["graph-api", "lbug", "robosystems", "all"]

  # Dagster Webserver - Orchestration UI
  dagster-webserver:
    container_name: robosystems-dagster-webserver
    image: ${ROBOSYSTEMS_IMAGE:-robosystems-local}
    pull_policy: ${ROBOSYSTEMS_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/bin/entrypoint.sh
    environment:
      - DOCKER_PROFILE=dagster
    env_file:
      - .env
    ports:
      - "8002:8002"
    volumes:
      - ./robosystems:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/robosystems
      # Run logs and step outputs, shared by the two Dagster services.
      # dagster.yaml itself comes from the image.
      - ./dagster_home/storage:/app/dagster_home/storage
      - ./data/staging:/app/data/staging
      - ./data/artifacts:/app/data/artifacts
    depends_on:
      pg:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    # Runs dagster job execute locally (SEC processing, materialization, etc.)
    # Needs headroom for fastembed model + DuckDB + XBRL processing
    restart: always
    deploy:
      resources:
        limits:
          memory: ${DAGSTER_WEBSERVER_MEMORY_LIMIT:-8g}
          cpus: "4"
        reservations:
          memory: 1g
          cpus: "2"
    profiles: ["dagster", "robosystems", "all"]

  # Dagster Daemon - Schedules, Sensors, and Run Coordination
  dagster-daemon:
    container_name: robosystems-dagster-daemon
    image: ${ROBOSYSTEMS_IMAGE:-robosystems-local}
    pull_policy: ${ROBOSYSTEMS_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/bin/entrypoint.sh
    environment:
      - DOCKER_PROFILE=dagster-daemon
      - RUN_MIGRATIONS=true
    env_file:
      - .env
    volumes:
      - ./robosystems:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/robosystems
      # Boot migrations, and the library source they seed from, must match the
      # checkout, not the image
      - ./migrations:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/migrations
      - ./frameworks:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/frameworks
      - ./dagster_home/storage:/app/dagster_home/storage
      - ./data/staging:/app/data/staging
      - ./data/artifacts:/app/data/artifacts
    depends_on:
      pg:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: always
    deploy:
      resources:
        limits:
          memory: ${DAGSTER_DAEMON_MEMORY_LIMIT:-4g}
          cpus: "2"
        reservations:
          memory: 512m
          cpus: "0.5"
    profiles: ["dagster", "robosystems", "all"]

  # Background Task Worker
  worker:
    container_name: robosystems-worker
    image: ${ROBOSYSTEMS_IMAGE:-robosystems-local}
    pull_policy: ${ROBOSYSTEMS_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: .
      dockerfile: Dockerfile
    command: /app/bin/entrypoint.sh
    environment:
      - DOCKER_PROFILE=worker
    env_file:
      - .env
    volumes:
      - ./robosystems:${ROBOSYSTEMS_IMAGE:+/mnt/checkout}/app/robosystems
    depends_on:
      valkey:
        condition: service_healthy
      pg:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    restart: always
    deploy:
      resources:
        limits:
          memory: ${WORKER_MEMORY_LIMIT:-1g}
          cpus: "1"
        reservations:
          memory: 512m
          cpus: "0.5"
    profiles: ["worker", "robosystems", "all"]

  # Postgres - Database for RoboSystems
  pg:
    container_name: robosystems-pg
    image: postgres:16
    # Pinned rather than left to initdb, which can size a data directory at
    # its minimums (max_connections 20, shared_buffers 400kB). At those, the
    # stack's idle pool plus a parallel test run exhausts the server.
    # Command-line settings override postgresql.conf, so an existing data
    # directory picks these up when the container is recreated.
    # A parallel test run holds about 11 per worker, so 100 runs out on 14 cores.
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=128MB
      - -c
      - max_locks_per_transaction=256
    shm_size: 256mb
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=robosystems
    env_file:
      - .env
    ports:
      - 5432:5432
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./bin/setup/postgres-init.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 1s
      timeout: 5s
      retries: 10
    restart: always
    deploy:
      resources:
        limits:
          memory: ${PG_MEMORY_LIMIT:-1g}
          cpus: "1"
        reservations:
          memory: 512m
          cpus: "0.5"
    profiles: ["pg", "robosystems", "all"]

  # Valkey - Cache for RoboSystems
  valkey:
    container_name: robosystems-valkey
    image: valkey/valkey:8.1-alpine
    ports:
      - 6379:6379
    volumes:
      - valkey_data:/data
    command: valkey-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --requirepass ${VALKEY_AUTH_TOKEN:-valkey}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_AUTH_TOKEN:-valkey}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: ${VALKEY_MEMORY_LIMIT:-768m}
          cpus: "0.5"
        reservations:
          memory: 512m
          cpus: "0.25"
    profiles: ["valkey", "robosystems", "all"]

  # SeaweedFS - S3-compatible object storage, one all-in-one process on a volume
  seaweedfs:
    container_name: robosystems-seaweedfs
    image: chrislusf/seaweedfs:4.51
    # -ip is the address the volume server is reached on inside the container;
    # the service name resolves on the compose network. The identity file gives
    # the stack's "test" keys full access and anonymous reads on the public
    # bucket, which the browser fetches without credentials.
    command: >-
      mini -dir=/data -ip=seaweedfs
      -s3.config=/etc/seaweedfs/s3.json
      -master.volumeSizeLimitMB=1024 -master.telemetry=false
      -admin.ui=false -webdav=false -s3.port.iceberg=0 -s3.port.lance=0
    ports:
      - "8333:8333"
    volumes:
      - seaweedfs_data:/data
      - ./bin/setup/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always
    deploy:
      resources:
        limits:
          memory: ${SEAWEEDFS_MEMORY_LIMIT:-512m}
          cpus: "1"
        reservations:
          memory: 128m
          cpus: "0.25"
    profiles: ["seaweedfs", "robosystems", "all"]

  # DynamoDB Local - the graph and instance registries, on a volume
  dynamodb:
    container_name: robosystems-dynamodb
    image: amazon/dynamodb-local:3.3.2
    # The image runs as its own user, which cannot write a named volume Docker
    # creates as root; root is fine for a development store.
    user: root
    command: ["-jar", "DynamoDBLocal.jar", "-sharedDb", "-dbPath", "/home/dynamodblocal/data"]
    volumes:
      - dynamodb_data:/home/dynamodblocal/data
    restart: always
    deploy:
      resources:
        limits:
          memory: ${DYNAMODB_MEMORY_LIMIT:-512m}
          cpus: "0.5"
        reservations:
          memory: 128m
          cpus: "0.1"
    profiles: ["dynamodb", "robosystems", "all"]

  # Creates the buckets and registry tables once both stores answer, then exits
  storage-init:
    container_name: robosystems-storage-init
    image: amazon/aws-cli:2.39.6
    entrypoint: ["bash", "/storage-init.sh"]
    environment:
      - S3_ENDPOINT_URL=http://seaweedfs:8333
      - DYNAMODB_ENDPOINT_URL=http://dynamodb:8000
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_PAGER=
      - LBUG_DATABASES_PER_INSTANCE=${LBUG_DATABASES_PER_INSTANCE:-50}
      # The app origins the user bucket accepts browser uploads from.
      - ROBOSYSTEMS_URL=${ROBOSYSTEMS_URL:-http://localhost:3000}
      - ROBOLEDGER_URL=${ROBOLEDGER_URL:-http://localhost:3001}
      - ROBOINVESTOR_URL=${ROBOINVESTOR_URL:-http://localhost:3002}
    volumes:
      - ./bin/setup/storage-init.sh:/storage-init.sh:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
      dynamodb:
        condition: service_started
    restart: "no"
    profiles: ["storage-init", "robosystems", "all"]

  # Mailpit - the dev inbox: SMTP on 1025, web UI on 8025, messages in memory
  mailpit:
    container_name: robosystems-mailpit
    image: axllent/mailpit:v1.33.1
    ports:
      - 1025:1025
      - 8025:8025
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    deploy:
      resources:
        limits:
          memory: ${MAILPIT_MEMORY_LIMIT:-128m}
          cpus: "0.25"
        reservations:
          memory: 32m
    profiles: ["mailpit", "robosystems", "all"]

  # OpenSearch - Full-text search for filing narratives
  opensearch:
    container_name: robosystems-opensearch
    image: opensearchproject/opensearch:3
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    ports:
      - "9200:9200"
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf http://localhost:9200/_cluster/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: always
    deploy:
      resources:
        limits:
          memory: ${OPENSEARCH_MEMORY_LIMIT:-1g}
          cpus: "1"
        reservations:
          memory: 512m
          cpus: "0.5"
    profiles: ["opensearch", "robosystems", "all"]

  # OpenTelemetry Collector - Metrics and Tracing
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.106.0
    container_name: robosystems-otel-collector
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./robosystems/middleware/otel/config/otel-collector-config.yaml:/etc/otel/config.yaml
    ports:
      - "4318:4318" # OTLP HTTP receiver
      - "8889:8889" # Prometheus exporter
    restart: always
    profiles: ["observability"]

  # Prometheus - Metrics and Tracing
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: robosystems-prometheus
    volumes:
      - ./robosystems/middleware/otel/config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    restart: always
    profiles: ["observability"]

  # Grafana - Dashboard for Prometheus and OpenTelemetry
  grafana:
    image: grafana/grafana:11.2.1
    container_name: robosystems-grafana
    ports:
      - "4000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./robosystems/middleware/otel/config/datasources:/etc/grafana/provisioning/datasources
      - ./robosystems/middleware/otel/config/dashboards:/etc/grafana/provisioning/dashboards
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=password
      - GF_SECURITY_ADMIN_USER=admin
      - GF_INSTALL_PLUGINS=
    restart: always
    profiles: ["observability"]

  # RoboSystems App Frontend. The three apps take their URLs from the same .env
  # settings the API reads (ROBOSYSTEMS_API_URL, ROBOSYSTEMS_URL, ROBOLEDGER_URL,
  # ROBOINVESTOR_URL, AWS_S3_PRESIGN_ENDPOINT_URL), so a server on its own names
  # moves both sides with one edit. The published images inject them at start.
  robosystems-app:
    container_name: robosystems-app
    image: ${ROBOSYSTEMS_APP_IMAGE:-robosystems-app-local}
    pull_policy: ${ROBOSYSTEMS_APP_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: ../robosystems-app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=dev
      - NEXT_PUBLIC_ROBOSYSTEMS_API_URL=${ROBOSYSTEMS_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ROBOSYSTEMS_APP_URL=${ROBOSYSTEMS_URL:-http://localhost:3000}
      - NEXT_PUBLIC_ROBOLEDGER_APP_URL=${ROBOLEDGER_URL:-http://localhost:3001}
      - NEXT_PUBLIC_ROBOINVESTOR_APP_URL=${ROBOINVESTOR_URL:-http://localhost:3002}
      - NEXT_PUBLIC_S3_ENDPOINT_URL=${AWS_S3_PRESIGN_ENDPOINT_URL:-http://localhost:8333}
      - NEXT_PUBLIC_MAINTENANCE_MODE=true
    ports:
      - 3000:3000
    restart: always
    deploy:
      resources:
        limits:
          memory: ${ROBOSYSTEMS_APP_MEMORY_LIMIT:-512m}
          cpus: "0.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    profiles: ["robosystems-app", "apps", "all"]

  # RoboLedger App Frontend
  roboledger-app:
    container_name: roboledger-app
    image: ${ROBOLEDGER_APP_IMAGE:-roboledger-app-local}
    pull_policy: ${ROBOLEDGER_APP_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: ../roboledger-app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=dev
      - NEXT_PUBLIC_ROBOSYSTEMS_API_URL=${ROBOSYSTEMS_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ROBOSYSTEMS_APP_URL=${ROBOSYSTEMS_URL:-http://localhost:3000}
      - NEXT_PUBLIC_ROBOLEDGER_APP_URL=${ROBOLEDGER_URL:-http://localhost:3001}
      - NEXT_PUBLIC_ROBOINVESTOR_APP_URL=${ROBOINVESTOR_URL:-http://localhost:3002}
      - NEXT_PUBLIC_S3_ENDPOINT_URL=${AWS_S3_PRESIGN_ENDPOINT_URL:-http://localhost:8333}
      - NEXT_PUBLIC_MAINTENANCE_MODE=true
    ports:
      - 3001:3000
    restart: always
    deploy:
      resources:
        limits:
          memory: ${ROBOLEDGER_APP_MEMORY_LIMIT:-512m}
          cpus: "0.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    profiles: ["roboledger-app", "apps", "all"]

  # RoboInvestor App Frontend
  roboinvestor-app:
    container_name: roboinvestor-app
    image: ${ROBOINVESTOR_APP_IMAGE:-roboinvestor-app-local}
    pull_policy: ${ROBOINVESTOR_APP_PULL_POLICY:-${ROBOSYSTEMS_LOCAL_PULL_POLICY:-never}}
    build:
      context: ../roboinvestor-app
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=development
      - ENVIRONMENT=dev
      - NEXT_PUBLIC_ROBOSYSTEMS_API_URL=${ROBOSYSTEMS_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_ROBOSYSTEMS_APP_URL=${ROBOSYSTEMS_URL:-http://localhost:3000}
      - NEXT_PUBLIC_ROBOLEDGER_APP_URL=${ROBOLEDGER_URL:-http://localhost:3001}
      - NEXT_PUBLIC_ROBOINVESTOR_APP_URL=${ROBOINVESTOR_URL:-http://localhost:3002}
      - NEXT_PUBLIC_S3_ENDPOINT_URL=${AWS_S3_PRESIGN_ENDPOINT_URL:-http://localhost:8333}
      - NEXT_PUBLIC_FILINGS_CDN_URL=${AWS_S3_PRESIGN_ENDPOINT_URL:-http://localhost:8333}/robosystems-public-data
      - NEXT_PUBLIC_MAINTENANCE_MODE=true
    ports:
      - 3002:3000
    restart: always
    deploy:
      resources:
        limits:
          memory: ${ROBOINVESTOR_APP_MEMORY_LIMIT:-512m}
          cpus: "0.5"
        reservations:
          memory: 256m
          cpus: "0.25"
    profiles: ["roboinvestor-app", "apps", "all"]

volumes:
  prometheus_data:
  grafana_data:
  # The stateful stores live in named volumes rather than bind mounts under
  # ./data: on macOS a bind mount's emulated ownership can break Postgres's
  # first-boot setup, so the robosystems database is never created. Fixed
  # names so `just clean-volumes` can remove them.
  pg_data:
    name: robosystems-pg-data
  valkey_data:
    name: robosystems-valkey-data
  opensearch_data:
    name: robosystems-opensearch-data
  seaweedfs_data:
    name: robosystems-seaweedfs-data
  dynamodb_data:
    name: robosystems-dynamodb-data
